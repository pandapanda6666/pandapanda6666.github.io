<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探險者百科 (Seekerpedia)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo" title="回首頁">
                <div class="bear">
                    <svg viewBox="0 0 100 60" class="bear-svg">
                        <!-- 後面的腿 (較暗) -->
                        <g class="bear-leg bear-leg-back-left" transform="translate(30, 35)">
                            <rect x="-4" y="0" width="8" height="20" rx="4" fill="#5c2e0b" />
                        </g>
                        <g class="bear-leg bear-leg-back-right" transform="translate(70, 35)">
                            <rect x="-4" y="0" width="8" height="20" rx="4" fill="#5c2e0b" />
                        </g>
                        
                        <!-- 身體與頭部 (棕色) -->
                        <path class="bear-body" d="M 15 35 C 10 20 30 10 50 15 C 70 20 85 10 95 25 C 98 30 90 40 80 40 L 25 40 C 15 40 18 35 15 35 Z" fill="#8B4513" />
                        <!-- 圓圓的熊耳與鼻子 -->
                        <circle cx="85" cy="18" r="4" fill="#8B4513" />
                        <circle cx="95" cy="22" r="2" fill="#333" />
                        <!-- 尾巴 -->
                        <circle cx="15" cy="30" r="5" fill="#8B4513" />

                        <!-- 前面的腿 (棕色) -->
                        <g class="bear-leg bear-leg-front-left" transform="translate(25, 35)">
                            <rect x="-4" y="0" width="8" height="20" rx="4" fill="#8B4513" />
                        </g>
                        <g class="bear-leg bear-leg-front-right" transform="translate(75, 35)">
                            <rect x="-4" y="0" width="8" height="20" rx="4" fill="#8B4513" />
                        </g>
                    </svg>
                </div>
                <div class="logo-text">
                    <div class="zh-text">探險者百科</div>
                    <div class="en-text">Seekerpedia</div>
                </div>
            </div>
        </div>
        <div class="nav-right">
            <select id="langSelect">
                <option value="zh">繁體中文</option>
                <option value="en">English</option>
            </select>
            <a href="#" id="aboutBtn">關於本站</a>
        </div>
    </nav>

    <div class="mode-selector">
        <button id="browseModeBtn" class="active">瀏覽者模式</button>
        <button id="createModeBtn">創造者模式</button>
    </div>

    <div class="container" id="page-home">
        <h2>歡迎來到探險者百科</h2>
        <p>在這裡，您可以探索各種作品的設定與世界觀，或者親手建立屬於您的百科！</p>
        <p>請於上方選擇您想進入的模式。</p>
    </div>

    <div class="container hidden" id="page-about">
        <h2>關於本站</h2>
        <p>探險者百科 (Seekerpedia) 是一個致力於記錄各類作品（小說、漫畫、電影等）世界觀與設定的共筆平台。</p>
        <p>MediaWiki架構概念應用，資料即時連動至伺服器端。</p>
    </div>

    <!-- Creator Mode Pages -->
    <div class="container hidden" id="page-create">
        <h2>建立百科</h2>
        <form id="createForm">
            <label>百科/作品名稱:</label>
            <input type="text" id="workName" required placeholder="例如：哈利波特">
            <label>介紹:</label>
            <textarea id="workIntro" rows="3" placeholder="簡述此作品..."></textarea>
            <label>分類:</label>
            <input type="text" id="workCategory" placeholder="例如: 小說, 漫畫, 電影">
            <label>設定 (整體世界觀等):</label>
            <textarea id="workSettings" rows="3"></textarea>
            <button type="submit">建立作品百科</button>
        </form>
    </div>

    <div class="container hidden" id="page-edit">
        <h2>編輯百科 (設定分類及條目)</h2>
        <select id="editWorkSelect"><option value="">選擇要編輯的作品</option></select>
        
        <div id="editWorkPanel" class="hidden">
            <h3 style="margin-top:20px; border-bottom: 2px solid #4a6c42; padding-bottom: 5px;">新增條目</h3>
            <label>條目分類 (例如：人物、地點、魔法):</label>
            <input type="text" id="entryCategory" placeholder="分類名稱">
            <label>條目標題 (例如：鄧不利多):</label>
            <input type="text" id="entryTitle" placeholder="標題">
            <label>內容:</label>
            <textarea id="entryContent" rows="4" placeholder="詳細內容..."></textarea>
            <button id="addEntryBtn">新增條目</button>

            <h3 style="margin-top:20px; border-bottom: 2px solid #ccc; padding-bottom: 5px;">現有條目管理</h3>
            <div id="editEntryList"></div>
        </div>
    </div>

    <!-- Browse Mode Pages -->
    <div class="container hidden" id="page-browse">
        <h2>瀏覽百科</h2>
        <div class="browse-layout">
            <div class="sidebar">
                <h3>作品列表</h3>
                <ul id="browseWorkList"></ul>
            </div>
            <div class="content">
                <div id="browseWorkDetail" class="hidden">
                    <h2 id="bTitle" style="border-bottom: 2px solid #4a6c42; padding-bottom: 10px;"></h2>
                    <p id="bIntro" style="font-size: 1.1em; color: #555;"></p>
                    <div class="meta" id="bMeta" style="background: #eee; padding: 10px; border-radius: 5px;"></div>
                    <hr>
                    <div class="categories">
                        <h3>目錄 / 分類</h3>
                        <ul id="bCategoryList" style="display:flex; gap:10px; flex-wrap:wrap;"></ul>
                    </div>
                    <div id="bEntryDetail" class="hidden" style="margin-top:20px; padding:20px; border:1px solid #ddd; border-radius:5px; background:#fafafa;">
                        <h3 id="bEntryTitle" style="color: #4a6c42;"></h3>
                        <p id="bEntryContent" style="white-space: pre-wrap;"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
