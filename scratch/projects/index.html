<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PandaScratch 專案</title>
    <!-- 請記得將此網頁的網址，加入伺服器管理面板的 CORS 授權網域白名單中，否則會無法連線 -->
    <link rel="shortcut icon" href="editor/static/favicon.ico">
    <style>
        * { box-sizing: border-box; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
        body { margin: 0; padding: 0; background-color: #f2f2f2; overflow-x: hidden; }
        
        /* Navbar placeholder */
        #panda-navbar { width: 100%; height: 50px; background-color: #4CAF50; display: flex; align-items: center; padding: 0 20px; color: white; }
        
        /* Share Banner */
        #share-banner {
            display: none; /* hidden by default, shown if unshared and owner */
            background-color: #ffcc99;
            width: 100%;
            padding: 10px 20px;
            text-align: center;
            font-size: 14px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        #share-banner.active { display: flex; }
        #share-banner button {
            background-color: #ff8c1a;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        #share-banner button:hover { background-color: #e67e17; }
        #share-banner button.shared { background-color: #4CAF50; }
        
        /* Main Container */
        .container { max-width: 960px; margin: 0 auto; padding: 20px; background: white; min-height: 80vh; }
        
        /* Header Row */
        .project-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .title-area { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 48px; height: 48px; border-radius: 4px; background: #e0e0e0; object-fit: cover; border: 1px solid #ccc; }
        .title-input { font-size: 24px; font-weight: bold; border: 1px dashed transparent; padding: 5px; width: 400px; color: #575E75; background: transparent; }
        .title-input:focus { border-color: #4CAF50; outline: none; background: #f9f9f9; }
        .title-input[readonly] { border: none; outline: none; background: transparent; pointer-events: none; }
        .see-inside-btn {
            background-color: #855cd6;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 4px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            border: none;
        }
        .see-inside-btn:hover { background-color: #744bce; }
        
        /* Content Row */
        .content-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .player-container { flex: 0 0 480px; height: 360px; border: 1px solid #d9d9d9; border-radius: 8px; overflow: hidden; background: #f9f9f9; position: relative; }
        .player-iframe { width: 100%; height: 100%; border: none; }
        
        .info-container { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .info-box { border: 1px solid #d9d9d9; border-radius: 8px; padding: 15px; background: #f9f9f9; flex: 1; display: flex; flex-direction: column; }
        .info-box h3 { margin: 0 0 10px 0; font-size: 14px; color: #575E75; }
        .info-textarea { 
            flex: 1; width: 100%; border: 1px dashed transparent; background: transparent; 
            resize: none; font-size: 13px; color: #333; padding: 5px; min-height: 100px; 
        }
        .info-textarea:focus { border-color: #4CAF50; outline: none; background: white; }
        .info-textarea[readonly] { border: none; pointer-events: none; }
        
        /* Stats Row */
        .stats-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e0e0e0; padding-top: 15px; color: #575E75; font-size: 14px; margin-bottom: 30px; }
        .stats-left { display: flex; gap: 15px; align-items: center; }
        .stat-item { display: flex; align-items: center; gap: 5px; }
        .stat-item img { width: 16px; height: 16px; opacity: 0.6; }
        .stats-right { font-weight: bold; color: #999; }
        
        /* Comments */
        .comments-section { background-color: #e6f0ff; padding: 20px; border-radius: 8px; }
        .comments-header { display: flex; justify-content: space-between; align-items: center; color: #575E75; font-weight: bold; margin-bottom: 15px; }
        
        /* Footer */
        .footer { text-align: center; padding: 20px; font-size: 12px; color: #888; background: #f2f2f2; }
        .footer a { color: #855cd6; text-decoration: none; }
        
        /* 404 Overlay */
        #error-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f2f2f2; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        #error-overlay.active { display: flex; }
        #error-overlay h1 { color: #575E75; }
    </style>
</head>
<body>

    <!-- Error Overlay -->
    <div id="error-overlay">
        <h1>Oops! 找不到專案或您沒有權限查看</h1>
        <button class="see-inside-btn" onclick="window.location.href='../'">回到首頁</button>
    </div>

    <!-- Banner -->
    <div id="share-banner" style="display:none;">
        <span id="share-text">此專案未分享 — 所以只有你自己看得到它。點擊分享，就能讓其他人也能欣賞你的作品！</span>
        <button id="btn-toggle-share" onclick="toggleShare()">分享</button>
    </div>

    <!-- Fake Navbar for Demo (Panda SSO handles real login UI usually, but we need a bar) -->
    <div id="panda-navbar">
        <img src="editor/static/scratch-logo.svg" style="height: 30px; cursor:pointer;" onclick="window.location.href='../'">
        <div id="custom-sso-nav-wrapper" style="margin-left: auto;"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="project-header">
            <div class="title-area">
                <img id="owner-avatar" class="avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                <input type="text" id="project-title" class="title-input" value="載入中..." readonly onblur="saveMetadata()">
            </div>
            <button class="see-inside-btn" onclick="goToEditor()">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="white"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
                切換到程式頁面
            </button>
        </div>

        <!-- Content -->
        <div class="content-row">
            <div class="player-container">
                <iframe id="player-iframe" class="player-iframe" src=""></iframe>
            </div>
            <div class="info-container">
                <div class="info-box">
                    <h3>操作說明</h3>
                    <textarea id="project-instructions" class="info-textarea" placeholder="按下什麼按鍵會有什麼反應？遊戲過關的條件是什麼？在這兒告訴其他人怎麼操作你的專案！" readonly onblur="saveMetadata()"></textarea>
                </div>
                <div class="info-box">
                    <h3>備註與謝誌</h3>
                    <textarea id="project-notes" class="info-textarea" placeholder="有用到其他人的點子、圖片、音樂、程式嗎？在這兒感謝他們吧！" readonly onblur="saveMetadata()"></textarea>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stats-left">
                <div class="stat-item">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="#999"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <span id="stat-loves">0</span>
                </div>
                <div class="stat-item">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="#999"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    <span id="stat-favorites">0</span>
                </div>
                <div class="stat-item">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="#999"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    <span id="stat-remixes">0</span>
                </div>
                <div class="stat-item">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="#999"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    <span id="stat-views">0</span>
                </div>
            </div>
            <div class="stats-right" id="share-status-text">
                未分享
            </div>
        </div>

        <!-- Comments -->
        <div class="comments-section">
            <div class="comments-header">
                <span>評論</span>
                <span>啟用評論功能 <input type="checkbox" checked disabled></span>
            </div>
            <div style="text-align: center; color: #888; font-size: 14px; padding: 20px;">
                目前暫無評論。
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        版權所有 © 2026 <a href="https://pandapanda6666.github.io" target="_blank">PandaPanda的AI日常</a> All Rights Reserved.
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="../panda_sso.js?v=119"></script>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');
        let projectData = {};
        let isOwner = false;

        document.addEventListener('DOMContentLoaded', () => {
            if (!projectId) {
                document.getElementById('error-overlay').classList.add('active');
                return;
            }

            // Load iframe
            document.getElementById('player-iframe').src = `editor/player/?id=${projectId}`;

            // Load Metadata
            if (typeof window.socket !== 'undefined') {
                if (window.socket.connected) {
                    fetchMetadata();
                } else {
                    window.socket.on('connect', fetchMetadata);
                }
            } else {
                alert("未偵測到 Socket.io 連線");
            }
        });

        function fetchMetadata() {
            window.socket.emit('getAppData', { appId: projectId }, (res) => {
                if (!res || !res.data) {
                    document.getElementById('error-overlay').classList.add('active');
                    return;
                }
                
                projectData = res.data;
                const currentUser = localStorage.getItem('panda_session_user') || localStorage.getItem('sso_nickname');
                isOwner = currentUser && projectData.owner && currentUser === projectData.owner;
                
                // Permission Check
                if (!projectData.is_shared && !isOwner) {
                    document.getElementById('error-overlay').classList.add('active');
                    return;
                }

                // Populate fields
                document.getElementById('project-title').value = projectData.projectName || 'Scratch 專案';
                document.getElementById('project-instructions').value = projectData.instructions || '';
                document.getElementById('project-notes').value = projectData.notes || '';
                if(projectData.avatar) document.getElementById('owner-avatar').src = projectData.avatar;
                if(projectData.views !== undefined) document.getElementById('stat-views').innerText = projectData.views;

                // Make editable if owner
                if (isOwner) {
                    document.getElementById('project-title').removeAttribute('readonly');
                    document.getElementById('project-instructions').removeAttribute('readonly');
                    document.getElementById('project-notes').removeAttribute('readonly');
                    
                    const banner = document.getElementById('share-banner');
                    banner.style.display = 'flex';
                    updateShareUI();
                } else {
                    document.getElementById('share-status-text').innerText = '已分享';
                }
            });
        }

        function updateShareUI() {
            const btn = document.getElementById('btn-toggle-share');
            const text = document.getElementById('share-text');
            const status = document.getElementById('share-status-text');
            
            if (projectData.is_shared) {
                btn.innerText = '已分享';
                btn.classList.add('shared');
                text.innerText = '此專案已分享 — 所有人都能欣賞你的作品！';
                text.style.color = '#333';
                document.getElementById('share-banner').style.backgroundColor = '#e6f0ff';
                status.innerText = '已分享';
            } else {
                btn.innerText = '分享';
                btn.classList.remove('shared');
                text.innerText = '此專案未分享 — 所以只有你自己看得到它。點擊分享，就能讓其他人也能欣賞你的作品！';
                document.getElementById('share-banner').style.backgroundColor = '#ffcc99';
                status.innerText = '未分享';
            }
        }

        function toggleShare() {
            if (!isOwner) return;
            const newSharedState = !projectData.is_shared;
            window.socket.emit('saveAppData', { 
                appId: projectId, 
                data: { is_shared: newSharedState } 
            });
            projectData.is_shared = newSharedState;
            updateShareUI();
        }

        function saveMetadata() {
            if (!isOwner) return;
            const title = document.getElementById('project-title').value;
            const instructions = document.getElementById('project-instructions').value;
            const notes = document.getElementById('project-notes').value;
            
            window.socket.emit('saveAppData', { 
                appId: projectId, 
                projectName: title,
                data: { instructions: instructions, notes: notes } 
            });
        }

        function goToEditor() {
            window.location.href = `editor/?id=${projectId}`;
        }
    </script>
</body>
</html>
