<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google" value="notranslate">
    <link rel="shortcut icon" href="static/favicon.ico">
    <title>PandaScratch</title>
    
  
<!-- PANDASCRATCH INJECT START -->
<style>
﻿/* 隱藏原生多餘元素與登入區塊 */
div[class*="menu-bar_account-info-wrapper_"],
div[class*="menu-bar_account-info-group_"]:not(#custom-sso-nav-wrapper),
div[class*="menu-bar_login-button_"],
div[class*="menu-bar_register-button_"],
.panda-hidden-lang {
    display: none !important;
}

/* 熊積木風格 (綠旗) */
body.bear-style div[class*="green-flag_green-flag-wrapper_"]::after { 
    content: ''; position: absolute; top: -4px; width: 12px; height: 12px; 
    background-color: #81C784; border-radius: 50%; z-index: 10; border: 1.5px solid #4CAF50; 
}
/* 高對比模式 */
body.high-contrast { filter: contrast(1.2) saturate(1.1); }

/* --- 熊積木全域綠化 CSS 覆蓋 --- */
:root {
    --panda-green: #81C784;
    --panda-dark-green: #4CAF50;
}
div[class*="menu-bar_menu-bar_"],
[class*="button_mod-primary_"],
[class*="share-button_share-button_"],
[class*="community-button_community-button_"],
[class*="gui_extension-button_"],
[class*="action-menu_button_"],
[class*="action-menu_more-buttons_"],
[class*="react-tabs_react-tabs__tab--selected_"],
[class*="library-item_featured-extension-metadata_"],
.scratchCategoryMenuItem.categorySelected {
    background-color: var(--panda-green) !important;
}

/* 確保檔案和編輯的下拉選單背景為綠色 */
ul[class*="menu_menu_"],
ul[class*="menu-bar_menu-bar-menu_"] {
    background-color: var(--panda-green) !important;
}

/* 將擴充功能等 Modal 的藍色標題列改為綠色 */
div[class*="modal_header_"] {
    background-color: var(--panda-green) !important;
}

/* 將藍色的載入畫面改為綠色 */
div[class*="loader_background_"],
div[class*="loader_fullscreen_"] {
    background-color: var(--panda-green) !important;
}

/* 確保下拉選單 hover 時也變綠色, 包括教程(Tutorials)和選單按鈕 */
[class*="menu-item_menu-item_"]:hover,
[class*="menu-item_hoverable_"]:hover,
[class*="menu_menu_"] li:hover,
[class*="context-menu_menu-item_"]:hover,
div[class*="menu-bar_menu-bar-item_"]:hover,
div[class*="menu-bar_active_"] {
    background-color: var(--panda-dark-green) !important;
    color: white !important;
}

[class*="sprite-selector-item_is-selected_"] {
    border-color: var(--panda-green) !important;
}
input:focus,
[class*="prompt_input_"]:focus,
[class*="input_input-form_"]:focus {
    border-color: var(--panda-green) !important;
    box-shadow: 0 0 0 4px rgba(129, 199, 132, 0.25) !important;
}

/* Custom Settings Menu CSS */
.panda-settings-btn {
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 0 12px;
    height: 100%;
    color: white !important;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 0.85rem;
}
.panda-settings-btn:hover, .panda-settings-btn.active, .panda-sso-nav.active {
    background-color: var(--panda-dark-green) !important;
}

.panda-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    background: var(--panda-green);
    border-radius: 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    padding: 4px 0;
    margin: 0;
    list-style: none;
    border: 1px solid rgba(0,0,0,0.15);
    min-width: 160px;
    z-index: 10000;
}
.panda-dropdown.left { left: 0; }
.panda-dropdown.right { right: 0; }
.panda-settings-btn.active > .panda-dropdown, .panda-sso-nav:hover > .panda-dropdown, .panda-sso-nav.active > .panda-dropdown {
    display: block;
}

.panda-dropdown li {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px !important;
    font-size: 0.85rem !important;
    font-weight: bold !important;
    cursor: pointer;
    white-space: nowrap;
    color: white !important;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif !important;
}
.panda-dropdown li > .panda-dropdown li > .panda-dropdown li > .panda-dropdown li > .panda-dropdown li > span { display: flex; align-items: center; gap: 8px; }
.panda-dropdown li:hover {
    background-color: var(--panda-dark-green) !important;
}

/* Nested Submenu (Level 2) */
.panda-submenu {
    display: none;
    position: absolute;
    top: 0;
    left: 100%;
    background: var(--panda-green);
    border-radius: 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    padding: 4px 0;
    margin: 0;
    list-style: none;
    border: 1px solid rgba(0,0,0,0.15);
    min-width: 160px;
    z-index: 10001;
}
/* Open submenu on hover of the parent li */
.panda-dropdown li:hover > .panda-submenu {
    display: block;
}

/* Checkmark icons */
.panda-check { visibility: hidden; margin-left: 10px; }
.panda-check.active { visibility: visible; }




﻿/* =========================================
   PANDA ULTIMATE GREEN OVERRIDE FOR SCRATCH
   ========================================= */

/* 覆蓋教程按鈕懸浮與選中狀態 */
[class*="menu-bar_menu-bar-item_"]:hover,
[class*="menu-bar_active_"],
[class*="menu-bar_hoverable_"]:hover {
    background-color: var(--panda-dark-green) !important;
}

/* 覆蓋添加角色與背景按鈕 (懸浮選單與加號按鈕) */
[class*="action-menu_button_"],
[class*="action-menu_more-buttons_"],
[class*="action-menu_more-buttons-outer_"] {
    background-color: var(--panda-green) !important;
}
[class*="action-menu_more-buttons_"] {
    background-color: var(--panda-dark-green) !important;
}
[class*="action-menu_button_"]:hover,
[class*="action-menu_more-buttons_"] button:hover {
    background-color: var(--panda-dark-green) !important;
    box-shadow: 0 0 0 4px rgba(129, 199, 132, 0.25) !important;
}
[class*="action-menu_tooltip_"]::after,
[class*="action-menu_tooltip_"] {
    background-color: var(--panda-dark-green) !important;
}

/* 覆蓋角色資訊欄 (大小、方向的 input focus) */
input:focus,
textarea:focus,
[class*="input_input-form_"]:focus,
[class*="input_input-form_"]:focus-within,
[class*="prompt_input_"]:focus {
    border-color: var(--panda-green) !important;
    box-shadow: 0 0 0 4px rgba(129, 199, 132, 0.25) !important;
}

/* Radio buttons & Toggles (X/Y, 方向) */
[class*="sprite-info_radio_"]:checked + label,
[class*="radio_radio_"]:checked + label {
    background-color: var(--panda-green) !important;
    color: white !important;
    border-color: var(--panda-dark-green) !important;
}

/* 舞台區塊調整按鈕 (小/大/全螢幕) */
[class*="stage-header_stage-button_"].is-active,
[class*="stage-header_stage-button_"]:hover,
[class*="stage-header_stage-button_"][class*="active_"],
[class*="stage-header_stage-button_"][class*="stage-header_active_"] {
    background-color: var(--panda-green) !important;
}

/* 擴充套件目錄與素材庫 (Featured extensions, sounds, etc) */
[class*="library-item_library-item_"]:hover,
[class*="library-item_featured-extension-metadata_"] {
    border-color: var(--panda-green) !important;
}
[class*="library-item_featured-extension-metadata_"] {
    background-color: var(--panda-green) !important;
}
[class*="library-item_library-item-extension_"]:hover {
    border-color: var(--panda-dark-green) !important;
}

/* 滾輪 (Scrollbar) - Webkit */
::-webkit-scrollbar-thumb {
    background-color: var(--panda-green) !important;
    border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
    background-color: var(--panda-dark-green) !important;
}
::-webkit-scrollbar-track {
    background-color: transparent !important;
}

/* Tabs */
[class*="react-tabs_react-tabs__tab--selected_"] {
    background-color: var(--panda-green) !important;
    color: white !important;
}

/* 一般 Mod-Primary 按鈕 */
[class*="button_mod-primary_"] {
    background-color: var(--panda-green) !important;
}
[class*="button_mod-primary_"]:hover {
    background-color: var(--panda-dark-green) !important;
}

/* Checkboxes */
[class*="checkbox_checkbox_"]:checked {
    background-color: var(--panda-green) !important;
    border-color: var(--panda-dark-green) !important;
}


﻿
/* --- Panda Extra Green Overrides for Light Blue Areas --- */

/* Light Blue Backgrounds in Scratch (Costume list, libraries, sprite selector) */
[class*="asset-panel_wrapper_"],
[class*="sprite-selector_sprite-selector_"],
[class*="library_library-scroll-grid_"],
[class*="selector_wrapper_"],
[class*="paint-editor_paint-editor_"] {
    background-color: #e8f5e9 !important; /* light green */
}

/* Selected Items (Costume/Sprite borders & backgrounds) */
[class*="sprite-selector-item_is-selected_"],
[class*="asset-panel_is-selected_"],
[class*="library-item_is-selected_"] {
    border-color: var(--panda-dark-green) !important;
    background-color: #c8e6c9 !important; /* medium light green */
}

/* Paint editor tools background (top right box for copy/paste/etc) */
[class*="button-group_button-group_"] {
    background-color: transparent !important;
}

</style>
<script>
﻿// Function to change language by triggering native click
window.pandaSetLanguage = function(langCode) {
    document.cookie = "scratchlanguage=" + langCode + "; expires=Thu, 31 Dec 2037 23:59:59 GMT; path=/";
    if (window.localStorage) {
        window.localStorage.setItem('scratch-language', langCode);
    }
    window.location.reload();
};

document.addEventListener('DOMContentLoaded', () => {
    const observer = new MutationObserver((mutations) => {
        const menuBar = document.querySelector('.menu-bar_menu-bar_1gLUp') || document.querySelector('div[class*="menu-bar_menu-bar_"]');
        
        // Click Scratch Logo
        const logoImgs = document.querySelectorAll('img[class*="menu-bar_scratch-logo_"]');
        logoImgs.forEach(logoImg => {
            if (!logoImg.dataset.injected) {
                logoImg.dataset.injected = 'true';
                const wrapper = logoImg.closest('a') || logoImg.closest('div[class*="menu-bar_menu-bar-item_"]');
                if (wrapper) {
                    wrapper.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        window.location.href = 'https://pandapanda6666.github.io/scratch';
                    }, true);
                }
            }
        });
        
        const langMenu = document.querySelector('div[class*="menu-bar_language-menu_"]');
        if (langMenu && !langMenu.dataset.active) {
            langMenu.classList.add('panda-hidden-lang');
        }
          
        if (langMenu && !document.getElementById('custom-settings-menu')) {
            const settingsDiv = document.createElement('div');
            settingsDiv.id = 'custom-settings-menu';
            settingsDiv.className = 'panda-settings-btn';
            
            let bearEnabled = localStorage.getItem('panda-bear-style') === 'true';
            let highContrast = localStorage.getItem('panda-high-contrast') === 'true';
            
            settingsDiv.innerHTML = `
                <span id="btn-settings-toggle" style="display:flex;align-items:center;height:100%;">
                    <span style="display:flex;align-items:center;gap:6px;">
                        <svg class="panda-icon" viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6c-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2c-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.3-28.2 18.9-44 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8c-13.8 2.3-28 3.5-42.5 3.5s-28.7-1.2-42.5-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.8-6.5-30.6-15.1-44-25.4L83.1 425.9c-8.8 2.8-18.6 .3-24.5-6.8c-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L22.4 191.2c-6.9-6.2-9.6-15.9-6.4-24.6c4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6 11 14-21.4 22.1-31.2c5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.3 28.2-18.9 44-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.5 0 256 0s28.7 1.2 42.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.8 6.5 30.6 15.1 44 25.4l55.7-17.7c8.8-2.8 18.6-.3 24.5 6.8c8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z"/></svg>
                        設定
                    </span>
                    <svg class="panda-icon" viewBox="0 0 320 512" width="10" height="10" fill="currentColor" style="margin-left:6px;"><path d="M137.4 374.6c12.5 12.5 32.8 12.5 45.3 0l128-128c9.2-9.2 11.9-22.9 6.9-34.9s-16.6-19.8-29.6-19.8L32 192c-12.9 0-24.6 7.8-29.6 19.8s-2.2 25.7 6.9 34.9l128 128z"/></svg>
                </span>
                <ul class="panda-dropdown left">
                    <li onmousedown="event.stopPropagation()">
                        <span><svg class="panda-icon" viewBox="0 0 496 512" width="16" height="16" fill="currentColor"><path d="M248 8C111 8 0 119 0 256s111 248 248 248 248-111 248-248S385 8 248 8zm160.3 144.1H324c-7.3-39.7-19-75-34.1-105 53.6 16.3 98.7 51.5 118.4 105zM248 48.7c18.3 32.7 32.4 72.8 40.5 115.4H207.5c8.1-42.6 22.2-82.7 40.5-115.4zm-70.1 5.3c-15.1 30-26.8 65.3-34.1 105H59.7C79.4 105.5 124.5 70.3 177.9 54zM48 256c0-18.4 2.4-36.2 6.8-53.1h136.2c-1.8 17.1-2.9 34.7-2.9 53.1s1.1 36 2.9 53.1H54.8C50.4 292.2 48 274.4 48 256zm28.3 90.9h83.9c7.3 39.7 19 75 34.1 105-53.5-16.3-98.6-51.5-118-105zM248 463.3c-18.3-32.7-32.4-72.8-40.5-115.4h81.1c-8.1 42.6-22.2 82.7-40.6 115.4zm70.1-5.3c15.1-30 26.8-65.3 34.1-105h83.9c-19.4 53.5-64.5 88.7-118 105zm42.7-148.9H224.5c1.8-17.1 2.9-34.7 2.9-53.1s-1.1-36-2.9-53.1h136.2c1.8 17.1 2.9 34.7 2.9 53.1s-1.1 36-2.9 53.1zm28.9-106.2c4.4 16.9 6.8 34.7 6.8 53.1s-2.4 36.2-6.8 53.1H310.8c1.8-17.1 2.9-34.7 2.9-53.1s-1.1-36-2.9-53.1h105.1z"/></svg>語言 (Language)</span>
                        <svg class="panda-icon" viewBox="0 0 256 512" width="10" height="10" fill="currentColor"><path d="M246.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-128-128c-9.2-9.2-22.9-11.9-34.9-6.9s-19.8 16.6-19.8 29.6l0 256c0 12.9 7.8 24.6 19.8 29.6s25.7 2.2 34.9-6.9l128-128z"/></svg>
                        <ul class="panda-submenu" style="min-width: 140px; max-height: 250px; overflow-y: auto;">
                            <li onclick="event.stopPropagation(); pandaSetLanguage('English');">English</li>
                            <li onclick="event.stopPropagation(); pandaSetLanguage('繁體中文');">繁體中文</li>
                            <li onclick="event.stopPropagation(); pandaSetLanguage('简体中文');">简体中文</li>
                            <li onclick="event.stopPropagation(); pandaSetLanguage('日本語');">日本語</li>
                            <li onclick="event.stopPropagation(); pandaSetLanguage('한국어');">한국어</li>
                            <li onclick="event.stopPropagation(); pandaSetLanguage('Español');">Español</li>
                            <li onclick="event.stopPropagation(); pandaSetLanguage('Français');">Français</li>
                            <li onclick="event.stopPropagation(); pandaSetLanguage('Deutsch');">Deutsch</li>
                        </ul>
                    </li>
                    <li onmousedown="event.stopPropagation()">
                        <span><svg class="panda-icon" viewBox="0 0 512 512" width="16" height="16" fill="currentColor"><path d="M256 512C114.6 512 0 397.4 0 256S114.6 0 256 0S512 114.6 512 256c0 41.8-33.6 75.8-75.3 76.5c-23.7 .4-47 16.6-56.1 40.5c-6.3 16.5-2.2 35.1 10.6 47.9c12.2 12.3 22 26.6 22 41.7c0 27.6-22.4 50-50 50h-7.2zM152 240a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm104-48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zm152 48a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm-48 104a48 48 0 1 0 -96 0 48 48 0 1 0 96 0z"/></svg>Theme</span>
                        <svg class="panda-icon" viewBox="0 0 256 512" width="10" height="10" fill="currentColor"><path d="M246.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-128-128c-9.2-9.2-22.9-11.9-34.9-6.9s-19.8 16.6-19.8 29.6l0 256c0 12.9 7.8 24.6 19.8 29.6s25.7 2.2 34.9-6.9l128-128z"/></svg>
                        <ul class="panda-submenu">
                            <li id="btn-theme-default" onclick="event.stopPropagation();">Default <span class="panda-check ${!bearEnabled ? 'active' : ''}">✔</span></li>
                            <li id="btn-theme-bear" onclick="event.stopPropagation();">Cat Blocks (熊積木) <span class="panda-check ${bearEnabled ? 'active' : ''}">✔</span></li>
                        </ul>
                    </li>
                    <li onmousedown="event.stopPropagation()">
                        <span><svg class="panda-icon" viewBox="0 0 512 512" width="16" height="16" fill="currentColor"><path d="M256 512C114.6 512 0 397.4 0 256S114.6 0 256 0S512 114.6 512 256c0 41.8-33.6 75.8-75.3 76.5c-23.7 .4-47 16.6-56.1 40.5c-6.3 16.5-2.2 35.1 10.6 47.9c12.2 12.3 22 26.6 22 41.7c0 27.6-22.4 50-50 50h-7.2zM152 240a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm104-48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zm152 48a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm-48 104a48 48 0 1 0 -96 0 48 48 0 1 0 96 0z"/></svg>Color Mode</span>
                        <svg class="panda-icon" viewBox="0 0 256 512" width="10" height="10" fill="currentColor"><path d="M246.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-128-128c-9.2-9.2-22.9-11.9-34.9-6.9s-19.8 16.6-19.8 29.6l0 256c0 12.9 7.8 24.6 19.8 29.6s25.7 2.2 34.9-6.9l128-128z"/></svg>
                        <ul class="panda-submenu">
                            <li id="btn-contrast-original" onclick="event.stopPropagation();">原始 <span class="panda-check ${!highContrast ? 'active' : ''}">✔</span></li>
                            <li id="btn-contrast-high" onclick="event.stopPropagation();">高對比 <span class="panda-check ${highContrast ? 'active' : ''}">✔</span></li>
                        </ul>
                    </li>
                </ul>`;
            
            langMenu.parentNode.insertBefore(settingsDiv, langMenu.nextSibling);
            
            document.getElementById('btn-settings-toggle').addEventListener('click', (e) => {
                e.stopPropagation();
                const isActive = settingsDiv.classList.contains('active');
                if (isActive) {
                    settingsDiv.classList.remove('active');
                } else {
                    settingsDiv.classList.add('active');
                    const hideSettings = (event) => {
                        if (!settingsDiv.contains(event.target)) {
                            settingsDiv.classList.remove('active');
                            document.removeEventListener('click', hideSettings);
                        }
                    };
                    document.addEventListener('click', hideSettings);
                }
            });
            
            document.getElementById('btn-theme-default').addEventListener('click', (e) => {
                e.stopPropagation();
                localStorage.setItem('panda-bear-style', 'false');
                document.body.classList.remove('bear-style');
                document.querySelector('#btn-theme-default .panda-check').classList.add('active');
                document.querySelector('#btn-theme-bear .panda-check').classList.remove('active');
            });
            
            document.getElementById('btn-theme-bear').addEventListener('click', (e) => {
                e.stopPropagation();
                localStorage.setItem('panda-bear-style', 'true');
                document.body.classList.add('bear-style');
                document.querySelector('#btn-theme-bear .panda-check').classList.add('active');
                document.querySelector('#btn-theme-default .panda-check').classList.remove('active');
            });
            
            document.getElementById('btn-contrast-original').addEventListener('click', (e) => {
                e.stopPropagation();
                localStorage.setItem('panda-high-contrast', 'false');
                document.body.classList.remove('high-contrast');
                document.querySelector('#btn-contrast-original .panda-check').classList.add('active');
                document.querySelector('#btn-contrast-high .panda-check').classList.remove('active');
            });
            
            document.getElementById('btn-contrast-high').addEventListener('click', (e) => {
                e.stopPropagation();
                localStorage.setItem('panda-high-contrast', 'true');
                document.body.classList.add('high-contrast');
                document.querySelector('#btn-contrast-high .panda-check').classList.add('active');
                document.querySelector('#btn-contrast-original .panda-check').classList.remove('active');
            });
            
            if (bearEnabled) document.body.classList.add('bear-style');
            if (highContrast) document.body.classList.add('high-contrast');
        }

        if (menuBar && !document.getElementById('custom-sso-nav-wrapper')) {
            const authWrapper = document.createElement('div');
            authWrapper.id = 'custom-sso-nav-wrapper';
            authWrapper.style.cssText = 'display: flex; align-items: center; height: 100%; margin-left: auto; z-index: 10000; pointer-events: auto;';
            
            if (localStorage.getItem('sso_auth') === 'true' || localStorage.getItem('panda_session_token')) {
                const username = localStorage.getItem('panda_nickname') || localStorage.getItem('sso_nickname') || localStorage.getItem('panda_session_user') || '使用者';
                let avatar = localStorage.getItem('panda_avatar');
                if (!avatar || avatar === 'undefined' || avatar === 'null') avatar = 'https://cdn.discordapp.com/embed/avatars/0.png';
                const balance = localStorage.getItem('panda_balance') || 0;
                
                authWrapper.innerHTML = `
                    <div class="panda-settings-btn panda-sso-nav" title="我的東西" onclick="window.location.href='/scratch/mystuff/'" style="padding: 0 10px;">
                        <img src="https://pandapanda6666.github.io/scratch/projects/editor/mystuff.png" style="width: 24px; filter: brightness(0) invert(1);" onerror="this.src='https://scratch.mit.edu/images/mystuff.png'" />
                    </div>
                    <div class="panda-settings-btn panda-sso-nav">
                        <img src="${avatar}" style="width:32px; height:32px; border-radius:50%; margin-right:8px; border:1px solid rgba(255,255,255,0.4); background:#fff; object-fit: cover;">
                        <span style="display: flex; align-items: center;">
                            ${username}
                            <span style="margin-left: 10px; color: gold; display: flex; align-items: center;">
                                <img src="https://pandapanda6666.github.io/shop/coin.svg" style="width:16px;height:16px;margin-right:2px;" onerror="this.onerror=null; this.src='https://pandapanda6666.github.io/login-hub/pandacoin.png'" />${balance}
                            </span>
                        </span>
                        <ul class="panda-dropdown right">
                            <li onmousedown="event.stopPropagation()" onclick="window.location.href='https://pandapanda6666.github.io/login-hub/?action=editProfile'">個人資料</li>
                            <li onmousedown="event.stopPropagation()" onclick="window.location.href='/scratch/mystuff/'">我的東西</li>
                            <li onmousedown="event.stopPropagation()" onclick="window.location.href='/scratch/settings/'">帳號設定</li>
                            <hr style="margin: 5px 0; border: none; border-top: 1px solid rgba(0,0,0,0.15);">
                            <li onmousedown="event.stopPropagation()" onclick="logout()">登出</li>
                        </ul>
                    </div>`;
            } else {
                authWrapper.innerHTML = `
                    <button onclick="window.location.href='https://pandapanda6666.github.io/login-hub/?action=login&from=' + encodeURIComponent(window.location.href)" style="background: transparent; color: white; border: 1px solid white; padding: 5px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-right: 10px;">登入</button>
                    <button onclick="window.location.href='https://pandapanda6666.github.io/login-hub/?action=register&from=' + encodeURIComponent(window.location.href)" style="background: white; color: #81C784; border: none; padding: 5px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-right: 15px;">加入</button>`;
            }
            menuBar.appendChild(authWrapper);
            
            // Also attach click listener to Account avatar to open on touch/click
            const accountBtn = document.querySelector('.panda-sso-nav:last-child');
            if (accountBtn && !accountBtn.dataset.clickBound) {
                accountBtn.dataset.clickBound = 'true';
                accountBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    accountBtn.classList.toggle('active');
                    const hideAccount = (event) => {
                        if (!accountBtn.contains(event.target)) {
                            accountBtn.classList.remove('active');
                            document.removeEventListener('click', hideAccount);
                        }
                    };
                    document.addEventListener('click', hideAccount);
                });
            }
        }
    });
    observer.observe(document.body, { childList: true, subtree: true });
});
function logout() {
    window.location.href = 'https://pandapanda6666.github.io/login-hub/?action=logout&from=' + encodeURIComponent(window.location.href);
}

</script>

    <script>

                // Find all hat blocks in Blockly SVG that don't have ears yet
                document.querySelectorAll('.blocklyDraggable > path.blocklyBlockBackground').forEach(path => {

                    if (d && (d.includes('c 2 0 3 1 4 2 l 4 4 c 1 1 2 2 4 2 h 12 c 2 0 3 -1 4 -2 l 4 -4 c 1 -1 2 -2 4 -2') || d.includes('c 2 0 3 1 4 2 l 4 4 c 1 1 2 2 4 2 h 12'))) {
                        if (!path.parentNode.querySelector('.panda-cat-ears')) {
                            const ears = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                            ears.setAttribute('class', 'panda-cat-ears');
                            
                            const leftEar = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                            leftEar.setAttribute('d', 'M 10 0 C 10 -15, 25 -20, 25 0 Z');
                            leftEar.setAttribute('fill', path.getAttribute('fill') || '#FFD54F');
                            leftEar.setAttribute('stroke', path.getAttribute('stroke') || 'rgba(0,0,0,0.2)');
                            leftEar.setAttribute('stroke-width', '1');
                            
                            const rightEar = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                            rightEar.setAttribute('d', 'M 50 0 C 50 -15, 65 -20, 65 0 Z');
                            rightEar.setAttribute('fill', path.getAttribute('fill') || '#FFD54F');
                            rightEar.setAttribute('stroke', path.getAttribute('stroke') || 'rgba(0,0,0,0.2)');
                            rightEar.setAttribute('stroke-width', '1');
                            
                            ears.appendChild(leftEar);
                            ears.appendChild(rightEar);
                            
                            path.parentNode.insertBefore(ears, path.nextSibling);
                        } else {

                            ears.querySelectorAll('path').forEach(ear => {

                                ear.setAttribute('stroke', path.getAttribute('stroke') || 'rgba(0,0,0,0.2)');
                            });
                        }
                    }
                });
            });
            
            observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['d', 'fill'] });
