<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索 - PandaScratch</title>
    <style>
        :root {
            --primary: #81C784;
            --primary-hover: #66BB6A;
            --bg-color: #F3F4F7;
            --nav-bg: #81C784;
            --text-dark: #333333;
            --white: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); }
        .navbar { display: flex; align-items: center; background-color: var(--nav-bg); height: 50px; padding: 0 15px; color: var(--white); font-size: 14px; font-weight: bold; }
        .navbar a { color: var(--white); text-decoration: none; padding: 0 15px; height: 100%; display: flex; align-items: center; transition: background-color 0.2s; }
        .navbar a:hover { background-color: rgba(0, 0, 0, 0.1); }
        .navbar-brand { display: flex; align-items: center; margin-right: 15px; }
        .navbar-brand img { height: 30px; margin-right: 10px; }
        .navbar-search { flex: 1; display: flex; align-items: center; margin: 0 15px; }
        .navbar-search input { width: 100%; max-width: 300px; padding: 8px 15px; border-radius: 20px; border: none; outline: none; background-color: rgba(0, 0, 0, 0.1); color: var(--white); }
        .navbar-icons { display: flex; align-items: center; gap: 15px; }
        .navbar-icon { font-size: 20px; cursor: pointer; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; border-radius: 50%; transition: background-color 0.2s; }
        .user-menu { position: relative; display: flex; align-items: center; cursor: pointer; padding: 0 10px; height: 100%; }
        .user-avatar { width: 30px; height: 30px; border-radius: 5px; background-color: var(--white); margin-right: 10px; }
        .dropdown-menu { display: none; position: absolute; top: 50px; right: 0; background-color: var(--white); border: 1px solid #ddd; border-radius: 0 0 5px 5px; width: 160px; z-index: 100; }
        .user-menu:hover .dropdown-menu { display: block; }
        .dropdown-menu a { color: var(--text-dark); padding: 12px 15px; display: block; }
        
        .content {
            text-align: center;
            padding: 100px 20px;
            font-size: 32px;
            color: var(--primary);
            font-weight: bold;
        }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/scratch/panda_sso.js"></script>
</head>
<body>

    <!-- Notification Bar -->
    <div id="notificationBar" style="display:none; position:fixed; top:0; left:0; width:100%; background:black; color:white; z-index:100000; overflow:hidden; white-space:nowrap; padding:5px 0;">
        <div style="display:inline-block; padding-left:100%; animation: marquee 15s linear infinite;">
            <span id="notificationMsg"></span>
        </div>
    </div>
    <style>
        @keyframes marquee {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
    
        /* 統一 SSO 導覽列與選單排版設定 */
        .user-menu {
            display: none;
            align-items: center;
            height: 100%;
            margin-left: auto;
        }
        .avatar-container {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 0 15px;
            height: 100%;
            position: relative;
        }
        .avatar-container:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }
        .avatar {
            width: 32px !important;
            height: 32px !important;
            border-radius: 50% !important;
            margin-right: 8px !important;
            object-fit: cover !important;
            border: 1px solid rgba(255,255,255,0.4) !important;
            background: #fff !important;
            display: block !important;
        }
        .username {
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 10000;
            border-radius: 6px;
            overflow: hidden;
        }
        .avatar-container:hover .dropdown-content {
            display: block;
        }
        .dropdown-content a {
            color: #333 !important;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 14px;
            line-height: 1.5;
            height: auto;
        }
        .dropdown-content a:hover {
            background-color: #f1f1f1;
            color: #000 !important;
        }
</style>

    <nav class="navbar">
        <div class="navbar-brand" onclick="window.location.href='/scratch/'">
            <img src="https://scratch.mit.edu/images/logo_sm.png" alt="PandaScratch">
        </div>
        
        <div class="navbar-nav">
            <a href="/scratch/projects/editor/">創造</a>
            <a href="/scratch/explore/projects/all/">探索</a>
            <a href="/scratch/ideas/">靈感</a>
            <a href="/scratch/about/">關於</a>
            
            <div class="search-container">
                <svg viewBox="0 0 24 24" style="fill: rgba(255,255,255,0.7); width: 16px; height: 16px; margin-right: 5px;">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input type="text" placeholder="搜尋">
            </div>
        </div>

        <div class="auth-actions" id="auth-actions">
            <a href="https://pandapanda6666.github.io/login-hub/?require=1&from=https%3A%2F%2Fpandapanda6666.github.io%2Fscratch%2F" style="margin-right: 10px;">登入 / 註冊</a>
        </div>

        <div class="user-menu" id="user-menu">
            <button class="icon-btn" title="訊息" onclick="window.location.href='/scratch/messages/'">
                <svg viewBox="0 0 24 24" style="fill: white; width: 24px; height: 24px;">
                    <path d="M20,4H4C2.9,4,2.01,4.9,2.01,6L2,18c0,1.1,0.9,2,2,2h16c1.1,0,2-0.9,2-2V6C22,4.9,21.1,4,20,4z M20,18H4V8l8,5l8-5V18z M12,11L4,6h16L12,11z"/>
                </svg>
            </button>
            <button class="icon-btn" title="我的東西" onclick="openMyStuff()">
                <img src="/scratch/projects/editor/static/assets/e1672da8924b2b3e8ad32b137f8f1c4e.png" alt="我的東西" style="width: 24px; height: 24px;">
            </button>
            
            <div class="avatar-container">
                <img src="" alt="Avatar" class="avatar" id="nav-avatar">
                <span class="username" id="nav-username">使用者</span>
                
                <div class="dropdown-content">
                    <a href="https://pandapanda6666.github.io/login-hub/?action=profile">個人資訊</a>
                    <a href="/scratch/mystuff/">我的東西</a>
                    <a href="https://pandapanda6666.github.io/login-hub/?action=editProfile">帳戶設定</a>
                    <a href="javascript:void(0)" onclick="logout()">登出</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="content">
        我們在做囉!
    </div>
    <script>
        // 登入驗證機制
        function openMyStuff() {
            const isLogged = localStorage.getItem('sso_auth') === 'true' || localStorage.getItem('panda_session_token') || localStorage.getItem('panda_session_user') || localStorage.getItem('panda_auto_user');
            const currentUser = localStorage.getItem('sso_user') || localStorage.getItem('panda_session_user') || localStorage.getItem('panda_auto_user') || 'User';
            if (!isLogged) {
                window.location.href = 'https://pandapanda6666.github.io/login-hub/?require=1&from=' + encodeURIComponent('https://pandapanda6666.github.io/scratch/mystuff/');
            } else {
                window.location.href = '/scratch/mystuff/?auth=true&user=' + encodeURIComponent(currentUser);
            }
        }
        
        function logout() {
            localStorage.removeItem('sso_auth');
            localStorage.removeItem('sso_user');
            localStorage.removeItem('sso_server');
            localStorage.removeItem('panda_session_token');
            localStorage.removeItem('panda_session_user');
            localStorage.removeItem('panda_auto_user');
            localStorage.removeItem('panda_auto_pass');
            window.location.href = 'https://pandapanda6666.github.io/login-hub/?action=logout&from=' + encodeURIComponent(window.location.href);
        }

        async function checkLogin() {
            const urlParams = new URLSearchParams(window.location.search);
            const isAuthQuery = urlParams.get('auth') === 'true' || urlParams.get('user') || urlParams.get('nickname') || urlParams.get('avatar');
            if (isAuthQuery) {
                const u = urlParams.get('user') || localStorage.getItem('sso_user') || '使用者';
                if (urlParams.get('user')) {
                    localStorage.setItem('sso_user', u);
                    localStorage.setItem('panda_session_user', u);
                    localStorage.setItem('panda_auto_user', u);
                }
                if (urlParams.get('nickname')) {
                    localStorage.setItem('sso_nickname', urlParams.get('nickname'));
                    localStorage.setItem('panda_nickname', urlParams.get('nickname'));
                }
                if (urlParams.get('avatar')) {
                    localStorage.setItem('sso_avatar', urlParams.get('avatar'));
                    localStorage.setItem('panda_avatar', urlParams.get('avatar'));
                }
                localStorage.setItem('sso_auth', 'true');
                if (urlParams.get('token')) localStorage.setItem('panda_session_token', urlParams.get('token'));
                if (urlParams.get('server')) localStorage.setItem('sso_server', urlParams.get('server'));
                if (window.history.replaceState) {
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }

            const isLogged = localStorage.getItem('sso_auth') === 'true' || 
                             localStorage.getItem('panda_session_token') || 
                             localStorage.getItem('panda_session_user') || 
                             localStorage.getItem('panda_auto_user') || 
                             localStorage.getItem('sso_user');

            const authActions = document.getElementById('auth-actions');
            const userMenu = document.getElementById('user-menu');
            const navUsername = document.getElementById('nav-username');
            const navAvatar = document.getElementById('nav-avatar');

            if (isLogged) {
                const username = localStorage.getItem('sso_user') || localStorage.getItem('panda_session_user') || localStorage.getItem('panda_auto_user') || '使用者';
                const nickname = urlParams.get('nickname') || localStorage.getItem('sso_nickname') || localStorage.getItem('panda_nickname') || username;
                const avatar = urlParams.get('avatar') || localStorage.getItem('sso_avatar') || localStorage.getItem('panda_avatar') || 'https://cdn.discordapp.com/embed/avatars/0.png';
                const balance = localStorage.getItem('panda_balance') || 0;
                
                if (authActions) authActions.style.display = 'none';
                if (userMenu) userMenu.style.display = 'flex';
                if (navUsername) {
                    navUsername.innerHTML = `<span class="user-nickname-text" style="display:inline-block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;">${nickname}</span> <span style="margin-left: 8px; color: #ffb700; font-weight: bold; white-space: nowrap; display:inline-flex; align-items:center;"><img src="/scratch/projects/editor/static/assets/pandacoin.png" style="width:16px;height:16px;margin-right:2px;" onerror="this.style.display='none'" />${balance}</span>`;
                }
                if (navAvatar) navAvatar.src = avatar;
            } else {
                if (authActions) authActions.style.display = 'flex';
                if (userMenu) userMenu.style.display = 'none';
            }
        }

        window.addEventListener('load', () => {
            checkLogin();
        });
    </script>

</body>
</html>
