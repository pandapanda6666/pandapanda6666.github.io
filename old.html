            background-color: #1e293b;

            height: 300px;
            overflow-x: auto;
            overflow-y: hidden;
            border-top: 1px solid #334155;
            user-select: none;
        }

            height: 30px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .track {
            height: 60px;
            border-bottom: 1px solid #334155;
            position: relative;
            width: max-content;
            min-width: 100%;
        }
        .track-label {
            position: sticky;
            left: 0;
            width: 80px;
            background: #1e293b;
            z-index: 10;
            font-size: 12px;
            display: flex;
            align-items: center;
            padding-left: 10px;
            border-right: 1px solid #334155;
        }
        .subtitle-block {
            position: absolute;
            height: 40px;
            top: 10px;
            background: rgba(59, 130, 246, 0.6);
            border: 2px solid #3b82f6;
            border-radius: 4px;
            cursor: move;
            color: white;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            transition: background 0.2s;
        }
        .subtitle-block.active {
            background: rgba(59, 130, 246, 0.9);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
            border-color: #60a5fa;
            z-index: 5;
        }
        .handle {
            position: absolute;
            top: 0;
            width: 8px;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            cursor: ew-resize;
        }
        .handle-left { left: 0; }
        .handle-right { right: 0; }
        .media-block {
            position: absolute;
            height: 40px;
            top: 10px;
            background: rgba(16, 185, 129, 0.5);
            border: 2px solid #10b981;
            border-radius: 4px;
            cursor: move;
            display: flex;
            align-items: center;
            padding-left: 10px;
            font-size: 12px;
        }
        .media-block.missing {
            background: rgba(245, 158, 11, 0.5);
            border-color: #f59e0b;
        }
        .playhead {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: #ef4444;
            z-index: 30;
            pointer-events: none;
        }
        .time-mark {
            position: absolute;
            font-size: 10px;
            color: #64748b;
            transform: translateX(-50%);
        }
        /* ?芾? Modal 璅?? */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Toast ?璅?? */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 200;
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.error {
            background: #ef4444;
        }

            cursor: move;
            user-select: none;
            white-space: nowrap;
            text-align: center;
            transform: translate(-50%, -50%);
            border: 1px dashed transparent;
        }

        const DB_NAME = "SubtitleEditorDB";
        const MEDIA_STORE = "mediaStore";
        const PROJECT_STORE = "projectStore"; // ?啣?撠????摮?

        function openLocalDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 2); // ????誑撱箇???Store
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(MEDIA_STORE)) {
                        db.createObjectStore(MEDIA_STORE);
                    }
                    if (!db.objectStoreNames.contains(PROJECT_STORE)) {
                        db.createObjectStore(PROJECT_STORE, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        // --- ?祆??脣?嚗?獢???---
        async function saveProjectLocally(projectData) {
            try {
                const db = await openLocalDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(PROJECT_STORE, 'readwrite');
                    tx.objectStore(PROJECT_STORE).put(projectData);
                    tx.oncomplete = () => resolve();
                    tx.onerror = (e) => reject(e.target.error);
                });
            } catch (err) { console.error("Local Project Save Error:", err); }
        }

        async function getLocalProjects() {
            try {
                const db = await openLocalDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(PROJECT_STORE, 'readonly');
                    const request = tx.objectStore(PROJECT_STORE).getAll();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = (e) => reject(e.target.error);
                });
            } catch (err) { 
                console.error("Local Projects Load Error:", err); 
                return []; 
            }
        }

            try {
                
                if (typeof FFmpeg === 'undefined') {
                    showToast("FFmpeg 撘?甇?頛嚗?蝔?..");
                    await new Promise((resolve, reject) => {

                        document.head.appendChild(script);
                    });
                }
                if (!window.ffmpeg) {
                    const { createFFmpeg } = FFmpeg;
                    window.ffmpeg = createFFmpeg({ 
                        log: true,
                        corePath: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js',
                    });
                    await window.ffmpeg.load();
                }

                const ffmpeg = window.ffmpeg;

                let assContent = `[Script Info]
ScriptType: v4.00+
PlayResX: 1920
PlayResY: 1080
WrapStyle: 0
ScaledBorderAndShadow: yes

[V4+ Styles]
Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
Style: Default,Arial,32,&H00FFFFFF,&H000000FF,&H00000000,&H80000000,0,0,0,0,100,100,0,0,1,2,0,2,10,10,10,1

[Events]
Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
`;
                
                function formatAssTime(sec) {
                    const h = Math.floor(sec / 3600);
                    const m = Math.floor((sec % 3600) / 60);
                    const s = Math.floor(sec % 60);
                    const cs = Math.floor((sec % 1) * 100);
                    return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${cs.toString().padStart(2,'0')}`;
                }
                
                function toAssColor(hex, alpha) {
                    let r = hex.slice(1,3), g = hex.slice(3,5), b = hex.slice(5,7);
                    let a = Math.round((1 - alpha) * 255).toString(16).padStart(2, '0').toUpperCase();
                    return `&H${a}${b}${g}${r}`;
                }

                subtitles.forEach(sub => {
                    const start = formatAssTime(sub.start);
                    const end = formatAssTime(sub.end);
                    
                    
                    let c1 = toAssColor(sub.color1 || '#ffffff', sub.textAlpha !== undefined ? sub.textAlpha : 1);
                    let bc = toAssColor(sub.bgColor1 || '#000000', sub.bgAlpha !== undefined ? sub.bgAlpha : 0.5);
                    
                    let fs = sub.fontSize || 32;
                    let bold = sub.bold ? -1 : 0; 
                    
                    let px = sub.posX !== undefined ? sub.posX : 0.5;
                    let py = sub.posY !== undefined ? sub.posY : 0.9;
                    let x = Math.round(px * 1920);
                    let y = Math.round(py * 1080);
                    
                    let text = sub.text.replace(/\n/g, '\\N');
                    
                    const outlines = sub.outlines || [];
                    
                    let totalWidth = outlines.reduce((acc, ol) => acc + parseInt(ol.width || 0), 0);
                    let currentWidth = totalWidth;
                    
                    for (let i = outlines.length - 1; i >= 0; i--) {
                        const ol = outlines[i];
                        if (currentWidth > 0) {
                            let oc = toAssColor(ol.color || '#000000', ol.alpha !== undefined ? ol.alpha : 1);
                            let tags = `{\\pos(${x},${y})\\fs${fs}\\1c${oc}\\3c${oc}\\4c${bc}\\b${bold}\\bord${currentWidth}\\BorderStyle3}`;
                            assContent += `Dialogue: 0,${start},${end},Default,,0,0,0,,${tags}${text}\n`;
                        }
                        currentWidth -= parseInt(ol.width || 0);
                    }
                    
                    let mainTags = `{\\pos(${x},${y})\\fs${fs}\\1c${c1}\\3c${c1}\\4c${bc}\\b${bold}\\bord0\\BorderStyle3}`;
                    assContent += `Dialogue: 0,${start},${end},Default,,0,0,0,,${mainTags}${text}\n`;
    
                });

                const vidName = 'input_video.mp4';
                ffmpeg.FS('writeFile', vidName, new Uint8Array(await mediaFile.blob.arrayBuffer()));
                ffmpeg.FS('writeFile', 'subs.ass', new TextEncoder().encode(assContent));
                
                showToast("????敶梁???撟?隢??蝬脤?...");
                
                const scaleFilter = `scale=-2:${resolution}`;

                const data = ffmpeg.FS('readFile', 'output.mp4');
                const blob = new Blob([data.buffer], { type: 'video/mp4' });

                showToast("敶梁??臬??嚗?);

            } catch (err) {

        // 霈??獢???銝血?閰血??砍 IndexedDB ??敶梁?瑼?        async function loadProjectData(projectData) {

        // --- 甇瑕蝝??(Undo/Redo) ---
        function saveState() {

        }

        function undo() {

                selectedSubtitleIds.clear();
                lastSelectedId = null;

                updateEditor();

        function redo() {

        // --- ?芾票蝪輯??芷 ---
        function copySelection() {
            if (selectedSubtitleIds.size === 0 || currentView !== 'editor') return;
            const selectedSubs = subtitles
                .filter(s => selectedSubtitleIds.has(s.id))
                .sort((a, b) => a.start - b.start);
            
            const baseTime = selectedSubs[0].start;
            clipboard = selectedSubs.map(s => ({
                duration: s.end - s.start,

            }));

        function pasteSelection() {
            if (clipboard.length === 0 || currentView !== 'editor') return;
            const player = mediaFile.type === 'video' ? mainVideo : mainAudio;
            
            let insertTime = 0;
            if (mediaFile.url && !mediaFile.isMissing) {
                insertTime = player.currentTime + mediaFile.offset;
            } else {
                insertTime = subtitles.length > 0 ? Math.max(...subtitles.map(s => s.end)) : 0;
            }

            selectedSubtitleIds.clear();
            clipboard.forEach(item => {
                const newSub = {
                    id: Date.now() + Math.random(),
                    start: insertTime + item.offset,
                    end: insertTime + item.offset + item.duration,
                    text: item.text
                };
                subtitles.push(newSub);
                selectedSubtitleIds.add(newSub.id);
                lastSelectedId = newSub.id;
            });
            
            subtitles.sort((a, b) => a.start - b.start);

        // 敹急??        window.addEventListener('keydown', (e) => {

            const isCtrl = e.ctrlKey || e.metaKey;
            const key = e.key.toLowerCase();

            if (isCtrl && key === 'c') {
                e.preventDefault();
                copySelection();
            } else if (isCtrl && key === 'v') {
                e.preventDefault();
                pasteSelection();
            } else if (isCtrl && key === 'z' && !e.shiftKey) {
                e.preventDefault();
                undo();
            } else if ((isCtrl && key === 'y') || (isCtrl && e.shiftKey && key === 'z')) {
                e.preventDefault();
                redo();
            } else if (e.key === 'Delete' || e.key === 'Backspace') {
                e.preventDefault();
                deleteSelection();
            }
        });

        // ?澆?????        function formatTimeCode(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 1000);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${ms.toString().padStart(3, '0')}`;
        }

        function parseTimeCode(str) {
            if (!str) return 0;
            const parts = str.replace(',', '.').split(':');
            if (parts.length === 3) {
                return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
            } else if (parts.length === 2) {
                return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
            } else {
                return parseFloat(parts[0]) || 0;
            }
        }

        function formatSrtTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 1000);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')},${ms.toString().padStart(3, '0')}`;
        }

        // ??皜脫?撠箸?
        function renderRuler(duration) {
            ruler.innerHTML = '';
            const totalSeconds = Math.max(duration + 300, 600); 
            
            let step = 5;
            if (totalSeconds > 7200) step = 30;    
            if (totalSeconds > 36000) step = 120;  

            for (let i = 0; i < totalSeconds; i += step) {
                const mark = document.createElement('div');
                mark.className = 'time-mark';
                mark.style.left = `${(i * pixelsPerSecond) + 80}px`;
                
                const h = Math.floor(i / 3600);
                const m = Math.floor((i % 3600) / 60);
                const s = i % 60;
                if (h > 0) {
                    mark.innerText = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                } else {
                    mark.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                }
                ruler.appendChild(mark);
            }
        }

        // ?湔敶梢?脣漲

        // 頛慦?
        mediaInput.onchange = async (e) => {

        // 皜脫?慦?憛?        function renderMediaBlock() {
            mediaBlockContainer.innerHTML = '';
            if (!mediaFile.name) return;

            const block = document.createElement('div');
            block.className = `media-block ${mediaFile.isMissing ? 'missing' : ''}`;

        // 閫?? SRT
        srtInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const text = event.target.result;
                parseSRT(text);
                srtInput.value = ''; 
            };
            reader.readAsText(file);
        };

        function parseSRT(data) {
            const items = data.split(/\n\s*\n/);
            subtitles = items.map((item, index) => {
                const lines = item.split('\n').filter(l => l.trim() !== '');
                if (lines.length < 3) return null;
                
                const timeMatch = lines[1].match(/(\d+:\d+:\d+,\d+) --> (\d+:\d+:\d+,\d+)/);
                if (!timeMatch) return null;

                const start = parseTimeCode(timeMatch[1]);
                const end = parseTimeCode(timeMatch[2]);
                const text = lines.slice(2).join('\n');

                return { id: Date.now() + index, start, end, text };
            }).filter(s => s !== null);
            
            selectedSubtitleIds.clear();
            lastSelectedId = null;
            
            if (subtitles.length > 0) {
                let maxEnd = 0;
                subtitles.forEach(s => { if (s.end > maxEnd) maxEnd = s.end; });
                if (mediaFile.duration && maxEnd > mediaFile.duration) {
                    renderRuler(maxEnd);
                }
            }
            
            saveState(); 
            renderSubtitles();
            updateEditor();
        }

        // 皜脫?摮?憛?        function renderSubtitles() {
            subtitleBlocksContainer.innerHTML = '';
            subtitles.forEach(sub => {
                const block = document.createElement('div');
                block.className = `subtitle-block ${selectedSubtitleIds.has(sub.id) ? 'active' : ''}`;
                block.style.left = `${(sub.start * pixelsPerSecond) + 80}px`;
                block.style.width = `${(sub.end - sub.start) * pixelsPerSecond}px`;
                block.innerText = sub.text;

                const handleL = document.createElement('div');
                handleL.className = 'handle handle-left';
                handleL.onmousedown = (e) => {
                    dragTarget = sub;
                    dragMode = 'left';
                    dragStartX = e.clientX;
                    dragStartTime = sub.start;
                    isDragging = false;
                    hasDragged = false;
                    e.stopPropagation();
                };

                const handleR = document.createElement('div');
                handleR.className = 'handle handle-right';
                handleR.onmousedown = (e) => {
                    dragTarget = sub;
                    dragMode = 'right';
                    dragStartX = e.clientX;
                    dragStartTime = sub.end;
                    isDragging = false;
                    hasDragged = false;
                    e.stopPropagation();
                };

                block.onmousedown = (e) => {
                    if (e.target.classList.contains('handle')) return;
                    
                    const isCtrl = e.ctrlKey || e.metaKey;
                    const isShift = e.shiftKey;

                    if (isShift && lastSelectedId !== null) {
                        subtitles.sort((a, b) => a.start - b.start);
                        const currentIndex = subtitles.findIndex(s => s.id === sub.id);
                        const lastIndex = subtitles.findIndex(s => s.id === lastSelectedId);
                        
                        if (currentIndex !== -1 && lastIndex !== -1) {
                            const startIdx = Math.min(currentIndex, lastIndex);
                            const endIdx = Math.max(currentIndex, lastIndex);
                            
                            if (!isCtrl) selectedSubtitleIds.clear(); 
                            
                            for (let i = startIdx; i <= endIdx; i++) {
                                selectedSubtitleIds.add(subtitles[i].id);
                            }
                        }
                    } else if (isCtrl) {
                        if (selectedSubtitleIds.has(sub.id)) {
                            selectedSubtitleIds.delete(sub.id);
                        } else {
                            selectedSubtitleIds.add(sub.id);
                        }
                        lastSelectedId = sub.id; 
                    } else {
                        if (!selectedSubtitleIds.has(sub.id)) {
                            selectedSubtitleIds.clear();
                            selectedSubtitleIds.add(sub.id);
                        }
                        lastSelectedId = sub.id; 
                    }

                    dragTarget = sub;
                    dragMode = 'move';
                    dragStartX = e.clientX;
                    isDragging = false;
                    hasDragged = false;
                    
                    subtitles.forEach(s => {
                        if (selectedSubtitleIds.has(s.id)) {
                            s.dragStartTime = s.start;
                            s.dragStartEnd = s.end;
                        }
                    });

                    updateEditor();
                    renderSubtitles();
                };

                block.appendChild(handleL);
                block.appendChild(handleR);
                subtitleBlocksContainer.appendChild(block);
            });
        }

    document.getElementById('sty_bgColor1').value = sub.bgColor1 || '#000000';

        window.addEventListener('mousemove', (e) => {

                            s.end = s.start + duration;
                        }
                    });

                    dragTarget.start = Math.max(0, Math.min(dragTarget.end - 0.1, dragStartTime + deltaTime));
                } else if (dragMode === 'right') {
                    dragTarget.end = Math.max(dragTarget.start + 0.1, dragStartTime + deltaTime);

        // --- Draggable Subtitle on Canvas ---
        const videoContainer = document.getElementById('videoContainer');
        const overlayContainer = document.getElementById('subtitleOverlay');
        if (overlayContainer) {
            overlayContainer.className = "absolute inset-0 pointer-events-none overflow-hidden";
            overlayContainer.innerHTML = '';
        }
        
        let subDragData = null;

        function hexToRgba(hex, alpha) {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r},${g},${b},${alpha})`;
        }

        window.renderCanvasOverlay = function() {
            if (!window.mediaFile || window.mediaFile.type !== 'video' || !overlayContainer) return;
            const player = document.getElementById('mainVideo');
            const time = player.currentTime + window.mediaFile.offset;
            const currentSubs = (window.subtitles || []).filter(s => time >= s.start && time <= s.end);
            
            overlayContainer.innerHTML = '';
            
            currentSubs.forEach(sub => {
                
                const container = document.createElement('div');
                container.className = "draggable-sub pointer-events-auto";
                // Pos
                let px = sub.posX !== undefined ? sub.posX : 0.5;
                let py = sub.posY !== undefined ? sub.posY : 0.9;
                container.style.left = `${px * 100}%`;
                container.style.top = `${py * 100}%`;
                
                // Backgound style on container
                let bgAlpha = sub.bgAlpha !== undefined ? sub.bgAlpha : 0.5;
                if (bgAlpha > 0) {
                    let bgC1 = hexToRgba(sub.bgColor1 || '#000000', bgAlpha);
                    let bgC2 = hexToRgba(sub.bgColor2 || '#000000', bgAlpha);
                    container.style.background = `linear-gradient(to right, ${bgC1}, ${bgC2})`;
                    container.style.padding = '5px 15px';
                    container.style.borderRadius = `${sub.borderRadius || 4}px`;
                }

                // Create text layers
                const fontSize = sub.fontSize || 32;
                const fw = sub.bold ? 'bold' : 'normal';
                
                const outlines = sub.outlines || [];
                
                const layerWrapper = document.createElement('div');
                layerWrapper.style.position = 'relative';
                layerWrapper.style.display = 'inline-block';

                let totalWidthSum = outlines.reduce((acc, ol) => acc + parseInt(ol.width || 0), 0);
                let currentThick = totalWidthSum;
                
                for (let i = outlines.length - 1; i >= 0; i--) {
                    const ol = outlines[i];
                    if (currentThick > 0) {
                        const olLayer = document.createElement('div');
                        olLayer.style.position = 'absolute';
                        olLayer.style.left = '0';
                        olLayer.style.top = '0';
                        olLayer.style.whiteSpace = 'nowrap';
                        olLayer.style.fontSize = `${fontSize}px`;
                        olLayer.style.fontWeight = fw;
                        
                        const c = hexToRgba(ol.color, ol.alpha !== undefined ? ol.alpha : 1);
                        olLayer.style.webkitTextStroke = `${currentThick * 2}px ${c}`; // *2 because stroke is centered
                        olLayer.style.color = c; // Fill with outline color
                        olLayer.innerText = sub.text;
                        layerWrapper.appendChild(olLayer);
                    }
                    currentThick -= parseInt(ol.width || 0);
                }

                // Top text layer
                const topLayer = document.createElement('div');
                topLayer.style.position = 'relative'; // This dictates the size
                topLayer.style.whiteSpace = 'nowrap';
                topLayer.style.fontSize = `${fontSize}px`;
                topLayer.style.fontWeight = fw;
                topLayer.style.color = hexToRgba(sub.color1 || '#ffffff', sub.textAlpha !== undefined ? sub.textAlpha : 1);
                topLayer.innerText = sub.text;
                layerWrapper.appendChild(topLayer);
                
                container.appendChild(layerWrapper);

                // Dragging Logic
                container.addEventListener('mousedown', (e) => {
                    subDragData = {
                        id: sub.id,
                        startX: e.clientX,
                        startY: e.clientY,
                        startPx: px,
                        startPy: py
                    };
                    container.classList.add('dragging');
                    e.stopPropagation();
                });

                overlayContainer.appendChild(container);
    
            });
        };

        window.addEventListener('mousemove', (e) => {
            if (subDragData && overlayContainer) {
                const rect = overlayContainer.getBoundingClientRect();
                const dx = (e.clientX - subDragData.startX) / rect.width;
                const dy = (e.clientY - subDragData.startY) / rect.height;
                
                
                if (window.subtitles) {
                    const sub = window.subtitles.find(s => s.id === subDragData.id);
                    if (sub) {
                        sub.posX = Math.min(1, Math.max(0, subDragData.startPx + dx));
                        sub.posY = Math.min(1, Math.max(0, subDragData.startPy + dy));
                        // Update UI
                        document.getElementById('sty_posX').value = Math.round((sub.posX - 0.5) * 1920);
                        document.getElementById('sty_posY').value = Math.round((sub.posY - 0.5) * 1080);
                    }
                }
                subDragData.startX = e.clientX;
                subDragData.startY = e.clientY;
                if (true) {
                    subDragData.startPx = subDragData.startPx + dx;
                    subDragData.startPy = subDragData.startPy + dy;
                }
                window.renderCanvasOverlay();
            }
        });

        window.addEventListener('mouseup', () => {
            if (subDragData) {
                subDragData = null;
                if (overlayContainer) { overlayContainer.querySelectorAll('.draggable-sub').forEach(el => el.classList.remove('dragging')); }
            }
        });

        // --- Export Video using FFmpeg ---
        const exportVideoBtn = document.getElementById('exportVideoBtn');
        let ffmpeg = null;
        
        exportVideoBtn.addEventListener('click', async () => {
            document.dispatchEvent(new CustomEvent('START_EXPORT'));
        });
    </script>
</body>
</html>
