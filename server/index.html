        // 語言自動偵測與記憶 (同官網)
        function detectCurrentLang() {
            try {
                const saved = localStorage.getItem('preferred_language');
                if (saved && i18n[saved]) return saved;
            } catch(e) {}

            const nav = (navigator.language || '').toLowerCase();
            if (nav.includes('hk') || nav.includes('mo')) return 'zh-HK';
            if (nav.includes('cn') || nav.includes('sg') || nav === 'zh') return 'zh-CN';
            if (nav.includes('ja')) return 'ja';
            if (nav.startsWith('en')) return 'en';
            return 'zh-TW';
        }

        let currentLang = detectCurrentLang();
        let loadedItems = [...DEFAULT_CONFIG.items];

        function translateText(text, targetLang) {
            if (!text) return '';
            const dict = (i18n[targetLang] && i18n[targetLang].dictionary) || {};
            if (dict[text]) return dict[text];
            // 模糊比對開頭
            for (const key of Object.keys(dict)) {
                if (text === key || text.startsWith(key)) return dict[key];
            }
            return text;
        }

        function getAbsoluteUrl(relativePath) {
            try {
                let base = window.location.href;
                if (!base.endsWith('/') && !base.includes('.html')) base += '/';
                base = base.replace(/\/index\.html$/, '/');
                return new URL(relativePath, base).href;
            } catch (e) {
                return relativePath;
            }
        }

        function handleImageError(img, projectUrl) {
            const previewUrl = 'https://s.wordpress.com/mshots/v1/' + encodeURIComponent(projectUrl) + '?w=400';
            if (img.src !== previewUrl) {
                img.src = previewUrl;
            } else {
                const t = i18n[currentLang] || i18n['zh-TW'];
                img.parentElement.innerHTML = '<div class="img-fallback-text">' + t.noIcon + '</div>';
            }
        }

        function renderCards() {
            const container = document.getElementById('folder-list');
            const t = i18n[currentLang] || i18n['zh-TW'];
            
            if (!loadedItems || loadedItems.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#888; padding: 3rem 0; font-size:1.1rem;">' + t.noContent + '</div>';
                return;
            }

            container.innerHTML = '';
            loadedItems.forEach(item => {
                const projectUrl = getAbsoluteUrl('./' + encodeURIComponent(item.folder) + '/');
                const iconUrl = getAbsoluteUrl('./' + encodeURIComponent(item.folder) + '/icon.png');
                const localizedName = translateText(item.name, currentLang);
                const localizedDesc = translateText(item.desc, currentLang) || t.noDescription;

                const card = document.createElement('a');
                card.href = projectUrl;
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="card-content">
                        <div class="img-container">
                            <img src="${iconUrl}" alt="${localizedName}" class="project-img" 
                                 onerror="handleImageError(this, '${projectUrl}')">
                        </div>
                        <div class="text-content">
                            <h3 class="project-title">${localizedName}</h3>
                            <p class="project-desc">${localizedDesc}</p>
                        </div>
                        <div class="arrow-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                            </svg>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function setPageLanguage(lang) {
            if (!i18n[lang]) lang = 'zh-TW';
            currentLang = lang;
            try {
                localStorage.setItem('preferred_language', lang);
                localStorage.setItem('preferred_language_set', 'true');
            } catch(e) {}

            const select = document.getElementById('langSelect');
            if (select) select.value = lang;

            const t = i18n[lang] || i18n['zh-TW'];
            
            // 標題與副標題更新
            const titleEl = document.getElementById('main-title');
            const subTitleEl = document.getElementById('main-subtitle');
            const localizedTitle = translateText(DEFAULT_CONFIG.title, lang);
            if (titleEl) titleEl.textContent = localizedTitle;
            document.title = localizedTitle + ' | ' + (lang === 'en' ? 'Directory' : '目錄索引');

            if (subTitleEl) {
                subTitleEl.textContent = DEFAULT_CONFIG.subtitle ? translateText(DEFAULT_CONFIG.subtitle, lang) : t.defaultSubtitle;
            }

            const homeText = document.getElementById('navHomeText');
            if (homeText) homeText.textContent = t.navHome;

            const footerCp = document.getElementById('footer-copyright');
            if (footerCp) footerCp.innerHTML = t.copyright;

            const footerBtnText = document.getElementById('footerNewSiteText');
            if (footerBtnText) footerBtnText.textContent = t.newSiteBtn;

            renderCards();
        }

        // 跨標籤頁語言切換監聽
        window.addEventListener('storage', (e) => {
            if (e.key === 'preferred_language' && e.newValue && i18n[e.newValue]) {
                setPageLanguage(e.newValue);
            }
        });

        // 異步讀取 README 補充更新 (動態覆蓋，不阻塞頁面)
        async function fetchReadmeEnhancements() {
            try {
                const res = await fetch(getAbsoluteUrl('./README.md'));
                if (res.ok) {
                    const text = await res.text();
                    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
                    if (lines.length > 0) {
                        const extractedTitle = lines[0].replace(/^#\s*/, '').trim();
                        if (extractedTitle) DEFAULT_CONFIG.title = extractedTitle;
                        if (lines.length > 1) DEFAULT_CONFIG.subtitle = lines[1].trim();
                        setPageLanguage(currentLang);
                    }
                }
            } catch(e) {}

            for (const item of loadedItems) {
                try {
                    const rRes = await fetch(getAbsoluteUrl('./' + encodeURIComponent(item.folder) + '/README.md'));
                    if (rRes.ok) {
                        const rText = await rRes.text();
                        const rLines = rText.split('\n').map(l => l.trim()).filter(Boolean);
                        if (rLines.length > 0) {
                            item.name = rLines[0].replace(/^#\s*/, '').trim();
                            if (rLines.length > 1) item.desc = rLines[1].trim();
                        }
                    }
                } catch(e) {}
            }
            renderCards();
        }

        function checkMigrationDismissed() {
            if (sessionStorage.getItem('migration_dismissed') === 'true') {
                const c = document.getElementById('footer-new-site-container');
                if (c) c.style.display = 'block';
            }
        }

        window.onload = function() {
            setPageLanguage(currentLang);
            checkMigrationDismissed();
            fetchReadmeEnhancements();
        };
    </script>
</body>
</html>
