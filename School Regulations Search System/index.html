<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校規查詢系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; padding: 20px; background-color: #f8f9fa; }
        .highlight { background-color: yellow; font-weight: bold; }
        #chat-box { border: 1px solid #ccc; padding: 15px; border-radius: 8px; background: white; min-height: 200px; margin-bottom: 20px; }
        .source-box { border: 1px solid #17a2b8; padding: 10px; margin-top: 10px; border-radius: 5px; background: #e0f7fa; cursor: pointer; }
        .source-content { display: none; margin-top: 10px; padding: 10px; border-top: 1px dashed #17a2b8; }
        #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 1000; text-align: center; padding-top: 20vh; }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <h3>正在下載並載入本機 AI 模型...</h3>
        <p>這可能需要幾分鐘的時間。下載完成後模型會存放在瀏覽器快取中。</p>
        <div class="spinner-border text-primary" role="status"></div>
        <p id="loading-progress" class="mt-3"></p>
    </div>

    <div class="container">
        <h1 class="text-center mb-4">🏫 校規查詢系統 (WebLLM 本機執行)</h1>
        
        <div class="card mb-4 p-3">
            <h5>1. 請選擇本機的校規資料夾 (例如：L:\我的雲端硬碟\校規)</h5>
            <input type="file" id="folder-input" webkitdirectory directory multiple class="form-control mb-2">
            <small class="text-muted">我們會自動讀取資料夾內的 PDF 檔案，完全在您的瀏覽器端執行，不會上傳任何檔案。</small>
        </div>

        <div class="row mb-3">
            <div class="col-md-2">
                <select id="sel-type" class="form-select"><option value="">選擇公私立</option></select>
            </div>
            <div class="col-md-2">
                <select id="sel-level" class="form-select"><option value="">選擇學制</option></select>
            </div>
            <div class="col-md-2">
                <select id="sel-city" class="form-select"><option value="">選擇縣市</option></select>
            </div>
            <div class="col-md-3">
                <select id="sel-district" class="form-select"><option value="">選擇鄉鎮市區</option></select>
            </div>
            <div class="col-md-3">
                <select id="sel-school" class="form-select"><option value="">選擇學校</option></select>
            </div>
        </div>
        
        <div class="mb-3 d-flex gap-2">
            <button class="btn btn-outline-danger" id="btn-delete-model">刪除並重新下載模型</button>
        </div>

        <div class="input-group mb-3">
            <input type="text" id="query-input" class="form-control" placeholder="輸入要查的東西，例如：服儀規定是什麼？" disabled>
            <button class="btn btn-primary" id="btn-search" disabled>查詢</button>
        </div>

        <div id="chat-box">
            <p class="text-muted">請先選擇校規資料夾，並選擇學校後即可開始查詢。</p>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
