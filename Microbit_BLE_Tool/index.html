<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Micro:bit 藍芽 UART LED 控制器 (網頁版)</title>
    <style>
        body { font-family: '微軟正黑體', sans-serif; background: #222; color: #eee; text-align: center; padding-top: 50px; }
        .grid { display: inline-grid; grid-template-columns: repeat(5, 50px); gap: 5px; margin: 20px auto; }
        .cell { width: 50px; height: 50px; background: #444; border: 2px solid #555; border-radius: 5px; cursor: pointer; transition: 0.1s; }
        .cell.on { background: #ff3333; border-color: #ffaaaa; box-shadow: 0 0 10px red; }
        input[type="text"] { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #555; background: #333; color: white; margin-bottom: 10px; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        button:hover { background: #45a049; }
        .hint { color: #888; font-size: 14px; margin-top: 20px; line-height: 1.6; }
    </style>
</head>
<body>
    <h1>Micro:bit 藍芽 UART 傳送端</h1>
    <p id="status" style="font-size: 1.2em; color: #aaa;">尚未連線 (請使用 Chrome 或 Edge 瀏覽器)</p>
    
    <div>
        <input type="text" id="pwdInput" placeholder="請輸入連線密碼 (若無免填)">
    </div>
    <button id="connectBtn">連接 Micro:bit</button>

    <br>
    <div class="grid" id="ledGrid"></div>

    <div class="hint">
        <p>💡 <b>Micro:bit 準備事項：</b></p>
        <p>1. 擴充：<code>https://github.com/pandapanda6666/pxt-microbit-ble</code></p>
        <p>2. 拉出 <b>啟動藍芽 UART 矩陣接收器</b> 積木到「當啟動時」。</p>
        <p>3. 若需加密，拉出 <b>設定藍芽通訊密碼</b> 積木並在此網頁填入相同密碼。</p>
        <p>4. 專案設定將連線模式設為「<b>No Pairing Required</b>」。</p>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; 

        let txChar = null;
        const matrix = Array.from({length: 5}, () => Array(5).fill(false));

        const grid = document.getElementById("ledGrid");
        for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 5; c++) {
                let div = document.createElement("div");
                div.className = "cell";
                div.onclick = () => {
                    matrix[r][c] = !matrix[r][c];
                    div.classList.toggle("on", matrix[r][c]);
                    sendMatrix();
                };
                grid.appendChild(div);
            }
        }

        document.getElementById("connectBtn").onclick = async () => {
            try {
                document.getElementById("status").innerText = "請求藍芽裝置中... 請在彈出視窗選擇你的 Micro:bit";
                document.getElementById("status").style.color = "#00aaff";
                
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "BBC micro:bit" }],
                    optionalServices: [SERVICE_UUID]
                });
                
                device.addEventListener('gattserverdisconnected', () => {
                    document.getElementById("status").innerText = "連線已斷開！";
                    document.getElementById("status").style.color = "red";
                    document.getElementById("connectBtn").style.display = "inline-block";
                    txChar = null;
                });

                document.getElementById("status").innerText = "連接中...";
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                txChar = await service.getCharacteristic(CHAR_UUID_RX);
                
                document.getElementById("status").innerText = "連線成功！正在解鎖...";

                // 發送密碼進行解鎖 (如果有填)
                let pwd = document.getElementById("pwdInput").value.trim();
                let encoder = new TextEncoder();
                if (pwd !== "") {
                    let pwdData = encoder.encode("PWD:" + pwd + "\n");
                    await txChar.writeValue(pwdData);
                    // 等待 Micro:bit 處理驗證
                    await new Promise(r => setTimeout(r, 200));
                }

                document.getElementById("status").innerText = "連線成功！點擊下方格子發送 UART 訊號。";
                document.getElementById("status").style.color = "#4CAF50";
                document.getElementById("connectBtn").style.display = "none";
                sendMatrix();
            } catch (err) {
                document.getElementById("status").innerText = "連線失敗: " + err;
                document.getElementById("status").style.color = "red";
            }
        };

        async function sendMatrix() {
            if (!txChar) return;
            
            let str = "";
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    str += matrix[r][c] ? "1" : "0";
                }
            }
            str += "\n";

            let encoder = new TextEncoder();
            let data = encoder.encode(str);

            try {
                await txChar.writeValue(data);
            } catch (e) {
                console.error("發送失敗:", e);
            }
        }
    </script>
</body>
</html>
