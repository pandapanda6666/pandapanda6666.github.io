<script>
    // --- ??嚗?閮?撠迨蝬脤??雯?嚗??乩撩?蝞∠??Ｘ??CORS ??蝬脣??賢??桐葉嚗???⊥???? ---

    // ==========================================
    // 1. ????Leaflet ?啣?
    // ==========================================
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '穢 OpenStreetMap' });
    const esriSatelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles &copy; Esri' });
    const cartoLabelsLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { maxZoom: 19, attribution: '&copy; CARTO', pane: 'shadowPane' });
    const hybridLayer = L.layerGroup([esriSatelliteLayer, cartoLabelsLayer]);
    
    const baseMaps = {
        "?桅??: osmLayer,
        "銵?敶勗?": esriSatelliteLayer,
        "瘛瑕??啣? (銵?+??)": hybridLayer
    };

    const map = L.map('map', { layers: [osmLayer], maxZoom: 19, zoomControl: false }).setView([24.956, 121.298], 13);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);
    L.control.layers(baseMaps, null, { position: 'bottomleft' }).addTo(map);

    let currentLayerId = "?桅??;
    map.on('baselayerchange', function(e) {
        currentLayerId = e.name;
        renderProjects();
    });

    L.Control.geocoder({ defaultMarkGeocode: true, placeholder: '???圈?...', errorMessage: '?曆??啁??? }).on('markgeocode', e => map.fitBounds(e.geocode.bbox)).addTo(map);
    L.easyButton({
        states: [{
            stateName: 'get-location', icon: 'fa-location-arrow', title: '摰?',
            onClick: function(btn, map) { map.locate({ enableHighAccuracy: true }); }
        }]
    }).addTo(map);

    // ==========================================
    // 2. ????Fabric.js ?怠?
    // ==========================================
    const canvasObj = new fabric.Canvas('drawing-layer', { isDrawingMode: false, selection: true });
    let currentScaleMode = 'stretch'; 

    function resizeCanvas() {
        const mapContainer = document.getElementById('map-container');
        canvasObj.setWidth(mapContainer.clientWidth);
        canvasObj.setHeight(mapContainer.clientHeight);
        canvasObj.renderAll();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function clearFabricSelection() {
        canvasObj.discardActiveObject();
        canvasObj.requestRenderAll();
    }
    
    function setInteractiveMode(enabled) {
        if(enabled) {
            document.querySelector('.canvas-container').classList.add('interactive');
        } else {
            document.querySelector('.canvas-container').classList.remove('interactive');
        }
    }

    function setActiveBtn(id) {
        ['btn-draw','btn-rect','btn-circle','btn-select'].forEach(b => document.getElementById(b).classList.remove('bg-gray-200','shadow-inner'));
        if(id !== 'upload') document.getElementById(id).classList.add('bg-gray-200','shadow-inner');
    }

    canvasObj.freeDrawingBrush.color = '#4f46e5';
    canvasObj.freeDrawingBrush.width = 4;

    document.getElementById('btn-draw').onclick = () => {
        canvasObj.isDrawingMode = true;
        setInteractiveMode(true);
        setActiveBtn('btn-draw');
    };
    document.getElementById('btn-select').onclick = () => {
        canvasObj.isDrawingMode = false;
        setInteractiveMode(true);
        setActiveBtn('btn-select');
    };
    document.getElementById('btn-rect').onclick = () => {
        canvasObj.isDrawingMode = false; setActiveBtn('btn-rect'); setInteractiveMode(true);
        const rect = new fabric.Rect({ left: canvasObj.width/2-50, top: canvasObj.height/2-50, fill: 'rgba(59,130,246,0.3)', width: 100, height: 100, stroke: '#3b82f6', strokeWidth: 3, rx: 10, ry: 10 });
        canvasObj.add(rect); canvasObj.setActiveObject(rect);
    };
    document.getElementById('btn-circle').onclick = () => {
        canvasObj.isDrawingMode = false; setActiveBtn('btn-circle'); setInteractiveMode(true);
        const circle = new fabric.Circle({ left: canvasObj.width/2-50, top: canvasObj.height/2-50, fill: 'rgba(239,68,68,0.3)', radius: 50, stroke: '#ef4444', strokeWidth: 3 });
        canvasObj.add(circle); canvasObj.setActiveObject(circle);
    };
    document.getElementById('upload-image').onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (f) => {
            fabric.Image.fromURL(f.target.result, (img) => {
                img.scaleToWidth(250);
                img.set({ left: canvasObj.width/2 - 125, top: canvasObj.height/2 - img.getScaledHeight()/2 });
                canvasObj.add(img); canvasObj.setActiveObject(img);
                canvasObj.isDrawingMode = false; setActiveBtn('upload'); setInteractiveMode(true);
            });
        };
        reader.readAsDataURL(file);
    };
    document.getElementById('btn-clear-canvas').onclick = () => { canvasObj.clear(); setInteractiveMode(false); setActiveBtn(''); };

    // 蝮格璅∪?: Crop vs Stretch (Ctrl 蝑?)
    document.getElementById('btn-scale-mode').onclick = (e) => {
        if(currentScaleMode === 'stretch') {
            currentScaleMode = 'crop';
            e.target.innerText = '?';
            canvasObj.uniformScaling = true;
        } else {
            currentScaleMode = 'stretch';
            e.target.innerText = '?撓';
            canvasObj.uniformScaling = false;
        }
    };
    canvasObj.on('object:scaling', function (e) {
        if (e.e.ctrlKey) { e.target.set({ lockUniScaling: true }); } 
        else if (currentScaleMode !== 'crop') { e.target.set({ lockUniScaling: false }); }
    });


    // ==========================================
    // 3. ?????霅?(SSO)
    // ==========================================
    async function initConnection() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            let serverUrl = urlParams.get('server');

            if (!serverUrl) {
                const res = await fetch('https://pandapanda6666.github.io/login-hub/server_url.txt');
                if (!res.ok) throw new Error('?⊥???隡箸??函雯?');
                const text = await res.text();
                serverUrl = atob(text.trim().split('').reverse().join(''));
            }

            socket = io(serverUrl, { transports: ['websocket'] });

            socket.on('connect', () => {
                socket.emit('initClientInfo', { location: '?芰?圈?', device: navigator.userAgent });
                checkLogin();
                
                socket.emit('joinGameRoom', { room: appId, characterData: {} });
                
                socket.emit('getAppData', { appId: appId }, (res) => {
                    if (res && res.data && res.data.projects) {
                        appData = res.data;
                        renderProjects();
                    }
                });

                socket.emit('getSystemContext', (res) => {
                    if(res && res.isAdmin) isAdmin = true;
                });
            });

            socket.on('connect_error', () => { showOfflineAuth(); });
            socket.on('playerJoined', (data) => { console.log('Player joined room:', data); });
            socket.on('playerLeft', (data) => { console.log('Player left room:', data); });
            
            socket.on('appData', (msg) => {
                if(msg.room === appId && msg.action === 'syncAppData') {
                    appData = msg.data;
                    renderProjects();
                    if(!document.getElementById('project-modal').classList.contains('hidden')) {
                        updateModalComments();
                    }
                }
            });
        } catch (err) {
            showOfflineAuth();
        }
    }

    function showOfflineAuth() {
        document.getElementById('auth-container').innerHTML = `<div class="px-5 py-2 text-red-500 font-bold bg-red-50 rounded-full text-sm">隡箸??券??憭望?嚗?蝔??岫</div>`;
    }

    function checkLogin() {
        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('token') || localStorage.getItem('panda_session_token');

        if (token) {
            socket.emit('tokenLogin', { token: token });
            socket.once('loginResult', (data) => {
                if (data.success) {
                    localStorage.setItem('panda_session_token', token);
                    const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                    window.history.replaceState({path: newUrl}, '', newUrl);
                    
                    currentUser = data.user;
                    updateAuthUI(true);
                    document.getElementById('toolbar').classList.remove('hidden');
                    document.getElementById('toolbar').classList.add('flex');
                } else {
                    localStorage.removeItem('panda_session_token');
                    updateAuthUI(false);
                }
            });
        } else {
            updateAuthUI(false);
        }
    }

    function updateAuthUI(isLoggedIn) {
        const container = document.getElementById('auth-container');
        if (isLoggedIn && currentUser) {
            container.innerHTML = `
                <img src="${currentUser.avatar || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full border-2 border-white shadow-sm object-cover bg-white ml-1">
                <div class="flex flex-col">
                    <span class="font-bold text-gray-800 text-sm leading-tight max-w-[100px] truncate">${currentUser.username}</span>
                    <span class="text-xs text-yellow-600 font-bold flex items-center gap-1">
                        <i class="fas fa-coins text-yellow-500"></i> ${currentUser.pcoins || 0}
                    </span>
                </div>
            `;
            container.onclick = () => { window.location.href = 'https://pandapanda6666.github.io/login-hub/?from=' + encodeURIComponent(window.location.href); };
        } else {
            container.innerHTML = `
                <div class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-6 rounded-full transition shadow text-sm w-full text-center">
                    ?餃 / 閮餃?
                </div>
            `;
            container.classList.remove('p-1', 'pr-4');
            container.onclick = () => { window.location.href = 'https://pandapanda6666.github.io/login-hub/?require=1&from=' + encodeURIComponent(window.location.href); };
        }
    }

    document.getElementById('report-btn').onclick = () => {
        window.location.href = 'https://pandapanda6666.github.io/login-hub/?action=reportIssue&from=' + encodeURIComponent(window.location.href);
    };

    // ==========================================
    // 4. 頝收?誨?剖???
    // ==========================================
    function initBroadcast() {
        const loadOffline = () => { window.broadcasts = JSON.parse(localStorage.getItem('broadcasts')||'[]'); };
        fetch('https://pandapanda6666.github.io/login-hub/server_broadcast.json')
            .then(res=>res.json())
            .then(list => { 
                window.broadcasts = list; 
                localStorage.setItem('broadcasts', JSON.stringify(list)); 
            }).catch(loadOffline);
            
        setInterval(() => {
            if(typeof socket !== 'undefined' && socket.connected) {
                socket.on('broadcastSchedule', (list) => {
                    localStorage.setItem('broadcasts', JSON.stringify(list));
                    window.broadcasts = list;
                });
            }
        }, 30000); 

        setInterval(() => {
            const now = Date.now(); 
            const bar = document.getElementById('notificationBar'); 
            const msgText = document.getElementById('notificationMsg');
            let activeMsg = null; 
            const list = window.broadcasts || JSON.parse(localStorage.getItem('broadcasts') || '[]');
            
            for (let b of list) {
                const st = new Date(b.startTime).getTime();
                if (b.mode === 1) {
                    const intervalMs = b.intervalMin * 60000; 
                    const end = st + ((b.repeatCount - 1) * intervalMs) + 60000;
                    if (now >= st && now <= end) { 
                        const elapsed = now - st; 
                        if (elapsed % intervalMs < 60000) activeMsg = b.message; 
                    }
                } else if (b.mode === 2) { 
                    const et = new Date(b.endTime).getTime(); 
                    if (now >= st && now <= et) activeMsg = b.message; 
                }
            }
            if (activeMsg) { 
                if(msgText.innerText !== activeMsg) msgText.innerText = activeMsg; 
                bar.style.display = 'block'; 
            } else { 
                bar.style.display = 'none'; 
            }
        }, 1000);
    }

    // ==========================================
    // 5. 撠??摩??葡??
    // ==========================================
    let projectMarkers = [];
    let currentOpenProjectId = null;

    document.getElementById('project-filter').addEventListener('change', renderProjects);

    function renderProjects() {
        projectMarkers.forEach(m => map.removeLayer(m));
        projectMarkers = [];

        const filter = document.getElementById('project-filter').value;
        if(filter === 'none') return;

        if(!appData.projects) appData.projects = [];
        
        appData.projects.forEach(p => {
            if (filter === 'approved' && p.status !== 'approved') return;
            if (filter === 'pending' && p.status !== 'pending') return;
            if (p.layerId !== currentLayerId) return;

            const iconHtml = `
                <div class="relative group cursor-pointer transition-transform hover:scale-110">
                    <img src="${p.creatorAvatar}" class="w-12 h-12 rounded-full border-4 ${p.status==='approved'?'border-indigo-500':'border-yellow-400'} shadow-lg object-cover bg-white">
                    ${p.isAdmin ? '<div class="absolute -bottom-1 -right-2 bg-red-500 text-white text-[9px] px-1.5 py-0.5 rounded shadow-sm font-black tracking-widest border border-white">ADMIN</div>' : ''}
                </div>
            `;
            const icon = L.divIcon({ html: iconHtml, className: '', iconSize: [48, 48], iconAnchor: [24, 24] });

            const marker = L.marker([p.lat, p.lng], { icon: icon }).addTo(map);
            marker.on('click', () => openProjectModal(p));
            projectMarkers.push(marker);
        });
    }

    function syncAndSaveCloud() {
        socket.emit('saveAppData', { appId: appId, data: appData });
        socket.emit('appData', { room: appId, action: 'syncAppData', data: appData });
    }

    document.getElementById('btn-save-project').onclick = () => {
        if(!currentUser) return alert('隢??餃嚗?);
        if(canvasObj.getObjects().length === 0) return alert('隢??函撣??恍??梯正嚗?);
        
        clearFabricSelection();
        document.getElementById('proj-layer-name').innerText = currentLayerId;
        document.getElementById('publish-modal').classList.remove('hidden');
    };

    document.getElementById('confirm-publish').onclick = () => {
        const name = document.getElementById('proj-name').value.trim();
        const desc = document.getElementById('proj-desc').value.trim();
        if(!name) return alert('隢撓?亙?蝔?);

        const center = map.getCenter();
        const isUserAdmin = isAdmin || (currentUser.role === 'admin');

        const newProj = {
            id: 'proj_' + Date.now(),
            name: name,
            desc: desc,
            layerId: currentLayerId,
            creatorId: currentUser.id || currentUser.uid,
            creatorName: currentUser.username,
            creatorAvatar: currentUser.avatar,
            isAdmin: isUserAdmin,
            status: isUserAdmin ? 'approved' : 'pending',
            lat: center.lat,
            lng: center.lng,
            zoom: map.getZoom(),
            fabricJSON: canvasObj.toJSON(),
            comments: []
        };

        appData.projects.push(newProj);
        syncAndSaveCloud();
        socket.emit('logAppMessage', { appId: appId, message: `?澆?鈭??獢? ${name}`, type: 'info' });

        document.getElementById('publish-modal').classList.add('hidden');
        document.getElementById('proj-name').value = '';
        document.getElementById('proj-desc').value = '';
        canvasObj.clear();
        setInteractiveMode(false);
        setActiveBtn('');

        // ?內
        const Toast = Swal ? Swal.mixin({toast: true, position: 'top-end', showConfirmButton: false, timer: 3000}) : null;
        if(Toast) Toast.fire({icon: 'success', title: '撠??澆???'}); else alert('?澆???嚗?);
    };

    function openProjectModal(proj) {
        currentOpenProjectId = proj.id;
        document.getElementById('modal-proj-name').innerText = proj.name;
        document.getElementById('modal-proj-desc').innerText = proj.desc || '?∩?蝝?;
        document.getElementById('modal-proj-avatar').src = proj.creatorAvatar;
        
        let authorHtml = proj.creatorName;
        document.getElementById('modal-proj-author').innerHTML = authorHtml;

        const statusEl = document.getElementById('modal-proj-status');
        if(proj.status === 'approved') {
            statusEl.innerText = '撌脫??;
            statusEl.className = 'px-2 py-0.5 rounded text-[10px] font-bold tracking-wider bg-indigo-100 text-indigo-700 border border-indigo-200';
        } else {
            statusEl.innerText = '敺祟??;
            statusEl.className = 'px-2 py-0.5 rounded text-[10px] font-bold tracking-wider bg-yellow-100 text-yellow-700 border border-yellow-200';
        }

        const adminActions = document.getElementById('admin-actions');
        if(isAdmin && proj.status === 'pending') {
            adminActions.classList.remove('hidden');
            document.getElementById('btn-approve').onclick = () => {
                proj.status = 'approved';
                syncAndSaveCloud();
                socket.emit('logAppMessage', { appId: appId, message: `蝞∠??⊥??撠?: ${proj.name}`, type: 'info' });
                openProjectModal(proj); 
            };
        } else {
            adminActions.classList.add('hidden');
        }

        updateModalComments();
        document.getElementById('project-modal').classList.remove('hidden');

        // ?汗
        map.flyTo([proj.lat, proj.lng], proj.zoom);
        canvasObj.loadFromJSON(proj.fabricJSON, () => {
            canvasObj.getObjects().forEach(o => o.set({ selectable: false, evented: false }));
            canvasObj.renderAll();
        });
    }

    function updateModalComments() {
        if(!currentOpenProjectId) return;
        const proj = appData.projects.find(p => p.id === currentOpenProjectId);
        if(!proj) return;

        const listEl = document.getElementById('comments-list');
        listEl.innerHTML = '';
        
        if(!proj.comments || proj.comments.length === 0) {
            listEl.innerHTML = '<div class="text-gray-400 text-sm text-center py-6 bg-white rounded-xl border border-dashed border-gray-300">?桀?????閮嚗??園擐嚗?/div>';
            return;
        }

        proj.comments.forEach(c => {
            listEl.innerHTML += `
                <div class="flex gap-3 bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                    <img src="${c.userAvatar}" class="w-10 h-10 rounded-full object-cover shadow-sm bg-gray-50">
                    <div class="flex-1">
                        <div class="flex justify-between items-baseline mb-1">
                            <span class="text-xs font-bold text-gray-800">${c.userName}</span>
                            <span class="text-[10px] text-gray-400">${new Date(c.timestamp).toLocaleString()}</span>
                        </div>
                        <div class="text-sm text-gray-600 leading-relaxed">${c.text}</div>
                    </div>
                </div>
            `;
        });
        listEl.scrollTop = listEl.scrollHeight;
    }

    document.getElementById('btn-send-comment').onclick = () => {
        if(!currentUser) return alert('隢??餃嚗?);
        const text = document.getElementById('comment-input').value.trim();
        if(!text) return;

        const proj = appData.projects.find(p => p.id === currentOpenProjectId);
        if(proj) {
            if(!proj.comments) proj.comments = [];
            proj.comments.push({
                userId: currentUser.id || currentUser.uid,
                userName: currentUser.username,
                userAvatar: currentUser.avatar,
                text: text,
                timestamp: Date.now()
            });
            document.getElementById('comment-input').value = '';
            syncAndSaveCloud();
        }
    };

    // ??
    initBroadcast();
    initConnection();
    
</script>
