<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 晶片收集戰</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>
</head>
<body>
    <header>
        <h1>3D 晶片收集戰</h1>
        <div class="hud-container">
            <div id="statusBadge" class="status-badge disconnected">連線中斷</div>
            <div class="hud-item level-hud">關卡: <span id="levelDisplay">1</span>/3</div>
            <div class="hud-item time-hud">時間: <span id="timeDisplay">60</span>s</div>
            <div class="hud-item score-hud">分數: <span id="scoreDisplay">0</span></div>
        </div>
        <div class="quests-container">
            <div class="quest-item main-quest">主線: 收集晶片 <span id="mainQuestProgress">0/0</span></div>
            <div class="quest-item side-quest">支線: 收集電容 <span id="sideQuestProgress">0/0</span></div>
        </div>
    </header>
    
    <div id="game-container"></div>

    <div class="controls-panel">
        <button id="cameraBtn" class="btn" style="margin-bottom: 0.5rem;">切換視角 (預設)</button>
        <label class="checkbox-container" id="cameraFollowLabel" style="display: none;">
            <input type="checkbox" id="cameraFollowToggle" checked>
            <span class="checkmark"></span> 俯視時跟隨球
        </label>
        <button id="calibrateBtn" class="btn">校準 (平放後點擊)</button>
        <div class="info-group">
            <div class="info-label">俯仰角 (Pitch)</div>
            <div class="info-value" id="valPitch">0.00°</div>
            <div class="info-label">翻滾角 (Roll)</div>
            <div class="info-value" id="valRoll">0.00°</div>
        </div>
    </div>

    <div id="overlayScreen" class="overlay hidden">
        <div class="win-dialog">
            <h2 id="overlayTitle">提示</h2>
            <p id="overlayMessage">訊息</p>
            <button id="nextLevelBtn" class="btn hidden">下一關</button>
            <button id="restartBtn" class="btn hidden">再來一局</button>
        </div>
    </div>

    <script type="module" src="./main.js?v=12"></script>
</body>
</html>
