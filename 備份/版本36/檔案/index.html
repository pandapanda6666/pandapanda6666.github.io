        if (typeof socket !== 'undefined' && socket.connected) socket.emit('logError', { errorMsg: msg, url: url, line: line }); 
    };
    window.addEventListener('unhandledrejection', function(event) {
        if (typeof socket !== 'undefined' && socket.connected) socket.emit('logError', { errorMsg: 'Promise異常: ' + (event.reason ? event.reason.message || event.reason : '未知錯誤'), url: window.location.href, line: 0 });

<script>
    // ==========================================
    // 1. 初始化 Leaflet 地圖
    // ==========================================
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
    const esriSatelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles &copy; Esri' });
    const cartoLabelsLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { maxZoom: 19, attribution: '&copy; CARTO', pane: 'shadowPane' });
    const hybridLayer = L.layerGroup([esriSatelliteLayer, cartoLabelsLayer]);
    
    const baseMaps = {
        "普通地圖": osmLayer,
        "衛星影像": esriSatelliteLayer,

    // 取得當前屬性
    function getProps() {
        const isSolid = document.querySelector('input[name="fillType"]:checked').value === 'solid';
        const hasBorder = document.getElementById('toggle-border').checked;
        const fillColor = document.getElementById('color-fill').value;
        const borderColor = document.getElementById('color-border').value;
        const opacity = parseInt(document.getElementById('obj-opacity').value, 10) / 100;
        
        return {
            fill: isSolid ? fillColor : 'transparent',
            stroke: hasBorder ? borderColor : 'transparent',
            strokeWidth: hasBorder ? parseInt(document.getElementById('selection-width').value, 10) || 4 : 0,
            strokeUniform: true,
            opacity: opacity
        };
    }

    function updateActiveObjectProps() {
        const activeObj = canvasObj.getActiveObject();
        if(!activeObj) return;
        const props = getProps();
        
        if (activeObj.type === 'line' || activeObj.type === 'path') {
            activeObj.set({ stroke: props.stroke !== 'transparent' ? props.stroke : props.fill, opacity: props.opacity, strokeWidth: props.strokeWidth || 4 });
        } else if (activeObj.type === 'image') {
            activeObj.set({ opacity: props.opacity });
            const rx = parseInt(document.getElementById('rect-radius').value, 10);
            if (rx > 0) {
                const clipPath = new fabric.Rect({
                    width: activeObj.width,
                    height: activeObj.height,
                    originX: 'center', originY: 'center',
                    rx: rx, ry: rx
                });
                activeObj.set({ clipPath: clipPath });
            } else {
                activeObj.set({ clipPath: null });
            }
        } else {
            activeObj.set(props);
            if (activeObj.type === 'rect') {
                const rx = parseInt(document.getElementById('rect-radius').value, 10);
                activeObj.set({ rx: rx, ry: rx });
            }
        }
        canvasObj.requestRenderAll();
        saveCanvasState();
    }

    // 刪除按鈕與鍵盤 Delete 鍵
    function deleteActiveObject() {

    function performUndo() {
        if (undoStack.length === 0) return;
        isStateAction = true;
        redoStack.push(JSON.stringify(canvasObj.toJSON()));
        let state = undoStack.pop();
        canvasObj.loadFromJSON(state, function() {
            canvasObj.renderAll();
            isStateAction = false;
        });
    }

    function performRedo() {
        if (redoStack.length === 0) return;
        isStateAction = true;
        undoStack.push(JSON.stringify(canvasObj.toJSON()));
        let state = redoStack.pop();
        canvasObj.loadFromJSON(state, function() {
            canvasObj.renderAll();
            isStateAction = false;
        });
    }

    function copyActiveObject() {
        if (!canvasObj.getActiveObject()) return;
        canvasObj.getActiveObject().clone(function(cloned) {
            clipboard = cloned;
        });
    }

    function pasteObject() {
        if (!clipboard) return;
        clipboard.clone(function(clonedObj) {
            canvasObj.discardActiveObject();
            clonedObj.set({
                left: clonedObj.left + 20,
                top: clonedObj.top + 20,
                evented: true,
            });
            if (clonedObj.type === 'activeSelection') {
                clonedObj.canvas = canvasObj;
                clonedObj.forEachObject(function(obj) { canvasObj.add(obj); });
                clonedObj.setCoords();
            } else {
                canvasObj.add(clonedObj);
            }
            clipboard.top += 20;
            clipboard.left += 20;
            canvasObj.setActiveObject(clonedObj);
            canvasObj.requestRenderAll();
            saveCanvasState();
        });
    }

    window.addEventListener('keydown', (e) => {
        const isInput = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';
        if(e.key === 'Delete' || e.key === 'Backspace') {
            if(!isInput) deleteActiveObject();
        }
        if(e.code === 'Space' && !isInput) {
            e.preventDefault();
            const selectBtn = document.getElementById('btn-select');
            if (selectBtn.classList.contains('bg-gray-200')) {
                document.getElementById('btn-draw').click();
            } else {
                selectBtn.click();
            }
        }
        
        // Ctrl Shortcuts
        if (e.ctrlKey && !isInput) {
            if (e.key.toLowerCase() === 'z') {
                if (e.shiftKey) performRedo();
                else performUndo();
                e.preventDefault();
            }
            if (e.key.toLowerCase() === 'y') {
                performRedo();
                e.preventDefault();
            }
            if (e.key.toLowerCase() === 'c') {
                copyActiveObject();
                e.preventDefault();
            }
            if (e.key.toLowerCase() === 'v') {

    canvasObj.on('mouse:down', function(o) {
        if (!lineMode) return;
        isDrawingLine = true;
        const pointer = canvasObj.getPointer(o.e);
        const points = [pointer.x, pointer.y, pointer.x, pointer.y];
        const props = getProps();
        const color = props.stroke !== 'transparent' ? props.stroke : props.fill;
        line = new fabric.Line(points, {
            strokeWidth: props.strokeWidth > 0 ? props.strokeWidth : 4,
            fill: color,
            stroke: color,
            originX: 'center',
            originY: 'center',
            selectable: false,
            evented: false,
            strokeUniform: true
        });
        canvasObj.add(line);
    });

    canvasObj.on('mouse:move', function(o) {
        if (!isDrawingLine) return;
        const pointer = canvasObj.getPointer(o.e);
        line.set({ x2: pointer.x, y2: pointer.y });
        canvasObj.renderAll();
    });

    canvasObj.on('mouse:up', function(o) {
        if(isDrawingLine) {
            line.setCoords();
            line.set({ selectable: true, evented: true });

    // Map Panning and Zooming Logic
    canvasObj.on('mouse:down', function(opt) {
        const isSelectMode = document.getElementById('btn-select').classList.contains('bg-gray-200');
        if (opt.e.button === 2 || (isSelectMode && opt.target === null)) {
            isPanningMap = true;
            panStart = { x: opt.e.clientX, y: opt.e.clientY };
            canvasObj.defaultCursor = 'grabbing';
        }
    });

    canvasObj.on('mouse:move', function(opt) {
        if (isPanningMap) {
            const dx = opt.e.clientX - panStart.x;
            const dy = opt.e.clientY - panStart.y;
            map.panBy([-dx, -dy], {animate: false});
            panStart = { x: opt.e.clientX, y: opt.e.clientY };
        }
    });

    canvasObj.on('mouse:up', function(opt) {
        if (isPanningMap) {

            canvasObj.defaultCursor = 'default';

    document.getElementById('btn-scale-mode').onclick = (e) => {

    // 處理縮放行為：若是Resize，更新實際屬性；若是Stretch，直接變形
    canvasObj.on('object:scaling', function (e) {
        let obj = e.target;
        
        // Ctrl 鍵可以強制等比例
        if (e.e.ctrlKey) { 
            obj.set({ lockUniScaling: true }); 
        } else { 
            obj.set({ lockUniScaling: false }); 
        }

        // 如果是 Resize 模式且不是線段，透過調整寬高來改變大小，避免形狀拉伸失真 (特別是圓角)
        if (currentScaleMode === 'resize') {
            if (obj.type === 'rect') {
                obj.set({ 
                    width: obj.width * obj.scaleX, 
                    height: obj.height * obj.scaleY, 
                    scaleX: 1, 
                    scaleY: 1 
                });
            } else if (obj.type === 'circle') {
                obj.set({ 
                    radius: obj.radius * obj.scaleX, 
                    scaleX: 1, 
                    scaleY: 1 
                });
            }
        }
    });

    // ==========================================
    // 3. 連線與驗證 (SSO)
    // ==========================================
    async function initConnection() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            let serverUrl = urlParams.get('server');

            if (!serverUrl) {
                const res = await fetch('https://pandapanda6666.github.io/login-hub/server_url.txt');
                if (!res.ok) throw new Error('無法取得伺服器網址');
                const text = await res.text();
                serverUrl = atob(text.trim().split('').reverse().join(''));
            }

            socket = io(serverUrl, { transports: ['websocket'] });

            socket.on('connect', () => {
                socket.emit('initClientInfo', { location: '未知地點', device: navigator.userAgent });
                checkLogin();
                
                socket.emit('joinGameRoom', { room: appId, characterData: {} });
                
                socket.emit('getAppData', { appId: appId }, (res) => {
                    if (res && res.data && res.data.projects) {
                        appData = res.data;
                        renderProjects();
                    }
                });

                socket.emit('getSystemContext', (res) => {
                    if(res && res.isAdmin) isAdmin = true;
                });
            });

            socket.on('connect_error', () => { showOfflineAuth(); });
            
            socket.on('appData', (msg) => {
                if(msg.room === appId && msg.action === 'syncAppData') {
                    appData = msg.data;
                    renderProjects();
                    if(!document.getElementById('project-modal').classList.contains('hidden')) {
                        updateModalComments();
                    }
                }
            });
        } catch (err) {
            showOfflineAuth();
        }
    }

    function showOfflineAuth() {
        document.getElementById('auth-container').innerHTML = `<div class="px-5 py-2 text-red-500 font-bold bg-red-50 rounded-full text-sm">伺服器連線失敗，請稍後再試</div>`;
    }

    function checkLogin() {
        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('token') || localStorage.getItem('panda_session_token');

        if (token) {
            socket.emit('tokenLogin', { token: token });
            socket.once('loginResult', (data) => {
                const userObj = data.userData || data.user || (data.success ? data : null);
                
                if (data.success && userObj) {
                    localStorage.setItem('panda_session_token', data.token || token);
                    const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                    window.history.replaceState({path: newUrl}, '', newUrl);
                    
                    currentUser = userObj;
                    updateAuthUI(true);
                    document.getElementById('toolbar').classList.remove('hidden');
                    document.getElementById('toolbar').classList.add('flex');
                } else {
                    localStorage.removeItem('panda_session_token');
                    updateAuthUI(false);
                }
            });
        } else {
            updateAuthUI(false);
        }
    }

    function updateAuthUI(isLoggedIn) {
        const container = document.getElementById('auth-container');
        if (isLoggedIn && currentUser) {
            const avatarUrl = currentUser.avatar || currentUser.photoURL || 'https://via.placeholder.com/40';
            const name = currentUser.username || currentUser.name || currentUser.displayName || '未知玩家';
            const coins = currentUser.pcoins || currentUser.coins || 0;

            container.innerHTML = `
                <img src="${avatarUrl}" class="w-10 h-10 rounded-full border-2 border-white shadow-sm object-cover bg-white ml-1">
                <div class="flex flex-col">
                    <span class="font-bold text-gray-800 text-sm leading-tight max-w-[100px] truncate">${name}</span>
                    <span class="text-xs text-yellow-600 font-bold flex items-center gap-1">
                        <i class="fas fa-coins text-yellow-500"></i> ${coins}
                    </span>
                </div>
            `;
            container.onclick = () => { window.location.href = 'https://pandapanda6666.github.io/login-hub/?from=' + encodeURIComponent(window.location.href); };
        } else {
            container.innerHTML = `
                <div class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-6 rounded-full transition shadow text-sm w-full text-center">
                    登入 / 註冊
                </div>
            `;
            container.classList.remove('p-1', 'pr-4');
            container.onclick = () => { window.location.href = 'https://pandapanda6666.github.io/login-hub/?require=1&from=' + encodeURIComponent(window.location.href); };
        }
    }

    document.getElementById('report-btn').onclick = () => {
        window.location.href = 'https://pandapanda6666.github.io/login-hub/?action=reportIssue&from=' + encodeURIComponent(window.location.href);
    };

    // ==========================================
    // 4. 跑馬燈廣播功能
    // ==========================================
    function initBroadcast() {
        const loadOffline = () => { window.broadcasts = JSON.parse(localStorage.getItem('broadcasts')||'[]'); };
        fetch('https://pandapanda6666.github.io/login-hub/server_broadcast.json')
            .then(res=>res.json())
            .then(list => { 
                window.broadcasts = list; 
                localStorage.setItem('broadcasts', JSON.stringify(list)); 
            }).catch(loadOffline);
            
        setInterval(() => {
            if(typeof socket !== 'undefined' && socket.connected) {
                socket.on('broadcastSchedule', (list) => {
                    localStorage.setItem('broadcasts', JSON.stringify(list));
                    window.broadcasts = list;
                });
            }
        }, 30000); 

        setInterval(() => {
            const now = Date.now(); 
            const bar = document.getElementById('notificationBar'); 
            const msgText = document.getElementById('notificationMsg');
            let activeMsg = null; 
            const list = window.broadcasts || JSON.parse(localStorage.getItem('broadcasts') || '[]');
            
            for (let b of list) {
                const st = new Date(b.startTime).getTime();
                if (b.mode === 1) {
                    const intervalMs = b.intervalMin * 60000; 
                    const end = st + ((b.repeatCount - 1) * intervalMs) + 60000;
                    if (now >= st && now <= end) { 
                        const elapsed = now - st; 
                        if (elapsed % intervalMs < 60000) activeMsg = b.message; 
                    }
                } else if (b.mode === 2) { 
                    const et = new Date(b.endTime).getTime(); 
                    if (now >= st && now <= et) activeMsg = b.message; 
                }
            }
            if (activeMsg) { 
                if(msgText.innerText !== activeMsg) msgText.innerText = activeMsg; 
                bar.style.display = 'block'; 
            } else { 
                bar.style.display = 'none'; 
            }
        }, 1000);
    }

    // ==========================================
    // 5. 專案邏輯與地圖渲染
    // ==========================================
    // ==========================================
    let projectMarkers = [];
    let currentOpenProjectId = null;
    let editingProjectId = null;
    let projectVisibility = {}; // { projId: true/false }

    function renderProjects() {
        projectMarkers.forEach(m => map.removeLayer(m));
        projectMarkers = [];

        if(!appData.projects) appData.projects = [];
        
        appData.projects.forEach(p => {
            if (projectVisibility[p.id] === undefined) projectVisibility[p.id] = true;
            
            // 地圖標記只顯示非草稿且勾選顯示的專案 (且必須在當前圖層)
            if (p.layerId === currentLayerId && projectVisibility[p.id] && p.status !== 'draft') {
                const iconHtml = `
                    <div class="relative group cursor-pointer transition-transform hover:scale-110">
                        <img src="${p.creatorAvatar}" class="w-12 h-12 rounded-full border-4 ${p.status==='approved'?'border-indigo-500':'border-yellow-400'} shadow-lg object-cover bg-white">
                        ${p.isAdmin ? '<div class="absolute -bottom-1 -right-2 bg-red-500 text-white text-[9px] px-1.5 py-0.5 rounded shadow-sm font-black tracking-widest border border-white">ADMIN</div>' : ''}
                    </div>
                `;
                const icon = L.divIcon({ html: iconHtml, className: '', iconSize: [48, 48], iconAnchor: [24, 24] });
                const marker = L.marker([p.lat, p.lng], { icon: icon }).addTo(map);
                marker.on('click', () => openProjectModal(p));
                projectMarkers.push(marker);
            }
        });
        
        renderProjectListUI();
    }

    function renderProjectListUI() {
        const exploreList = document.getElementById('explore-list-container');
        const myList = document.getElementById('my-projects-list-container');
        if(!exploreList || !myList) return;
        
        exploreList.innerHTML = '';
        myList.innerHTML = '';
        const currentUserId = currentUser ? (currentUser.id || currentUser.uid) : null;

        appData.projects.forEach(p => {
            const isVis = projectVisibility[p.id];
            const eyeClass = isVis ? 'fa-eye text-indigo-600' : 'fa-eye-slash text-gray-400';
            
            // 如果不是草稿，放進探索列表
            if (p.status !== 'draft') {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center text-[11px] p-1.5 hover:bg-white rounded border border-transparent hover:border-gray-200 transition-colors';
                item.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden cursor-pointer flex-1" onclick="flyToProject('${p.id}')">
                        <img src="${p.creatorAvatar}" class="w-4 h-4 rounded-full object-cover">
                        <span class="truncate ${isVis ? 'text-gray-800 font-medium' : 'text-gray-400'}">${p.name} ${p.layerId !== currentLayerId ? '<span class="text-gray-400">(不同圖層)</span>' : ''}</span>
                    </div>
                    <button class="px-2 hover:bg-gray-100 rounded toggle-vis-btn" data-id="${p.id}">
                        <i class="fas ${eyeClass}"></i>
                    </button>
                `;
                exploreList.appendChild(item);
            }
            
            // 如果是本人的專案，放進我的專案列表
            if (currentUserId && p.creatorId === currentUserId) {
                const myItem = document.createElement('div');
                myItem.className = 'flex justify-between items-center text-[11px] p-1.5 hover:bg-white rounded border border-transparent hover:border-gray-200 transition-colors group';
                myItem.innerHTML = `
                    <div class="flex items-center gap-1.5 overflow-hidden flex-1 cursor-pointer" onclick="flyToProject('${p.id}')">
                        <span class="${p.status==='draft'?'bg-gray-200 text-gray-600':'bg-indigo-100 text-indigo-600'} px-1 rounded text-[9px] font-bold">${p.status==='draft'?'草稿':'已發布'}</span>
                        <span class="truncate text-gray-800 font-medium">${p.name}</span>
                    </div>
                    <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button class="px-1.5 text-blue-500 hover:bg-blue-50 rounded btn-edit-proj" data-id="${p.id}" title="編輯"><i class="fas fa-edit"></i></button>
                        <button class="px-1.5 text-red-500 hover:bg-red-50 rounded btn-del-proj" data-id="${p.id}" title="刪除"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                myList.appendChild(myItem);
            }
        });

        // 綁定事件
        document.querySelectorAll('.toggle-vis-btn').forEach(btn => {
            btn.onclick = (e) => {
                const id = e.currentTarget.getAttribute('data-id');
                projectVisibility[id] = !projectVisibility[id];
                renderProjects();
            };
        });
        document.querySelectorAll('.btn-edit-proj').forEach(btn => {
            btn.onclick = (e) => editProject(e.currentTarget.getAttribute('data-id'));
        });
        document.querySelectorAll('.btn-del-proj').forEach(btn => {
            btn.onclick = (e) => deleteProject(e.currentTarget.getAttribute('data-id'));
        });
    }

    function flyToProject(id) {
        const p = appData.projects.find(x => x.id === id);
        if(p) map.flyTo([p.lat, p.lng], p.zoom);
    }

    function editProject(id) {
        const p = appData.projects.find(x => x.id === id);
        if(!p) return;
        editingProjectId = id;
        document.getElementById('toolbar').classList.remove('hidden');
        document.getElementById('toolbar').classList.add('flex');
        
        baseZoom = p.baseZoom || p.zoom;
        baseTopLeft = (p.baseLat && p.baseLng) ? L.latLng(p.baseLat, p.baseLng) : L.latLng(p.lat, p.lng);
        map.flyTo([p.lat, p.lng], p.zoom);
        
        canvasObj.loadFromJSON(p.fabricJSON, () => {
            canvasObj.getObjects().forEach(o => o.set({ selectable: true, evented: true }));
            canvasObj.renderAll();
        });
        setInteractiveMode(true);
        setActiveBtn('btn-pan');
    }

    function deleteProject(id) {
        if(!confirm('確定要刪除這個專案嗎？此操作無法復原。')) return;
        appData.projects = appData.projects.filter(x => x.id !== id);
        syncAndSaveCloud();
        renderProjects();
        if(editingProjectId === id) {
            cancelEdit();
        }
    }

    // Tab 切換
    document.getElementById('tab-explore').onclick = () => {
        document.getElementById('tab-explore').className = 'flex-1 text-center py-1 rounded bg-white text-indigo-600 shadow-sm transition';
        document.getElementById('tab-my-projects').className = 'flex-1 text-center py-1 rounded text-gray-500 hover:text-gray-700 transition';
        document.getElementById('panel-explore').classList.remove('hidden');
        document.getElementById('panel-my-projects').classList.add('hidden');
        document.getElementById('panel-explore').classList.add('flex');
    };
    document.getElementById('tab-my-projects').onclick = () => {
        if(!currentUser) return alert('請先登入！');
        document.getElementById('tab-my-projects').className = 'flex-1 text-center py-1 rounded bg-white text-indigo-600 shadow-sm transition';
        document.getElementById('tab-explore').className = 'flex-1 text-center py-1 rounded text-gray-500 hover:text-gray-700 transition';
        document.getElementById('panel-my-projects').classList.remove('hidden');
        document.getElementById('panel-explore').classList.add('hidden');
        document.getElementById('panel-my-projects').classList.add('flex');
    };

    // 批量顯示篩選器
    document.getElementById('btn-bulk-show').onclick = () => {
        const condition = document.getElementById('bulk-show-filter').value;
        appData.projects.forEach(p => {
            if(p.status === 'draft') return;
            let match = false;
            if (condition === 'all') match = true;
            if (condition === 'approved' && p.status === 'approved') match = true;
            if (condition === 'pending' && p.status === 'pending') match = true;
            if (match) projectVisibility[p.id] = true;
        });
        renderProjects();
    };
    document.getElementById('btn-show-all').onclick = () => {
        appData.projects.forEach(p => { if(p.status!=='draft') projectVisibility[p.id] = true; });
        renderProjects();
    };
    document.getElementById('btn-hide-all').onclick = () => {
        appData.projects.forEach(p => projectVisibility[p.id] = false);
        renderProjects();
    };

    // 新增專案 / 取消編輯
    document.getElementById('btn-new-project').onclick = () => {
        if(!currentUser) return alert('請先登入！');
        editingProjectId = null;
        canvasObj.clear();
        initCanvasAnchor();
        document.getElementById('toolbar').classList.remove('hidden');
        document.getElementById('toolbar').classList.add('flex');
        setInteractiveMode(true);
        setActiveBtn('btn-pan');
    };

    function cancelEdit() {
        editingProjectId = null;
        canvasObj.clear();
        document.getElementById('toolbar').classList.add('hidden');
        document.getElementById('toolbar').classList.remove('flex');
        setInteractiveMode(false);
    }
    document.getElementById('btn-cancel-edit').onclick = cancelEdit;

    // 儲存與發布邏輯
    function saveProjectData(isDraft, name, desc) {
        if(!currentUser) return alert('請先登入！');
        if(canvasObj.getObjects().length === 0) return alert('請先在畫布上畫點東西！');
        
        canvasObj.discardActiveObject();
        canvasObj.requestRenderAll();
        
        const center = map.getCenter();
        const isUserAdmin = isAdmin || (currentUser.role === 'admin');
        const status = isDraft ? 'draft' : (isUserAdmin ? 'approved' : 'pending');

        const projData = {
            id: editingProjectId || ('proj_' + Date.now()),
            name: name || '未命名專案',
            desc: desc || '',
            layerId: currentLayerId,
            creatorId: currentUser.id || currentUser.uid,
            creatorName: currentUser.username || currentUser.name || currentUser.displayName,
            creatorAvatar: currentUser.avatar || currentUser.photoURL,
            isAdmin: isUserAdmin,
            status: status,
            lat: center.lat,
            lng: center.lng,
            zoom: map.getZoom(),
            bearing: map.getBearing ? map.getBearing() : 0,
            baseLat: baseTopLeft ? baseTopLeft.lat : center.lat,
            baseLng: baseTopLeft ? baseTopLeft.lng : center.lng,
            baseZoom: baseZoom,
            fabricJSON: canvasObj.toJSON(),
            comments: []
        };

        if(editingProjectId) {
            const idx = appData.projects.findIndex(x => x.id === editingProjectId);
            if(idx !== -1) {
                // 保留舊留言
                projData.comments = appData.projects[idx].comments || [];
                appData.projects[idx] = projData;
            } else {
                appData.projects.push(projData);
            }
        } else {
            appData.projects.push(projData);
        }

        syncAndSaveCloud();
        if(!isDraft) {
            socket.emit('logAppMessage', { appId: appId, message: `發布了地圖專案: ${projData.name}`, type: 'info' });
        }
        
        cancelEdit();
        renderProjects();
        if(typeof Swal !== 'undefined') {
            Swal.mixin({toast: true, position: 'top-end', showConfirmButton: false, timer: 3000}).fire({icon: 'success', title: isDraft ? '草稿已儲存' : '專案發布成功'});
        } else {
            alert(isDraft ? '草稿已儲存' : '專案發布成功！');
        }
    }

    document.getElementById('btn-save-draft').onclick = () => {
        let name = "草稿";
        if(editingProjectId) {
            const p = appData.projects.find(x => x.id === editingProjectId);
            if(p) name = p.name;
        }
        saveProjectData(true, name, "");
    };

    document.getElementById('btn-save-project').onclick = () => {
        if(!currentUser) return alert('請先登入！');
        if(canvasObj.getObjects().length === 0) return alert('請先在畫布上畫點東西！');
        document.getElementById('proj-layer-name').innerText = currentLayerId;
        
        if(editingProjectId) {
            const p = appData.projects.find(x => x.id === editingProjectId);
            if(p) {
                document.getElementById('proj-name').value = p.name;
                document.getElementById('proj-desc').value = p.desc || '';
            }
        } else {
            document.getElementById('proj-name').value = '';
            document.getElementById('proj-desc').value = '';
        }
        
        document.getElementById('publish-modal').classList.remove('hidden');
    };

    document.getElementById('confirm-publish').onclick = () => {
        const name = document.getElementById('proj-name').value.trim();
        const desc = document.getElementById('proj-desc').value.trim();
        if(!name) return alert('請輸入名稱');
        
        document.getElementById('publish-modal').classList.add('hidden');
        saveProjectData(false, name, desc);
    };

    function openProjectModal(proj) {
        currentOpenProjectId = proj.id;
        document.getElementById('modal-proj-name').innerText = proj.name;
        document.getElementById('modal-proj-desc').innerText = proj.desc || '無介紹';
        document.getElementById('modal-proj-avatar').src = proj.creatorAvatar || 'https://via.placeholder.com/40';
        
        let authorHtml = proj.creatorName;
        document.getElementById('modal-proj-author').innerHTML = authorHtml;

        const statusEl = document.getElementById('modal-proj-status');
        if(proj.status === 'approved') {
            statusEl.innerText = '已批准';
            statusEl.className = 'px-2 py-0.5 rounded text-[10px] font-bold tracking-wider bg-indigo-100 text-indigo-700 border border-indigo-200';
        } else {
            statusEl.innerText = '待審核';
            statusEl.className = 'px-2 py-0.5 rounded text-[10px] font-bold tracking-wider bg-yellow-100 text-yellow-700 border border-yellow-200';
        }

        const adminActions = document.getElementById('admin-actions');
        if(isAdmin && proj.status === 'pending') {
            adminActions.classList.remove('hidden');
            document.getElementById('btn-approve').onclick = () => {
                proj.status = 'approved';
                syncAndSaveCloud();
                socket.emit('logAppMessage', { appId: appId, message: `管理員批准了專案: ${proj.name}`, type: 'info' });
                openProjectModal(proj); 
            };
        } else {
            adminActions.classList.add('hidden');
        }

        updateModalComments();
        document.getElementById('project-modal').classList.remove('hidden');

        baseZoom = proj.baseZoom || proj.zoom;
        baseTopLeft = (proj.baseLat && proj.baseLng) ? L.latLng(proj.baseLat, proj.baseLng) : L.latLng(proj.lat, proj.lng);
        
        map.flyTo([proj.lat, proj.lng], proj.zoom);
        if(map.setBearing && proj.bearing !== undefined) {
            map.setBearing(proj.bearing);
            document.getElementById('map-rotation').value = proj.bearing;
            document.getElementById('rotation-val').innerText = proj.bearing + '°';
        }
        canvasObj.loadFromJSON(proj.fabricJSON, () => {
            canvasObj.getObjects().forEach(o => o.set({ selectable: false, evented: false }));
            canvasObj.renderAll();
        });
    }

    function updateModalComments() {
        if(!currentOpenProjectId) return;
        const proj = appData.projects.find(p => p.id === currentOpenProjectId);
        if(!proj) return;

        const listEl = document.getElementById('comments-list');
        listEl.innerHTML = '';
        
        if(!proj.comments || proj.comments.length === 0) {
            listEl.innerHTML = '<div class="text-gray-400 text-sm text-center py-6 bg-white rounded-xl border border-dashed border-gray-300">目前還沒有留言，來搶頭香吧！</div>';
            return;
        }

        proj.comments.forEach(c => {
            listEl.innerHTML += `
                <div class="flex gap-3 bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                    <img src="${c.userAvatar || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full object-cover shadow-sm bg-gray-50">
                    <div class="flex-1">
                        <div class="flex justify-between items-baseline mb-1">
                            <span class="text-xs font-bold text-gray-800">${c.userName}</span>
                            <span class="text-[10px] text-gray-400">${new Date(c.timestamp).toLocaleString()}</span>
                        </div>
                        <div class="text-sm text-gray-600 leading-relaxed">${c.text}</div>
                    </div>
                </div>
            `;
        });
        listEl.scrollTop = listEl.scrollHeight;
    }

    document.getElementById('btn-send-comment').onclick = () => {
        if(!currentUser) return alert('請先登入！');
        const text = document.getElementById('comment-input').value.trim();
        if(!text) return;

        const proj = appData.projects.find(p => p.id === currentOpenProjectId);
        if(proj) {
            if(!proj.comments) proj.comments = [];
            proj.comments.push({
                userId: currentUser.id || currentUser.uid,
                userName: currentUser.username || currentUser.name || currentUser.displayName,
                userAvatar: currentUser.avatar || currentUser.photoURL,
                text: text,
                timestamp: Date.now()
            });
            document.getElementById('comment-input').value = '';
            syncAndSaveCloud();
        }
    };

    initBroadcast();
    initConnection();
    
</script>
