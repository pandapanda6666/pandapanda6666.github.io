<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D無人機模擬器 - 極致逼真版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; }
        #ui-container { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px; color: white; width: 300px; }
        button { padding: 10px 15px; font-size: 16px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 4px; margin-bottom: 10px; width: 100%; display: block; box-sizing: border-box; transition: background 0.2s; }
        button:hover { background-color: #45a049; }
        button.active { background-color: #f44336; }
        button.active:hover { background-color: #d32f2f; }
        .instructions { font-size: 14px; line-height: 1.5; margin-top: 10px; color: #ddd; }
        footer { position: absolute; bottom: 10px; width: 100%; text-align: center; color: white; z-index: 10; font-size: 14px; text-shadow: 1px 1px 2px black; }
        footer a { color: #4CAF50; text-decoration: none; }
        footer a:hover { text-decoration: underline; }
        #model-select-container { position: absolute; top: 20px; right: 20px; z-index: 10; background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 8px; color: white; display: flex; flex-direction: column; width: 250px; }
        select { padding: 8px; margin-top: 5px; border-radius: 4px; background: #333; color: white; border: 1px solid #555; font-size: 14px; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; display: none; z-index: 5; pointer-events: none; }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: rgba(255,0,0,0.8); transform: translate(-50%, -50%); border-radius: 50%; }
        #osd { position: absolute; bottom: 40px; left: 20px; color: #0f0; font-family: 'Courier New', Courier, monospace; font-size: 18px; text-shadow: 1px 1px 2px #000; z-index: 10; display: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

        <button id="modeSwitchBtn">目前模式：美國手</button>

            左右鍵：水平轉動 (Yaw)<br>
            W S 鍵：前後傾斜 (Pitch)<br>
            A D 鍵：左右傾斜 (Roll)<br><br>
            [滑鼠操作]<br>
            左鍵拖曳：旋轉視角<br>
            滾輪：放大縮小
        </div>
    </div>

    <script>
        let audioCtx, isAudioEnabled = false;
        let oscillators = [], gainNodes = [];
        const audioBtn = document.getElementById('audioBtn');
        
        audioBtn.addEventListener('click', () => {
            if (!isAudioEnabled) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                for(let i=0; i<4; i++) {
                    let osc = audioCtx.createOscillator();
                    osc.type = 'sawtooth'; 
                    let filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass'; filter.frequency.value = 3000;
                    let gain = audioCtx.createGain(); gain.gain.value = 0.0;
                    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); oscillators.push(osc); gainNodes.push(gain);
                }
                isAudioEnabled = true; audioBtn.textContent = '關閉引擎音效 🔇'; audioBtn.classList.add('active');
            } else {
                oscillators.forEach(osc => osc.stop()); oscillators = []; gainNodes = []; audioCtx.close();
                isAudioEnabled = false; audioBtn.textContent = '開啟引擎音效 🔊 (點擊啟用)'; audioBtn.classList.remove('active');
            }
        });

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3.5);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05; controls.maxPolarAngle = Math.PI / 2 - 0.05; 

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7); dirLight.castShadow = true;
        dirLight.shadow.camera.top = 5; dirLight.shadow.camera.bottom = -5; dirLight.shadow.camera.left = -5; dirLight.shadow.camera.right = 5;
        scene.add(dirLight);

        const groundCanvas = document.createElement('canvas'); groundCanvas.width = 512; groundCanvas.height = 512;
        const gCtx = groundCanvas.getContext('2d');
        gCtx.fillStyle = '#4CAF50'; gCtx.fillRect(0,0,512,512);
        gCtx.fillStyle = '#388E3C'; gCtx.fillRect(0,0,256,256); gCtx.fillRect(256,256,256,256);
        const groundTex = new THREE.CanvasTexture(groundCanvas);
        groundTex.wrapS = THREE.RepeatWrapping; groundTex.wrapT = THREE.RepeatWrapping; groundTex.repeat.set(200, 200);
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1.0 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2; ground.position.y = -1.5; ground.receiveShadow = true;
        scene.add(ground);

        const cfCanvas = document.createElement('canvas'); cfCanvas.width = 16; cfCanvas.height = 16;
        const cfCtx = cfCanvas.getContext('2d');
        cfCtx.fillStyle = '#1a1a1a'; cfCtx.fillRect(0,0,16,16);
        cfCtx.fillStyle = '#2a2a2a'; cfCtx.fillRect(0,0,8,8); cfCtx.fillRect(8,8,8,8);
        const carbonTex = new THREE.CanvasTexture(cfCanvas);
        carbonTex.wrapS = THREE.RepeatWrapping; carbonTex.wrapT = THREE.RepeatWrapping; carbonTex.repeat.set(4, 4);

        const droneGroup = new THREE.Group();
        scene.add(droneGroup);
        const propellers = []; 
        const fpvCameraPos = new THREE.Vector3();
        let currentCamTilt = 0;

        function buildDrone(modelStr) {
            while(droneGroup.children.length > 0){ droneGroup.remove(droneGroup.children[0]); }
            propellers.length = 0;
            
            let hash = 0;
            for (let i = 0; i < modelStr.length; i++) { hash = modelStr.charCodeAt(i) + ((hash << 5) - hash); }
            function random() { var x = Math.sin(hash++) * 10000; return x - Math.floor(x); }

            const name = modelStr.toLowerCase();
            let dClass = 'freestyle';
            if(name.includes('mobula') || name.includes('meteor') || name.includes('tiny') || name.includes('cetus') || name.includes('humming') || name.includes('beebrain')) dClass = 'whoop';
            else if(name.includes('five33') || name.includes('racer') || name.includes('spec') || name.includes('racing') || name.includes('glide') || name.includes('switchback')) dClass = 'racing';
            else if(name.includes('7') || name.includes('long') || name.includes('source one 7') || name.includes('crooked')) dClass = 'longrange';

            // Materials
            const carbonMat = new THREE.MeshStandardMaterial({ map: carbonTex, roughness: 0.7, metalness: 0.4 });
            const standoffMat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(random(), 0.9, 0.5), metalness: 0.8, roughness: 0.2 });
            const stackMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.9 });
            const motorStatorMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.4 });
            const motorBellMat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(random(), 0.8, 0.4), metalness: 0.9, roughness: 0.1 });
            const propColor = new THREE.Color().setHSL(random(), 0.9, 0.4);
            const propMat = new THREE.MeshStandardMaterial({ color: propColor, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
            const blurMat = new THREE.MeshBasicMaterial({ color: propColor, transparent: true, opacity: 0.0, side: THREE.DoubleSide });
            const camMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.8 });
            const lensMat = new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 1.0, roughness: 0.0 });
            const batteryMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 });
            const strapMat = new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.9 });
            const wireMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.8 });
            const plasticMat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(random(), 0.8, 0.5), roughness: 0.4 }); // For whoops & TPU
            const tpuMat = new THREE.MeshStandardMaterial({ color: 0x2288ff, roughness: 0.8 }); // 3D printed TPU color

            // Dimensions based on class
            let armAngle = (random() > 0.5) ? Math.PI / 4 : (Math.PI / 6 + random() * 0.2); // True X or Deadcat
            let armLength = 0.45;
            let propRadius = 0.25;
            let armWidth = 0.04;
            let hasDucts = false;
            let hasSharkFin = false;
            let hasActionCam = false;

            if (dClass === 'whoop') {
                armLength = 0.15 + random() * 0.05;
                propRadius = 0.12;
                armWidth = 0.015;
                hasDucts = true;
            } else if (dClass === 'racing') {
                armLength = 0.35 + random() * 0.05;
                propRadius = 0.25;
                armWidth = 0.02; // Very skinny arms
                hasSharkFin = true;
            } else if (dClass === 'longrange') {
                armLength = 0.6 + random() * 0.1;
                propRadius = 0.35; // 7 inch props
                armWidth = 0.05;
                armAngle = Math.PI / 3; // Deadcat front
                hasActionCam = true;
            } else {
                // Freestyle
                armLength = 0.4 + random() * 0.05;
                propRadius = 0.25;
                armWidth = 0.04;
                hasActionCam = true;
            }

            // --- Extrude Custom Bottom Plate Shape ---
            const plateShape = new THREE.Shape();
            const bodyW = (dClass === 'racing' || dClass === 'whoop') ? 0.08 : 0.12;
            const bodyL = (dClass === 'racing') ? 0.12 : 0.18;
            
            // Draw central body
            plateShape.moveTo(bodyW, bodyL);
            plateShape.lineTo(bodyW, -bodyL);
            plateShape.lineTo(-bodyW, -bodyL);
            plateShape.lineTo(-bodyW, bodyL);
            plateShape.lineTo(bodyW, bodyL);

            const extrudeSettings = { depth: 0.03, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.005, bevelThickness: 0.005 };
            const bottomPlateGeo = new THREE.ExtrudeGeometry(plateShape, extrudeSettings);
            bottomPlateGeo.rotateX(Math.PI / 2); // Lay flat
            const bottomPlate = new THREE.Mesh(bottomPlateGeo, dClass === 'whoop' ? plasticMat : carbonMat);
            bottomPlate.castShadow = true;
            droneGroup.add(bottomPlate);

            // Top Plate / Canopy
            if (dClass === 'whoop') {
                const canopyGeo = new THREE.SphereGeometry(0.08, 16, 16, 0, Math.PI*2, 0, Math.PI/2);
                const canopy = new THREE.Mesh(canopyGeo, plasticMat);
                canopy.position.y = 0.03;
                droneGroup.add(canopy);
            } else {
                const topPlateGeo = new THREE.ExtrudeGeometry(plateShape, extrudeSettings);
                topPlateGeo.rotateX(Math.PI / 2);
                const topPlate = new THREE.Mesh(topPlateGeo, carbonMat);
                topPlate.position.y = 0.15;
                topPlate.scale.set(0.8, 1, 0.8);
                topPlate.castShadow = true;
                droneGroup.add(topPlate);

                // Standoffs
                for (let i of [-1, 1]) {
                    for (let j of [-1, 1]) {
                        const standoffGeo = new THREE.CylinderGeometry(0.01, 0.01, 0.12, 8);
                        const standoff = new THREE.Mesh(standoffGeo, standoffMat);
                        standoff.position.set(i * bodyW * 0.7, 0.09, j * bodyL * 0.7);
                        droneGroup.add(standoff);
                    }
                }
            }

            // Stack (FC/ESC)
            if (dClass !== 'whoop') {
                const escGeo = new THREE.BoxGeometry(0.12, 0.03, 0.12);
                const esc = new THREE.Mesh(escGeo, stackMat);
                esc.position.set(0, 0.05, 0);
                droneGroup.add(esc);
                const fcGeo = new THREE.BoxGeometry(0.12, 0.03, 0.12);
                const fc = new THREE.Mesh(fcGeo, stackMat);
                fc.position.set(0, 0.09, 0);
                droneGroup.add(fc);
            }

            // Battery
            const hasBatteryTop = (dClass === 'freestyle' || dClass === 'longrange') ? (random() > 0.5) : (dClass === 'racing');
            if (dClass !== 'whoop') {
                const batGeo = new THREE.BoxGeometry(0.12, 0.1, 0.25);
                const bat = new THREE.Mesh(batGeo, batteryMat);
                bat.position.y = hasBatteryTop ? 0.22 : -0.08;
                droneGroup.add(bat);

                const strapGeo = new THREE.BoxGeometry(0.13, 0.11, 0.04);
                const strap = new THREE.Mesh(strapGeo, strapMat);
                strap.position.y = hasBatteryTop ? 0.22 : -0.08;
                droneGroup.add(strap);
            }

            // Accessories
            if (hasSharkFin) {
                const finShape = new THREE.Shape();
                finShape.moveTo(0, 0); finShape.lineTo(0.05, 0); finShape.lineTo(0.05, 0.1); finShape.lineTo(0, 0);
                const finGeo = new THREE.ExtrudeGeometry(finShape, {depth:0.01, bevelEnabled:false});
                const fin = new THREE.Mesh(finGeo, tpuMat);
                fin.position.set(0, 0.16, -0.05);
                droneGroup.add(fin);
            }
            if (hasActionCam) {
                const acGeo = new THREE.BoxGeometry(0.12, 0.1, 0.06);
                const ac = new THREE.Mesh(acGeo, tpuMat); // TPU Mount
                ac.rotation.x = Math.PI / 6; // 30 deg up
                ac.position.set(0, 0.22, -0.15);
                droneGroup.add(ac);
            }
            // Antenna (Lollipop)
            if (dClass !== 'whoop') {
                const antStem = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.15), wireMat);
                antStem.position.set(0, 0.1, 0.15);
                antStem.rotation.x = -Math.PI / 4;
                const antHead = new THREE.Mesh(new THREE.SphereGeometry(0.03), plasticMat);
                antHead.position.set(0, 0.06, 0.06);
                antStem.add(antHead);
                droneGroup.add(antStem);
            }

            // FPV Camera
            currentCamTilt = (dClass === 'racing') ? (Math.PI / 4) : (Math.PI / 12 + random() * (Math.PI / 6)); 
            const camGroup = new THREE.Group();
            const camBody = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.08), camMat);
            camGroup.add(camBody);
            const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.06, 16), lensMat);
            lens.rotation.x = Math.PI / 2; lens.position.z = -0.04;
            camGroup.add(lens);
            
            // Side plates for camera
            if (dClass !== 'whoop') {
                const sidePGeo = new THREE.BoxGeometry(0.01, 0.1, 0.1);
                const leftP = new THREE.Mesh(sidePGeo, carbonMat); leftP.position.set(-0.05, 0, 0);
                const rightP = new THREE.Mesh(sidePGeo, carbonMat); rightP.position.set(0.05, 0, 0);
                camGroup.add(leftP); camGroup.add(rightP);
            }

            camGroup.position.set(0, dClass==='whoop'?0.05:0.1, -0.2);
            camGroup.rotation.x = currentCamTilt; 
            droneGroup.add(camGroup);
            fpvCameraPos.set(0, (dClass==='whoop'?0.05:0.1) + Math.sin(currentCamTilt)*0.07, -0.2 - Math.cos(currentCamTilt)*0.07);

            // Arms & Motors
            function createArm(targetX, targetZ) {
                const armGroup = new THREE.Group();
                const dist = Math.sqrt(targetX*targetX + targetZ*targetZ);
                
                // Detailed arm
                const armShape = new THREE.Shape();
                armShape.moveTo(-armWidth/2, 0);
                armShape.lineTo(armWidth/2, 0);
                armShape.lineTo(armWidth/2, dist);
                armShape.lineTo(-armWidth/2, dist);
                armShape.lineTo(-armWidth/2, 0);
                const armGeo = new THREE.ExtrudeGeometry(armShape, extrudeSettings);
                armGeo.rotateX(Math.PI / 2);
                
                const arm = new THREE.Mesh(armGeo, dClass === 'whoop' ? plasticMat : carbonMat);
                arm.rotation.y = Math.atan2(targetX, targetZ);
                armGroup.add(arm);

                if (dClass !== 'whoop') {
                    const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, dist*0.9, 4), wireMat);
                    wire.rotation.x = Math.PI / 2;
                    wire.position.set(targetX*0.45, 0.02, targetZ*0.45);
                    wire.rotation.y = Math.atan2(targetX, targetZ) + Math.PI/2;
                    armGroup.add(wire);
                }

                const motorPos = new THREE.Vector3(targetX, 0.015, targetZ);
                
                const sGeo = new THREE.CylinderGeometry(propRadius*0.3, propRadius*0.3, 0.04, 16);
                const stator = new THREE.Mesh(sGeo, motorStatorMat);
                stator.position.copy(motorPos); stator.position.y += 0.02;
                armGroup.add(stator);

                const bGeo = new THREE.CylinderGeometry(propRadius*0.32, propRadius*0.32, 0.05, 16);
                const bell = new THREE.Mesh(bGeo, motorBellMat);
                bell.position.copy(motorPos); bell.position.y += 0.065;
                armGroup.add(bell);

                // Ducts for whoop/cinewhoop
                if (hasDucts) {
                    const ductGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
                        new THREE.Vector3(-propRadius-0.02, 0, 0), new THREE.Vector3(0, 0, -propRadius-0.02),
                        new THREE.Vector3(propRadius+0.02, 0, 0), new THREE.Vector3(0, 0, propRadius+0.02),
                        new THREE.Vector3(-propRadius-0.02, 0, 0)
                    ]), 32, 0.02, 8, true);
                    const duct = new THREE.Mesh(ductGeo, plasticMat);
                    duct.position.copy(motorPos);
                    duct.position.y += 0.08;
                    armGroup.add(duct);
                }

                const propGroup = new THREE.Group();
                const blades = [];
                const numBlades = (dClass === 'whoop') ? 4 : (random() > 0.5 ? 3 : 2);
                for (let i = 0; i < numBlades; i++) {
                    const bladeMesh = new THREE.Mesh(new THREE.BoxGeometry(propRadius, 0.004, propRadius*0.12), propMat);
                    bladeMesh.position.x = propRadius / 2; bladeMesh.rotation.x = Math.PI / 15; 
                    const pivot = new THREE.Group(); pivot.rotation.y = (Math.PI * 2 / numBlades) * i;
                    pivot.add(bladeMesh); propGroup.add(pivot); blades.push(bladeMesh);
                }
                const blurMesh = new THREE.Mesh(new THREE.CylinderGeometry(propRadius, propRadius, 0.001, 32), blurMat);
                propGroup.add(blurMesh);

                const nut = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.03, 8), standoffMat);
                nut.position.y = 0.015; propGroup.add(nut);

                propGroup.position.copy(motorPos); propGroup.position.y += 0.1;
                armGroup.add(propGroup);
                
                propGroup.userData = { blades: blades, blur: blurMesh };
                propellers.push(propGroup);
                droneGroup.add(armGroup);
            }

            const armX = Math.sin(armAngle) * armLength;
            const armZ = Math.cos(armAngle) * armLength;
            createArm(-armX, -armZ); createArm(armX, -armZ); createArm(-armX, armZ); createArm(armX, armZ);   
        }

        const modelSelect = document.getElementById('droneModelSelect');
        modelSelect.addEventListener('change', (e) => { buildDrone(e.target.value); if (isFPV) resetFPVCamera(); });
        buildDrone(modelSelect.value);

        let isFPV = false;
        const viewSwitchBtn = document.getElementById('viewSwitchBtn');
        const crosshair = document.getElementById('crosshair');
        const osd = document.getElementById('osd');

        function resetFPVCamera() {
            camera.position.copy(fpvCameraPos); camera.rotation.set(currentCamTilt, 0, 0, 'YXZ');
        }

        viewSwitchBtn.addEventListener('click', () => {
            isFPV = !isFPV;
            if (isFPV) {
                viewSwitchBtn.textContent = '目前視角：FPV 穿越視角 (無滑鼠)';
                controls.enabled = false; crosshair.style.display = 'block'; osd.style.display = 'block';
                droneGroup.add(camera); resetFPVCamera();
            } else {
                viewSwitchBtn.textContent = '目前視角：第三人稱 (滑鼠可控制)';
                controls.enabled = true; crosshair.style.display = 'none'; osd.style.display = 'none';
                droneGroup.remove(camera); scene.add(camera);
                camera.position.set(0, 1.5, 3.5); camera.lookAt(0, 0, 0);
            }
        });

        let controlMode = 'american';
        const keys = { w: false, a: false, s: false, d: false, up: false, down: false, left: false, right: false };

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = true; if (key === 'a') keys.a = true; if (key === 's') keys.s = true; if (key === 'd') keys.d = true;
            if (e.key === 'ArrowUp') keys.up = true; if (e.key === 'ArrowDown') keys.down = true; if (e.key === 'ArrowLeft') keys.left = true; if (e.key === 'ArrowRight') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = false; if (key === 'a') keys.a = false; if (key === 's') keys.s = false; if (key === 'd') keys.d = false;
            if (e.key === 'ArrowUp') keys.up = false; if (e.key === 'ArrowDown') keys.down = false; if (e.key === 'ArrowLeft') keys.left = false; if (e.key === 'ArrowRight') keys.right = false;
        });

        const modeSwitchBtn = document.getElementById('modeSwitchBtn');
        const instructionsText = document.getElementById('instructionsText');
        modeSwitchBtn.addEventListener('click', () => {
            if (controlMode === 'american') {
                controlMode = 'japanese'; modeSwitchBtn.textContent = '目前模式：日本手';
                instructionsText.innerHTML = `[日本手 操作說明]<br>W S 鍵：油門<br>A D 鍵：水平轉動<br>上下鍵：前後傾斜<br>左右鍵：左右傾斜<br><br>[滑鼠操作]<br>左鍵拖曳：旋轉視角<br>滾輪：放大縮小`;
            } else {
                controlMode = 'american'; modeSwitchBtn.textContent = '目前模式：美國手';
                instructionsText.innerHTML = `[美國手 操作說明]<br>上下鍵：油門<br>左右鍵：水平轉動<br>W S 鍵：前後傾斜<br>A D 鍵：左右傾斜<br><br>[滑鼠操作]<br>左鍵拖曳：旋轉視角<br>滾輪：放大縮小`;
            }
        });

        let targetPitch = 0, targetRoll = 0;
        const maxTilt = Math.PI / 4, maxYaw = 10 * (Math.PI / 180), lerpSpeed = 0.15;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const osdThr = document.getElementById('osd-thr');
        const osdRpm = document.getElementById('osd-rpm');

        function animate() {
            requestAnimationFrame(animate);
            if (!isFPV) controls.update();

            let inputThrottle = 0, inputYaw = 0, inputPitch = 0, inputRoll = 0;
            if (controlMode === 'american') {
                if (keys.up) inputThrottle += 1; if (keys.down) inputThrottle -= 1;
                if (keys.left) inputYaw += 1; if (keys.right) inputYaw -= 1;
                if (keys.w) inputPitch += 1; if (keys.s) inputPitch -= 1;
                if (keys.a) inputRoll += 1; if (keys.d) inputRoll -= 1;
            } else {
                if (keys.w) inputThrottle += 1; if (keys.s) inputThrottle -= 1;
                if (keys.a) inputYaw += 1; if (keys.d) inputYaw -= 1;
                if (keys.up) inputPitch += 1; if (keys.down) inputPitch -= 1;
                if (keys.left) inputRoll += 1; if (keys.right) inputRoll -= 1;
            }

            targetPitch = -inputPitch * maxTilt; targetRoll = inputRoll * maxTilt; const targetYaw = inputYaw * maxYaw; 
            const currentPitch = THREE.MathUtils.lerp(droneGroup.rotation.x, targetPitch, lerpSpeed);
            const currentRoll = THREE.MathUtils.lerp(droneGroup.rotation.z, targetRoll, lerpSpeed);
            const currentYaw = THREE.MathUtils.lerp(droneGroup.rotation.y, targetYaw, lerpSpeed);
            droneGroup.rotation.set(currentPitch, currentYaw, currentRoll, 'YXZ');

            const throttleVal = Math.max(0, inputThrottle); 
            const totalSpeed = 0.05 + ((throttleVal > 0 || Math.abs(inputPitch)>0 || Math.abs(inputRoll)>0 || Math.abs(inputYaw)>0) ? 0.8 : 0);

            if (isFPV) { osdThr.innerText = (throttleVal * 100).toFixed(0); osdRpm.innerText = (totalSpeed * 5000).toFixed(0); }

            const blurOpacity = THREE.MathUtils.clamp((totalSpeed - 0.2) * 1.5, 0, 0.4);
            const bladeOpacity = THREE.MathUtils.clamp(1.0 - (totalSpeed - 0.2) * 2, 0.1, 0.7);

            if (propellers.length === 4) {
                propellers.forEach((prop, index) => {
                    prop.rotation.y += (index % 2 === 0) ? totalSpeed : -totalSpeed;
                    if(prop.userData.blur) prop.userData.blur.material.opacity = blurOpacity;
                    if(prop.userData.blades) prop.userData.blades.forEach(blade => blade.material.opacity = bladeOpacity);
                });
            }

            if (isAudioEnabled && audioCtx && audioCtx.state === 'running') {
                const baseFreq = 100 + throttleVal * 400, vol = 0.05 + throttleVal * 0.1;
                const p = inputPitch * 50, r = inputRoll * 50, y = inputYaw * 50;
                if (oscillators.length === 4) {
                    oscillators[0].frequency.setTargetAtTime(baseFreq + p - r + y + Math.random()*5, audioCtx.currentTime, 0.1);
                    oscillators[1].frequency.setTargetAtTime(baseFreq + p + r - y + Math.random()*5, audioCtx.currentTime, 0.1);
                    oscillators[2].frequency.setTargetAtTime(baseFreq - p - r - y + Math.random()*5, audioCtx.currentTime, 0.1);
                    oscillators[3].frequency.setTargetAtTime(baseFreq - p + r + y + Math.random()*5, audioCtx.currentTime, 0.1);
                    gainNodes.forEach(gain => gain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.1));
                }
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
