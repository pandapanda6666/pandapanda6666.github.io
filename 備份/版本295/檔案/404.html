<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官方網址已遷移 | PandaPanda 的 AI 日常</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f8e8;
            color: #2c5e32;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            border: 1px solid #dde8d4;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(44, 94, 50, 0.1);
        }
        .icon {
            font-size: 48px;
            color: #2c5e32;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            font-weight: bold;
            margin: 0 0 12px 0;
            color: #1e4624;
        }
        p {
            font-size: 15px;
            color: #4b5563;
            line-height: 1.6;
            margin: 0 0 24px 0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #2c5e32;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #1e4624;
            transform: translateY(-2px);
        }
    </style>
    <script>
    (function() {
        const targetUrl = 'https://pandapandaai.vercel.app' + window.location.pathname + window.location.search + window.location.hash;
        setTimeout(function() {
            window.location.replace(targetUrl);
        }, 1500);
    })();
    </script>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fas fa-compass"></i></div>
        <h1>官方網址已正式遷移</h1>
        <p>PandaPanda 的 AI 日常已正式搬遷至全新網域：<br><strong style="color:#2c5e32;">pandapandaai.vercel.app</strong><br><br>系統正在自動為您跳轉至對應頁面，若未自動跳轉請點擊下方按鈕。</p>
        <a id="redirectBtn" href="#" class="btn"><i class="fas fa-arrow-right"></i> 立即前往新網址</a>
    </div>
    <script>
        document.getElementById('redirectBtn').href = 'https://pandapandaai.vercel.app' + window.location.pathname + window.location.search + window.location.hash;
    </script>
</body>
</html>
