            </div>
            <button onclick="document.getElementById('project-modal').classList.add('hidden')" class="text-gray-400 hover:text-gray-800 bg-white rounded-full w-8 h-8 flex items-center justify-center shadow-sm"><i class="fas fa-times"></i></button>
        </div>
        <div class="p-5 overflow-y-auto flex-1">
            <p id="modal-proj-desc" class="text-gray-700 whitespace-pre-wrap text-sm mb-6 leading-relaxed bg-gray-50 p-4 rounded-xl"></p>
            
            <div id="admin-actions" class="mb-6 p-4 bg-yellow-50 rounded-xl border border-yellow-200 hidden">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-yellow-800"><i class="fas fa-shield-alt mr-1"></i> 管理員審核</h3>
                    <button id="btn-approve" class="bg-green-500 text-white px-4 py-1.5 rounded-lg shadow-sm hover:bg-green-600 transition text-sm font-bold">批准專案</button>

            <div id="user-proj-actions" class="mb-6 flex gap-2 flex-wrap hidden">

                <button id="btn-proj-export" class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg shadow-sm hover:bg-gray-200 transition text-sm font-bold"><i class="fas fa-file-export mr-1"></i> 匯出專案檔</button>
                <button id="btn-proj-edit" class="bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg shadow-sm hover:bg-blue-200 transition text-sm font-bold hidden"><i class="fas fa-edit mr-1"></i> 編輯專案</button>
                <button id="btn-proj-delete" class="bg-red-100 text-red-700 px-3 py-1.5 rounded-lg shadow-sm hover:bg-red-200 transition text-sm font-bold hidden"><i class="fas fa-trash-alt mr-1"></i> 刪除專案</button>
            </div>

            <h3 class="text-sm font-black text-gray-400 uppercase tracking-wider mb-3">留言區</h3>
            <div id="comments-list" class="space-y-3 mb-2">

            <input type="text" id="comment-input" class="flex-1 border border-gray-300 rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition" placeholder="寫下你的想法...">
            <button id="btn-send-comment" class="bg-indigo-600 text-white px-5 py-2 rounded-xl hover:bg-indigo-700 transition shadow-md font-bold">
                送出
            </button>
        </div>

</div>

<div id="map-container">
    
    <!-- Object Properties (Floating) -->
    <div id="obj-location-panel" class="absolute top-[70px] left-1/2 -translate-x-1/2 bg-white rounded-xl shadow-2xl border border-gray-200 p-4 w-96 hidden z-[1000] flex flex-col gap-3">
        <div class="flex justify-between items-center border-b pb-2 mb-1">
            <h3 class="font-bold text-gray-800"><i class="fas fa-map-marker-alt text-blue-500 mr-1"></i> 物件地理定位</h3>
            <button id="btn-close-location" class="text-gray-400 hover:text-red-500"><i class="fas fa-times"></i></button>
        </div>
        
        <div>
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1 block">定位模式</label>
            <select id="location-mode" class="w-full text-sm border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500 font-medium p-2 border">
                <option value="center">中心點定位 (適用於標記/單點)</option>
                <option value="bounds">斜對角定位 (適用於矩形/圖片)</option>
            </select>
        </div>
        
        <div id="location-search-center" class="flex flex-col gap-1">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider block">搜尋地點 / 輸入座標</label>
            <div class="flex gap-2">
                <input type="text" id="input-loc-center" placeholder="例如: 台北101 或 25.033, 121.564" class="flex-1 text-sm border border-gray-300 rounded-lg p-2 shadow-sm focus:border-indigo-500 focus:outline-none">
                <button id="btn-search-center" class="bg-indigo-500 text-white px-3 rounded-lg hover:bg-indigo-600 shadow-sm"><i class="fas fa-search"></i></button>
            </div>
            <div id="res-loc-center" class="text-[11px] text-gray-600 truncate h-4 mt-1 font-medium" data-lat="" data-lng=""></div>
        </div>
        
        <div id="location-search-bounds" class="flex flex-col gap-3 hidden">
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider block">左上角 (Start)</label>
                <div class="flex gap-2">
                    <input type="text" id="input-loc-start" placeholder="搜尋左上角..." class="flex-1 text-sm border border-gray-300 rounded-lg p-2 shadow-sm focus:border-indigo-500 focus:outline-none">
                    <button id="btn-search-start" class="bg-indigo-500 text-white px-3 rounded-lg hover:bg-indigo-600 shadow-sm"><i class="fas fa-search"></i></button>
                </div>
                <div id="res-loc-start" class="text-[11px] text-gray-600 truncate h-4 mt-1 font-medium" data-lat="" data-lng=""></div>
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider block">右下角 (End)</label>
                <div class="flex gap-2">
                    <input type="text" id="input-loc-end" placeholder="搜尋右下角..." class="flex-1 text-sm border border-gray-300 rounded-lg p-2 shadow-sm focus:border-indigo-500 focus:outline-none">
                    <button id="btn-search-end" class="bg-indigo-500 text-white px-3 rounded-lg hover:bg-indigo-600 shadow-sm"><i class="fas fa-search"></i></button>
                </div>
                <div id="res-loc-end" class="text-[11px] text-gray-600 truncate h-4 mt-1 font-medium" data-lat="" data-lng=""></div>
            </div>
        </div>
        
        <button id="btn-apply-location" class="mt-2 w-full bg-green-500 text-white font-bold py-2 rounded-lg shadow hover:bg-green-600 transition-colors">套用座標</button>
    </div>

    <div id="map"></div>
    <canvas id="drawing-layer"></canvas>
</div>

<script>

    // ==========================================
    // 1. 初始化 Leaflet 地圖
    // ==========================================
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
    const esriSatelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles &copy; Esri' });
    const cartoLabelsLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { maxZoom: 19, attribution: '&copy; CARTO', pane: 'shadowPane' });
    const hybridLayer = L.layerGroup([esriSatelliteLayer, cartoLabelsLayer]);
    
    const baseMaps = {
        "普通地圖": osmLayer,
        "衛星影像": esriSatelliteLayer,
        "混合地圖 (衛星+文字)": hybridLayer
    };

    const map = L.map('map', { layers: [osmLayer], maxZoom: 19, zoomControl: false, rotate: true, bearing: 0, scrollWheelZoom: false }).setView([24.956, 121.298], 13);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.control.layers(baseMaps, null, { position: 'bottomright' }).addTo(map);

    let currentLayerId = "普通地圖";
    map.on('baselayerchange', function(e) {
        currentLayerId = e.name;
        renderProjects();
    });

    L.Control.geocoder({ defaultMarkGeocode: true, placeholder: '搜尋地點...', errorMessage: '找不到結果', position: 'topright' }).on('markgeocode', e => map.fitBounds(e.geocode.bbox)).addTo(map);
    L.easyButton({
        position: 'topright',
        states: [{
            stateName: 'get-location', icon: 'fa-location-arrow', title: '定位',
            onClick: function(btn, map) { map.locate({ enableHighAccuracy: true }); }
        }]
    }).addTo(map);

    // ==========================================
    // 2. 初始化 Fabric.js 畫布與屬性管理
    // ==========================================
    const canvasObj = new fabric.Canvas('drawing-layer', { isDrawingMode: false, selection: true, fireRightClick: true, stopContextMenu: true });
    
    // 解決畫布遮擋地圖按鈕的問題：將 canvas-container 移入 #map 內部，置於 Leaflet controls 之下
    setTimeout(() => {
        const mapDiv = document.getElementById('map');
        const canvasContainer = document.querySelector('.canvas-container');
        const leafletControl = document.querySelector('.leaflet-control-container');
        if (mapDiv && canvasContainer && leafletControl) {
            mapDiv.insertBefore(canvasContainer, leafletControl);
        }
    }, 100);

    // 建立畫布的地理座標錨點
    let baseZoom = 13;
    let baseTopLeft = null;

    function initCanvasAnchor() {
        baseZoom = map.getZoom();
        baseTopLeft = map.containerPointToLatLng([0, 0]);
        canvasObj.setViewportTransform([1, 0, 0, 1, 0, 0]);
    }

    map.whenReady(() => {
        initCanvasAnchor();
    });

    // 畫布跟隨地圖平移與縮放的核心邏輯
    function syncFabricToMap() {
        if (!baseTopLeft) return;
        const S = map.getZoomScale(map.getZoom(), baseZoom);
        const P = map.latLngToContainerPoint(baseTopLeft);
        canvasObj.setViewportTransform([S, 0, 0, S, P.x, P.y]);
    }

    map.on('move', syncFabricToMap);
    map.on('zoom', syncFabricToMap);
    let currentScaleMode = 'resize'; 
    let lineMode = false;
    let isTextMode = false;
    
    document.getElementById('map-rotation').addEventListener('input', (e) => {
        const angle = parseInt(e.target.value, 10);
        document.getElementById('rotation-val').innerText = angle + '°';
        if (map.setBearing) {
            map.setBearing(angle);
        }
    });
    let isDrawingLine = false;

    // Coordinate Conversion
    function latLngToFabric(lat, lng) {
        if(!baseTopLeft || !baseZoom) return {x:0, y:0};
        const S = map.getZoomScale(map.getZoom(), baseZoom);
        const LTopLeft = map.project(baseTopLeft, baseZoom);
        const pt = map.project([lat, lng], baseZoom);
        return { x: pt.x - LTopLeft.x, y: pt.y - LTopLeft.y };
    }

    // Geolocation UI Logic
    const locPanel = document.getElementById('obj-location-panel');
    const locMode = document.getElementById('location-mode');
    
    document.getElementById('btn-obj-location').onclick = () => {
        locPanel.classList.toggle('hidden');
    };
    document.getElementById('btn-close-location').onclick = () => {
        locPanel.classList.add('hidden');
    };
    
    locMode.onchange = () => {
        if(locMode.value === 'center') {
            document.getElementById('location-search-center').classList.remove('hidden');
            document.getElementById('location-search-bounds').classList.add('hidden');
        } else {
            document.getElementById('location-search-center').classList.add('hidden');
            document.getElementById('location-search-bounds').classList.remove('hidden');
        }
    };

    function performGeocode(inputId, resId) {
        const query = document.getElementById(inputId).value;
        const resEl = document.getElementById(resId);
        if(!query) return;
        
        // Parse direct coordinates if provided (e.g., "25.033, 121.564")
        const coordMatch = query.match(/([\d\.-]+)\s*,\s*([\d\.-]+)/);
        if (coordMatch) {
            const lat = parseFloat(coordMatch[1]);
            const lng = parseFloat(coordMatch[2]);
            resEl.innerText = `選定: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            resEl.setAttribute('data-lat', lat);
            resEl.setAttribute('data-lng', lng);
            resEl.classList.add('text-green-600');
            return;
        }

        resEl.innerText = '搜尋中...';
        resEl.classList.remove('text-green-600', 'text-red-500');
        
        const geocoder = L.Control.Geocoder.nominatim();
        geocoder.geocode(query, (results) => {
            if(results && results.length > 0) {
                const r = results[0];
                resEl.innerText = `找到: ${r.name} (${r.center.lat.toFixed(5)}, ${r.center.lng.toFixed(5)})`;
                resEl.setAttribute('data-lat', r.center.lat);
                resEl.setAttribute('data-lng', r.center.lng);
                resEl.classList.add('text-green-600');
                map.flyTo(r.center, 16);
            } else {
                resEl.innerText = '找不到結果';
                resEl.classList.add('text-red-500');
                resEl.setAttribute('data-lat', '');
                resEl.setAttribute('data-lng', '');
            }
        });
    }

    document.getElementById('btn-search-center').onclick = () => performGeocode('input-loc-center', 'res-loc-center');
    document.getElementById('btn-search-start').onclick = () => performGeocode('input-loc-start', 'res-loc-start');
    document.getElementById('btn-search-end').onclick = () => performGeocode('input-loc-end', 'res-loc-end');

    document.getElementById('btn-apply-location').onclick = () => {
        const activeObj = canvasObj.getActiveObject();
        if(!activeObj) {
            alert('請先選取一個畫布物件');
            return;
        }
        
        if (locMode.value === 'center') {
            const resEl = document.getElementById('res-loc-center');
            const lat = parseFloat(resEl.getAttribute('data-lat'));
            const lng = parseFloat(resEl.getAttribute('data-lng'));
            if(isNaN(lat) || isNaN(lng)) { alert('請先取得正確座標'); return; }
            
            const fabPos = latLngToFabric(lat, lng);
            activeObj.set({
                originX: 'center',
                originY: 'center',
                left: fabPos.x,
                top: fabPos.y
            });
            activeObj.setCoords();
            canvasObj.requestRenderAll();
            isDirty = true;
            locPanel.classList.add('hidden');
        } else {
            const rS = document.getElementById('res-loc-start');
            const rE = document.getElementById('res-loc-end');
            const sLat = parseFloat(rS.getAttribute('data-lat'));
            const sLng = parseFloat(rS.getAttribute('data-lng'));
            const eLat = parseFloat(rE.getAttribute('data-lat'));
            const eLng = parseFloat(rE.getAttribute('data-lng'));
            if(isNaN(sLat) || isNaN(sLng) || isNaN(eLat) || isNaN(eLng)) { alert('請先取得起始與結束的正確座標'); return; }
            
            if(!confirm('斜對角定位將會自由拉伸並變形物件以貼合區域，您確定要繼續嗎？ (如改變主意可取消)')) return;

            const p1 = latLngToFabric(sLat, sLng);
            const p2 = latLngToFabric(eLat, eLng);
            
            const minX = Math.min(p1.x, p2.x);
            const maxX = Math.max(p1.x, p2.x);
            const minY = Math.min(p1.y, p2.y);
            const maxY = Math.max(p1.y, p2.y);
            
            const newWidth = maxX - minX;
            const newHeight = maxY - minY;
            
            // Adjust scale to fit the new dimensions based on the original unscaled width/height
            const scaleX = newWidth / activeObj.width;
            const scaleY = newHeight / activeObj.height;
            
            activeObj.set({
                originX: 'left',
                originY: 'top',
                left: minX,
                top: minY,
                scaleX: scaleX,
                scaleY: scaleY,
                angle: 0 // Reset rotation to fit bbox perfectly
            });
            activeObj.setCoords();
            canvasObj.requestRenderAll();
            isDirty = true;
            locPanel.classList.add('hidden');
        }
    };

    let line;

    function resizeCanvas() {
        const mapContainer = document.getElementById('map-container');
        canvasObj.setWidth(mapContainer.clientWidth);
        canvasObj.setHeight(mapContainer.clientHeight);
        canvasObj.renderAll();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function setInteractiveMode(enabled) {
        if(enabled) {
            document.querySelector('.canvas-container').classList.add('interactive');
            if(map && map.dragging) map.dragging.disable();
        } else {
            document.querySelector('.canvas-container').classList.remove('interactive');
            if(map && map.dragging) map.dragging.enable();
        }
    }

    function setActiveBtn(id) {
        ['btn-draw','btn-line','btn-rect','btn-circle','btn-select'].forEach(b => {
            let el = document.getElementById(b);
            if(el) el.classList.remove('bg-gray-200','shadow-inner');
        });
        if(id && id !== 'upload') {
            let el = document.getElementById(id);
            if(el) el.classList.add('bg-gray-200','shadow-inner');
        }
        
        if (id === 'btn-draw' || id === 'btn-select') {
            toolHistory.push(id);
        }
        
        lineMode = (id === 'btn-line');
        isTextMode = (id === 'btn-text');
        if(!lineMode) isDrawingLine = false;
        
        canvasObj.selection = !lineMode;
        if(lineMode) {
            canvasObj.discardActiveObject();
            canvasObj.requestRenderAll();
        }
    }
    
    function revertToPrimaryTool() {
        let lastPrimary = toolHistory.length > 0 ? toolHistory[toolHistory.length - 1] : 'btn-select';
        let btn = document.getElementById(lastPrimary);
        if (btn) btn.click();
    }
    
    function saveCanvasState() {
        if (isStateAction) return;
        undoStack.push(JSON.stringify(canvasObj.toJSON()));
        redoStack = [];
    }


    // 取得當前屬性
    function getProps() {
        const isFillTransparent = document.getElementById('toggle-fill-transparent').checked;
        const hasBorder = document.getElementById('toggle-border').checked;
        const fillColor = document.getElementById('color-fill').value;
        const borderColor = document.getElementById('color-border').value;
        const opacity = parseInt(document.getElementById('obj-opacity').value, 10) / 100;
        
        return {
            fill: isFillTransparent ? 'transparent' : fillColor,
            stroke: hasBorder ? borderColor : 'transparent',
            strokeWidth: hasBorder ? parseInt(document.getElementById('selection-width').value, 10) || 4 : 0,
            strokeUniform: true,
            opacity: opacity
        };
    }    
    // Layer Controls
    
    // UI toggles based on selection




    // 繪圖工具
    canvasObj.freeDrawingBrush.width = 4;
    canvasObj.on('path:created', function(e) { 
        e.path.set({ strokeUniform: true, selectable: true, evented: true }); 
        saveCanvasState();
    });



    document.getElementById('btn-draw').onclick = () => {
        const props = getProps();
        canvasObj.freeDrawingBrush.color = props.stroke !== 'transparent' ? props.stroke : props.fill;
        canvasObj.isDrawingMode = true;
        setInteractiveMode(true);
        setActiveBtn('btn-draw');
    };

    document.getElementById('btn-line').onclick = () => {
        canvasObj.isDrawingMode = false;
        setInteractiveMode(true);
        setActiveBtn('btn-line');
    };

    document.getElementById('btn-select').onclick = () => {
        canvasObj.isDrawingMode = false;
        setInteractiveMode(true);
        setActiveBtn('btn-select');
    };

    document.getElementById('btn-rect').onclick = () => {
        canvasObj.isDrawingMode = false; setActiveBtn('btn-rect'); setInteractiveMode(true);
        const props = getProps();
        const rx = parseInt(document.getElementById('rect-radius').value, 10);
        const S = map.getZoomScale(map.getZoom(), baseZoom);
        const center = canvasObj.getVpCenter();
        const size = 100 / S;
        const radius = rx / S;
        const rect = new fabric.Rect({ left: center.x - size/2, top: center.y - size/2, width: size, height: size, rx: radius, ry: radius, ...props });
        canvasObj.add(rect); canvasObj.setActiveObject(rect);
        revertToPrimaryTool();
        saveCanvasState();
    };

    document.getElementById('btn-circle').onclick = () => {
        canvasObj.isDrawingMode = false; setActiveBtn('btn-circle'); setInteractiveMode(true);
        const props = getProps();
        const S = map.getZoomScale(map.getZoom(), baseZoom);
        const size = 50 / S;
        const center = canvasObj.getVpCenter();
        const circle = new fabric.Circle({ left: center.x - size, top: center.y - size, radius: size, ...props });
        canvasObj.add(circle); canvasObj.setActiveObject(circle);
        revertToPrimaryTool();
        saveCanvasState();
    };

    document.getElementById('upload-image').onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (f) => {
            fabric.Image.fromURL(f.target.result, (img) => {
                const S = map.getZoomScale(map.getZoom(), baseZoom);
                img.scaleToWidth(250 / S);
                const center = canvasObj.getVpCenter();
                img.set({ left: center.x - (125/S), top: center.y - img.getScaledHeight()/2 });
                canvasObj.add(img); canvasObj.setActiveObject(img);
                canvasObj.isDrawingMode = false; setInteractiveMode(true);
                revertToPrimaryTool();
                saveCanvasState();
            });
        };
        reader.readAsDataURL(file);
    };

    // 刪除按鈕與鍵盤 Delete 鍵
    function deleteActiveObject() {
        const activeObjects = canvasObj.getActiveObjects();
        if (activeObjects.length) {
            canvasObj.discardActiveObject();
            activeObjects.forEach(function(object) { canvasObj.remove(object); });
        }
    }
    document.getElementById('btn-delete').onclick = deleteActiveObject;
    function performUndo() {
        if (undoStack.length === 0) return;
        isStateAction = true;
        redoStack.push(JSON.stringify(canvasObj.toJSON()));
        let state = undoStack.pop();
        canvasObj.loadFromJSON(state, function() {
            canvasObj.renderAll();
            isStateAction = false;
        });
    }

    function performRedo() {
        if (redoStack.length === 0) return;
        isStateAction = true;
        undoStack.push(JSON.stringify(canvasObj.toJSON()));
        let state = redoStack.pop();
        canvasObj.loadFromJSON(state, function() {
            canvasObj.renderAll();
            isStateAction = false;
        });
    }

    function copyActiveObject() {
        if (!canvasObj.getActiveObject()) return;
        canvasObj.getActiveObject().clone(function(cloned) {
            clipboard = cloned;
        });
    }

    function pasteObject() {
        if (!clipboard) return;
        clipboard.clone(function(clonedObj) {
            canvasObj.discardActiveObject();
            clonedObj.set({
                left: clonedObj.left + 20,
                top: clonedObj.top + 20,
                evented: true,
            });
            if (clonedObj.type === 'activeSelection') {
                clonedObj.canvas = canvasObj;
                clonedObj.forEachObject(function(obj) { canvasObj.add(obj); });
                clonedObj.setCoords();
            } else {
                canvasObj.add(clonedObj);
            }
            clipboard.top += 20;
            clipboard.left += 20;
            canvasObj.setActiveObject(clonedObj);
            canvasObj.requestRenderAll();
            saveCanvasState();
        });
    }

    window.addEventListener('keydown', (e) => {
        const isInput = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';
        if(e.key === 'Delete' || e.key === 'Backspace') {
            if(!isInput) deleteActiveObject();
        }
        if(e.code === 'Space' && !isInput) {
            e.preventDefault();
            const selectBtn = document.getElementById('btn-select');
            if (selectBtn.classList.contains('bg-gray-200')) {
                document.getElementById('btn-draw').click();
            } else {
                selectBtn.click();
            }
        }
        
        // Ctrl Shortcuts
        if (e.ctrlKey && !isInput) {
            if (e.key.toLowerCase() === 'z') {
                if (e.shiftKey) performRedo();
                else performUndo();
                e.preventDefault();
            }
            if (e.key.toLowerCase() === 'y') {
                performRedo();
                e.preventDefault();
            }
            if (e.key.toLowerCase() === 'c') {
                copyActiveObject();
                e.preventDefault();
            }
            if (e.key.toLowerCase() === 'v') {

    canvasObj.on('object:scaling', function (e) {
        let obj = e.target;
        
        // Ctrl 鍵可以強制等比例
        if (e.e.ctrlKey) { 
            obj.set({ lockUniScaling: true }); 
        } else { 
            obj.set({ lockUniScaling: false }); 
        }

        // 如果是 Resize 模式且不是線段，透過調整寬高來改變大小，避免形狀拉伸失真 (特別是圓角)
        if (currentScaleMode === 'resize') {
            if (obj.type === 'rect') {
                obj.set({ 
                    width: obj.width * obj.scaleX, 
                    height: obj.height * obj.scaleY, 
                    scaleX: 1, 
                    scaleY: 1 
                });
            } else if (obj.type === 'circle') {
                obj.set({ 
                    radius: obj.radius * obj.scaleX, 
                    scaleX: 1, 
                    scaleY: 1 
                });
            }
        }
    });

    async function initConnection() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            let serverUrl = urlParams.get('server');

            if (!serverUrl) {
                const res = await fetch('https://pandapanda6666.github.io/login-hub/server_url.txt');
                if (!res.ok) throw new Error('無法取得伺服器網址');
                const text = await res.text();
                serverUrl = atob(text.trim().split('').reverse().join(''));
            }

            socket = io(serverUrl, { transports: ['websocket'] });

            socket.on('connect', () => {
                socket.emit('initClientInfo', { location: '未知地點', device: navigator.userAgent });
                checkLogin();
                
                socket.emit('joinGameRoom', { room: appId, characterData: {} });
                
                socket.emit('getAppData', { appId: 'non-existent-map' }, (res) => {
                    if (res && res.data && res.data.projects) {
                        appData = res.data;
                        renderProjects();
                    }
                });

                socket.emit('getSystemContext', (res) => {
                    if(res && res.isAdmin) isAdmin = true;
                });
            });

            socket.on('connect_error', () => { showOfflineAuth(); });
            
            socket.on('appData', (msg) => {
                if(msg.room === appId && msg.action === 'syncAppData') {
                    appData = msg.data;
                    renderProjects();
                    if(!document.getElementById('project-modal').classList.contains('hidden')) {
                        updateModalComments();
                    }
                }
            });
        } catch (err) {
            showOfflineAuth();
        }
    }

        if (token) {
            socket.emit('tokenLogin', { token: token });
            socket.once('loginResult', (data) => {
                const userObj = data.userData || data.user || (data.success ? data : null);
                
                if (data.success && userObj) {
                    localStorage.setItem('panda_session_token', data.token || token);
                    const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                    window.history.replaceState({path: newUrl}, '', newUrl);
                    
                    currentUser = userObj;
                    updateAuthUI(true);
                    
                } else {

                    updateAuthUI(false);
                }
            });

        }

    function initBroadcast() {
        const loadOffline = () => { window.broadcasts = JSON.parse(localStorage.getItem('broadcasts')||'[]'); };
        fetch('https://pandapanda6666.github.io/login-hub/server_broadcast.json')
            .then(res=>res.json())
            .then(list => { 
                window.broadcasts = list; 
                localStorage.setItem('broadcasts', JSON.stringify(list)); 
            }).catch(loadOffline);
            
        setInterval(() => {
            if(typeof socket !== 'undefined' && socket.connected) {
                socket.on('broadcastSchedule', (list) => {
                    localStorage.setItem('broadcasts', JSON.stringify(list));
                    window.broadcasts = list;
                });
            }
        }, 30000); 

        setInterval(() => {
            const now = Date.now(); 
            const bar = document.getElementById('notificationBar'); 
            const msgText = document.getElementById('notificationMsg');
            let activeMsg = null; 
            let rawList = window.broadcasts || JSON.parse(localStorage.getItem('broadcasts') || '[]');
            const list = Array.isArray(rawList) ? rawList : [];
            
            for (let b of list) {
                const st = new Date(b.startTime).getTime();
                if (b.mode === 1) {
                    const intervalMs = b.intervalMin * 60000; 
                    const end = st + ((b.repeatCount - 1) * intervalMs) + 60000;
                    if (now >= st && now <= end) { 
                        const elapsed = now - st; 
                        if (elapsed % intervalMs < 60000) activeMsg = b.message; 
                    }
                } else if (b.mode === 2) { 
                    const et = new Date(b.endTime).getTime(); 
                    if (now >= st && now <= et) activeMsg = b.message; 
                }
            }
            if (activeMsg) { 
                if(msgText.innerText !== activeMsg) msgText.innerText = activeMsg; 
                bar.style.display = 'block'; 
            } else { 
                bar.style.display = 'none'; 
            }
        }, 1000);
    }

                socket.emit('saveProject', projData);
        if(!isDraft) {
            socket.emit('logAppMessage', { appId: 'non-existent-map', message: `發布了地圖專案: ${projData.name}`, type: 'info' });
        }
        
        cancelEdit();
        renderProjects();
        if(typeof Swal !== 'undefined') {
            Swal.mixin({toast: true, position: 'top-end', showConfirmButton: false, timer: 3000}).fire({icon: 'success', title: isDraft ? '草稿已儲存' : '專案發布成功'});
        } else {
            alert(isDraft ? '草稿已儲存' : '專案發布成功！');
        }
    }

    
    document.getElementById('btn-clear-canvas').onclick = () => {
        if(confirm('確定要清除畫布上的所有物件嗎？此操作無法復原。')) {
            canvasObj.clear();
            if (document.getElementById('auto-save-toggle').checked) {
                saveProjectData(true, "草稿", "");
            }
        }
    };

    document.getElementById('btn-save-draft').onclick = () => {
        let name = "草稿";
        if(editingProjectId) {
            const p = appData.projects.find(x => x.id === editingProjectId);
            if(p) name = p.name;
        }
        saveProjectData(true, name, "");
    };

    document.getElementById('btn-save-project').onclick = () => {
        if(!currentUser) return alert('請先登入！');
        if(canvasObj.getObjects().length === 0) return alert('請先在畫布上畫點東西！');
        document.getElementById('proj-layer-name').innerText = currentLayerId;
        
        if(editingProjectId) {
            const p = appData.projects.find(x => x.id === editingProjectId);
            if(p) {
                document.getElementById('proj-name').value = p.name;
                document.getElementById('proj-desc').value = p.desc || '';
            }
        } else {
            document.getElementById('proj-name').value = '';
            document.getElementById('proj-desc').value = '';
        }
        
        document.getElementById('publish-modal').classList.remove('hidden');
    };

    document.getElementById('confirm-publish').onclick = () => {
        const name = document.getElementById('proj-name').value.trim();
        const desc = document.getElementById('proj-desc').value.trim();
        if(!name) return alert('請輸入名稱');
        
        document.getElementById('publish-modal').classList.add('hidden');
        saveProjectData(false, name, desc);
    };

    function openProjectModal(proj) {
        currentOpenProjectId = proj.id;
        document.getElementById('modal-proj-name').innerText = proj.name;
        document.getElementById('modal-proj-desc').innerText = proj.desc || '無介紹';
        document.getElementById('modal-proj-avatar').src = proj.creatorAvatar || 'https://via.placeholder.com/40';
        
        let authorHtml = proj.creatorName;
        document.getElementById('modal-proj-author').innerHTML = authorHtml;

        const statusEl = document.getElementById('modal-proj-status');
        if(proj.status === 'approved') {
            statusEl.innerText = '已批准';
            statusEl.className = 'px-2 py-0.5 rounded text-[10px] font-bold tracking-wider bg-indigo-100 text-indigo-700 border border-indigo-200';
        } else {
            statusEl.innerText = '待審核';
            statusEl.className = 'px-2 py-0.5 rounded text-[10px] font-bold tracking-wider bg-yellow-100 text-yellow-700 border border-yellow-200';
        }

        
        const currentUserId = currentUser ? (currentUser.id || currentUser.uid) : null;
        const userActions = document.getElementById('user-proj-actions');
        if(currentUserId && (proj.creatorId === currentUserId || isAdmin)) {
            userActions.classList.remove('hidden');
            document.getElementById('btn-proj-edit').classList.remove('hidden');
            document.getElementById('btn-proj-delete').classList.remove('hidden');
            
            document.getElementById('btn-proj-edit').onclick = () => {
                document.getElementById('project-modal').classList.add('hidden');
                editProject(proj.id);
            };
            document.getElementById('btn-proj-delete').onclick = () => {
                document.getElementById('project-modal').classList.add('hidden');
                deleteProject(proj.id);
            };
        } else {
            document.getElementById('btn-proj-edit').classList.add('hidden');
            document.getElementById('btn-proj-delete').classList.add('hidden');
        }

        const adminActions = document.getElementById('admin-actions');
        if(isAdmin && proj.status === 'pending') {
            adminActions.classList.remove('hidden');
            document.getElementById('btn-approve').onclick = () => {
                proj.status = 'approved';
                syncAndSaveCloud();
                socket.emit('logAppMessage', { appId: 'non-existent-map', message: `管理員批准了專案: ${proj.name}`, type: 'info' });
                openProjectModal(proj); 
            };
        } else {
            adminActions.classList.add('hidden');
        }

        updateModalComments();
        document.getElementById('project-modal').classList.remove('hidden');

        baseZoom = proj.baseZoom || proj.zoom;
        baseTopLeft = (proj.baseLat && proj.baseLng) ? L.latLng(proj.baseLat, proj.baseLng) : L.latLng(proj.lat, proj.lng);
        
        map.flyTo([proj.lat, proj.lng], proj.zoom);
        if(map.setBearing && proj.bearing !== undefined) {
            map.setBearing(proj.bearing);
            document.getElementById('map-rotation').value = proj.bearing;
            document.getElementById('rotation-val').innerText = proj.bearing + '°';
        }
        canvasObj.loadFromJSON(proj.fabricJSON, () => {
            canvasObj.getObjects().forEach(o => o.set({ selectable: false, evented: false }));
            canvasObj.renderAll();
        });
    }

    function updateModalComments() {
        if(!currentOpenProjectId) return;
        const proj = appData.projects.find(p => p.id === currentOpenProjectId);
        if(!proj) return;

        const listEl = document.getElementById('comments-list');
        listEl.innerHTML = '';
        
        if(!proj.comments || proj.comments.length === 0) {
            listEl.innerHTML = '<div class="text-gray-400 text-sm text-center py-6 bg-white rounded-xl border border-dashed border-gray-300">目前還沒有留言，來搶頭香吧！</div>';
            return;
        }

        proj.comments.forEach(c => {
            listEl.innerHTML += `
                <div class="flex gap-3 bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                    <img src="${c.userAvatar || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full object-cover shadow-sm bg-gray-50">
                    <div class="flex-1">
                        <div class="flex justify-between items-baseline mb-1">
                            <span class="text-xs font-bold text-gray-800">${c.userName}</span>
                            <span class="text-[10px] text-gray-400">${new Date(c.timestamp).toLocaleString()}</span>
                        </div>
                        <div class="text-sm text-gray-600 leading-relaxed">${c.text}</div>
                    </div>
                </div>
            `;
        });
        listEl.scrollTop = listEl.scrollHeight;
    }

    document.getElementById('btn-send-comment').onclick = () => {
        if(!currentUser) return alert('請先登入！');
        const text = document.getElementById('comment-input').value.trim();
        if(!text) return;

        const proj = appData.projects.find(p => p.id === currentOpenProjectId);
        if(proj) {
            if(!proj.comments) proj.comments = [];
            proj.comments.push({
                userId: currentUser.id || currentUser.uid,
                userName: currentUser.username || currentUser.name || currentUser.displayName,
                userAvatar: currentUser.avatar || currentUser.photoURL,
                text: text,
                timestamp: Date.now()
            });
            document.getElementById('comment-input').value = '';
            syncAndSaveCloud();
        }
    };

    initBroadcast();
    initConnection();
</script>


<script>
    // -------------------------------------------------------------------------
    // NEW UI LOGIC (Sidebar tabs, Context Toolbar, Layers Panel, Auto-Save)
    // -------------------------------------------------------------------------

    // 1. Sidebar Tabs
    function switchTab(tabId) {
        document.querySelectorAll('.tab-pane').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.nav-btn').forEach(el => {
            el.classList.remove('bg-gray-800', 'text-indigo-400');
            el.classList.add('text-gray-400');
        });
        
        const targetTab = document.getElementById(tabId);
        if (targetTab) targetTab.classList.remove('hidden');
        if (tabId === 'tab-home' || tabId === 'tab-tools') {
            targetTab.classList.add('flex');
        } else {
            targetTab.classList.remove('hidden');
        }
        
        const btn = document.querySelector(`.nav-btn[data-target="${tabId}"]`);
        if (btn) {
            btn.classList.add('bg-gray-800', 'text-indigo-400');
            btn.classList.remove('text-gray-400');
        }
        
        // Show/hide sidebar nav buttons based on state
        const isEditing = tabId !== 'tab-home';
        ['nav-tools', 'nav-layers', 'nav-settings'].forEach(id => {
            if (isEditing) {
                document.getElementById(id).classList.remove('hidden');
            } else {
                document.getElementById(id).classList.add('hidden');
            }
        });
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const target = e.currentTarget.getAttribute('data-target');
            if (target === 'tab-home' && editingProjectId) {
                // Clicking home while editing acts like "Return"
                document.getElementById('btn-cancel-edit').click();
            } else {
                switchTab(target);
            }
        });
    });

    // Initial state
    switchTab('tab-home');

    // 2. Top Context Toolbar & Object Properties
    function updateContextToolbar() {
        const activeObj = canvasObj.getActiveObject();
        const tb = document.getElementById('top-context-toolbar');
        
        if (!activeObj) {
            tb.classList.add('hidden');
            return;
        }
        
        tb.classList.remove('hidden');

        if (activeObj.isMapMarker) {
            document.getElementById('text-prop-divider').classList.add('hidden');
            document.getElementById('text-prop-group').classList.add('hidden');
            const pin = activeObj.getObjects().find(o => o.type === 'path');
            const txt = activeObj.getObjects().find(o => o.type === 'text');
            if (pin) document.getElementById('color-fill').value = pin.fill;
            if (txt) document.getElementById('color-border').value = txt.fill;
            document.getElementById('toggle-fill-transparent').checked = false;
            document.getElementById('toggle-border').checked = false;
            return;
        }

        
        // Text tool specific props
        if (activeObj.type === 'i-text' || activeObj.type === 'text') {
            document.getElementById('text-prop-divider').classList.remove('hidden');
            document.getElementById('text-prop-group').classList.remove('hidden');
            document.getElementById('font-family-select').value = activeObj.fontFamily || 'Inter';
        } else {
            document.getElementById('text-prop-divider').classList.add('hidden');
            document.getElementById('text-prop-group').classList.add('hidden');
        }

        // Fill
        const fillTransparent = !activeObj.fill || activeObj.fill === 'transparent';
        document.getElementById('toggle-fill-transparent').checked = fillTransparent;
        if (!fillTransparent) {
            document.getElementById('color-fill').value = activeObj.fill;
        }

        // Border / Stroke
        const strokeTransparent = !activeObj.stroke || activeObj.stroke === 'transparent' || activeObj.strokeWidth === 0;
        document.getElementById('toggle-border').checked = strokeTransparent;
        if (!strokeTransparent) {
            document.getElementById('color-border').value = activeObj.stroke;
            document.getElementById('selection-width').value = activeObj.strokeWidth || 2;
        }

        document.getElementById('obj-opacity').value = activeObj.opacity * 100;
        document.getElementById('rect-radius').value = activeObj.rx || 0;
    }

    canvasObj.on('selection:created', updateContextToolbar);
    canvasObj.on('selection:updated', updateContextToolbar);
    canvasObj.on('selection:cleared', () => document.getElementById('top-context-toolbar').classList.add('hidden'));
    canvasObj.on('object:modified', () => isDirty = true);
    canvasObj.on('object:added', () => isDirty = true);
    canvasObj.on('object:removed', () => isDirty = true);


    // Prevent both fill and stroke from being transparent
    function validateTransparency() {
        const fillTrans = document.getElementById('toggle-fill-transparent').checked;
        const borderTrans = document.getElementById('toggle-border').checked;
        if (fillTrans && borderTrans) {
            alert('不能同時隱藏外框與填色，否則物件會隱形！');
            return false;
        }
        return true;
    }

    document.getElementById('toggle-fill-transparent').onchange = (e) => {
        if (!validateTransparency()) { e.target.checked = false; return; }
        const activeObj = canvasObj.getActiveObject();
        if (activeObj) {
            activeObj.set({ fill: e.target.checked ? 'transparent' : document.getElementById('color-fill').value });
            canvasObj.requestRenderAll();
            triggerAutoSave();
        }
    };

    document.getElementById('toggle-border').onchange = (e) => {
        if (!validateTransparency()) { e.target.checked = false; return; }
        const activeObj = canvasObj.getActiveObject();
        if (activeObj) {
            activeObj.set({
                stroke: e.target.checked ? 'transparent' : document.getElementById('color-border').value,
                strokeWidth: e.target.checked ? 0 : parseInt(document.getElementById('selection-width').value)
            });
            canvasObj.requestRenderAll();
            triggerAutoSave();
        }
    };

    document.getElementById('color-fill').oninput = (e) => {
        document.getElementById('toggle-fill-transparent').checked = false;
        const activeObj = canvasObj.getActiveObject();
        if (activeObj) {
            if (activeObj.isMapMarker) {
                const pin = activeObj.getObjects().find(o => o.type === 'path');
                if (pin) pin.set({ fill: e.target.value });
            } else {
                activeObj.set({ fill: e.target.value });
            }
            canvasObj.requestRenderAll();
        }
    };
    document.getElementById('color-fill').onchange = triggerAutoSave;

    document.getElementById('color-border').oninput = (e) => {
        document.getElementById('toggle-border').checked = false;
        const activeObj = canvasObj.getActiveObject();
        if (activeObj) {
            if (activeObj.isMapMarker) {
                const txt = activeObj.getObjects().find(o => o.type === 'text');
                if (txt) txt.set({ fill: e.target.value });
            } else {
                activeObj.set({ stroke: e.target.value, strokeWidth: parseInt(document.getElementById('selection-width').value) || 2 });
            }
            canvasObj.requestRenderAll();
        }
    };
    document.getElementById('color-border').onchange = triggerAutoSave;

    document.getElementById('selection-width').oninput = (e) => {
        document.getElementById('toggle-border').checked = false;
        const activeObj = canvasObj.getActiveObject();
        if (activeObj) {
            activeObj.set({ strokeWidth: parseInt(e.target.value), stroke: document.getElementById('color-border').value });
            canvasObj.requestRenderAll();
        }
    };
    document.getElementById('selection-width').onchange = triggerAutoSave;

    document.getElementById('rect-radius').oninput = (e) => {
        const activeObj = canvasObj.getActiveObject();
        if (activeObj && activeObj.type === 'rect') {
            activeObj.set({ rx: parseInt(e.target.value), ry: parseInt(e.target.value) });
            canvasObj.requestRenderAll();
        }
    };
    document.getElementById('rect-radius').onchange = triggerAutoSave;

    document.getElementById('obj-opacity').oninput = (e) => {
        const activeObj = canvasObj.getActiveObject();
        if (activeObj) {
            activeObj.set({ opacity: parseInt(e.target.value) / 100 });
            canvasObj.requestRenderAll();
        }
    };
    document.getElementById('obj-opacity').onchange = triggerAutoSave;

    document.getElementById('font-family-select').onchange = (e) => {
        const activeObj = canvasObj.getActiveObject();
        if (activeObj && (activeObj.type === 'i-text' || activeObj.type === 'text')) {
            activeObj.set({ fontFamily: e.target.value });
            canvasObj.requestRenderAll();
            triggerAutoSave();
        }
    };

    document.getElementById('btn-delete').onclick = () => {
        const activeObj = canvasObj.getActiveObject();
        if (activeObj) {
            canvasObj.remove(activeObj);
            document.getElementById('top-context-toolbar').classList.add('hidden');
            triggerAutoSave();
            renderLayerPanel();
        }
    };

    // 3. Layer Panel logic
    function renderLayerPanel() {
        const container = document.getElementById('layers-list-container');
        const objects = canvasObj.getObjects();
        container.innerHTML = '';
        
        if (objects.length === 0) {
            container.innerHTML = '<div class="text-xs text-gray-400 text-center mt-4">畫布上目前沒有物件</div>';
            return;
        }
        
        // Render in reverse so top is top
        [...objects].reverse().forEach((obj, idx) => {
            const actualIndex = objects.length - 1 - idx;
            const el = document.createElement('div');
            el.className = 'flex items-center justify-between p-2 bg-white border border-gray-100 rounded-lg shadow-sm hover:shadow transition cursor-pointer mb-1';
            
            let icon = 'fas fa-vector-square text-blue-500';
            if (obj.type === 'image') icon = 'fas fa-image text-green-500';
            else if (obj.type === 'i-text') icon = 'fas fa-font text-yellow-500';
            else if (obj.type === 'circle') icon = 'far fa-circle text-red-500';
            else if (obj.type === 'line') icon = 'fas fa-minus text-purple-500';
            
            let label = obj.type === 'i-text' ? obj.text.substring(0,10) : obj.type;

            el.innerHTML = `
                <div class="flex items-center gap-2 flex-1">
                    <button class="text-gray-300 hover:text-gray-500 cursor-grab px-1"><i class="fas fa-grip-vertical"></i></button>
                    <i class="${icon} w-4 text-center"></i>
                    <span class="text-xs font-bold text-gray-700 truncate w-32">${label}</span>
                </div>
                <div class="flex items-center gap-2">
                    <button class="text-gray-400 hover:text-indigo-500 btn-layer-up" title="上移一層"><i class="fas fa-arrow-up"></i></button>
                    <button class="text-gray-400 hover:text-indigo-500 btn-layer-down" title="下移一層"><i class="fas fa-arrow-down"></i></button>
                </div>
            `;
            
            // Focus and flyTo
            el.onclick = (e) => {
                if(e.target.closest('button')) return;
                canvasObj.setActiveObject(obj);
                canvasObj.requestRenderAll();
                if(obj.left && obj.top) {
                    const latlng = unprojectPoint({x: obj.left, y: obj.top});
                    map.flyTo(latlng, map.getZoom());
                }
            };
            
            el.querySelector('.btn-layer-up').onclick = (e) => {
                e.stopPropagation();
                obj.bringForward();
                canvasObj.requestRenderAll();
                renderLayerPanel();
                triggerAutoSave();
            };
            
            el.querySelector('.btn-layer-down').onclick = (e) => {
                e.stopPropagation();
                obj.sendBackwards();
                canvasObj.requestRenderAll();
                renderLayerPanel();
                triggerAutoSave();
            };
            
            container.appendChild(el);
        });
    }

    canvasObj.on('object:added', () => { renderLayerPanel(); triggerAutoSave(); });
    canvasObj.on('object:removed', () => { renderLayerPanel(); triggerAutoSave(); });
    
    // 4. Auto-Save Logic
    function triggerAutoSave() {
        if(document.getElementById('auto-save-toggle').checked) {
            // Save draft implicitly without alert
            saveProjectData(true, "草稿", "", true);
        }
    }
    
    canvasObj.on('object:modified', triggerAutoSave);

    // 5. Bounding Box & Text Tool
    fabric.Object.prototype.set({
        borderColor: '#3b82f6',
        cornerColor: '#3b82f6',
        cornerStrokeColor: '#1e3a8a',
        transparentCorners: false,
        cornerSize: 8
    });
    
    document.getElementById('editor-selection-color').oninput = (e) => {
        fabric.Object.prototype.set({
            borderColor: e.target.value,
            cornerColor: e.target.value
        });
        canvasObj.requestRenderAll();
    };

    
    document.getElementById('btn-marker').onclick = () => {
        setActiveBtn('btn-marker');
    };
    document.getElementById('btn-text').onclick = () => {
        setActiveBtn('btn-text');
    };
    
    canvasObj.on('mouse:down', function(options) {
        if (!options.target && activeTool === 'btn-text') {
            const pointer = canvasObj.getPointer(options.e);
            const textObj = new fabric.IText('雙擊編輯文字', {
                left: pointer.x,
                top: pointer.y,
                fontFamily: 'Inter',
                fill: document.getElementById('color-fill').value,
                stroke: document.getElementById('toggle-border').checked ? 'transparent' : document.getElementById('color-border').value,
                strokeWidth: document.getElementById('toggle-border').checked ? 0 : parseInt(document.getElementById('selection-width').value) || 2
            });
            canvasObj.add(textObj);
            canvasObj.setActiveObject(textObj);
            setActiveBtn('btn-select');

        } else if (!options.target && activeTool === 'btn-marker') {
            const pointer = canvasObj.getPointer(options.e);
            let textVal = prompt('請輸入標記文字 (留空則無文字):', '標記');
            if (textVal === null) return;
            
            const pathStr = 'M215.7 499.2C267 435 384 279.4 384 192C384 86 298 0 192 0S0 86 0 192c0 87.4 117 243 168.3 307.2c12.3 15.3 35.1 15.3 47.4 0zM192 128a64 64 0 1 1 0 128 64 64 0 1 1 0-128z';
            const pin = new fabric.Path(pathStr, {
                fill: document.getElementById('color-fill').value || '#EF4444',
                originX: 'center',
                originY: 'bottom',
                top: 0,
                left: 0
            });
            
            const objs = [pin];
            if (textVal.trim() !== '') {
                const textObj = new fabric.Text(textVal, {
                    fontFamily: 'Inter',
                    fontSize: 120,
                    fontWeight: 'bold',
                    fill: document.getElementById('toggle-border').checked ? '#000000' : (document.getElementById('color-border').value || '#000000'),
                    originX: 'center',
                    originY: 'top',
                    top: 20,
                    left: 0,
                    shadow: new fabric.Shadow({ color: 'rgba(255,255,255,0.8)', blur: 5, offsetX: 0, offsetY: 0 })
                });
                objs.push(textObj);
            }
            
            const group = new fabric.Group(objs, {
                left: pointer.x,
                top: pointer.y,
                originX: 'center',
                originY: 'bottom',
                scaleX: 0.12,
                scaleY: 0.12,
                isMapMarker: true
            });
            canvasObj.add(group);
            canvasObj.setActiveObject(group);
            setActiveBtn('btn-select');
        }
    });

    // Fix activeTool variable
    function setActiveBtn(id) {
        document.querySelectorAll('.tool-btn').forEach(b => {
            b.classList.remove('bg-indigo-50', 'text-indigo-700', 'border-indigo-100');
            b.classList.add('bg-gray-50', 'text-gray-600', 'border-transparent');
        });
        const target = document.getElementById(id);
        if(target) {
            target.classList.add('bg-indigo-50', 'text-indigo-700', 'border-indigo-100');
            target.classList.remove('bg-gray-50', 'text-gray-600', 'border-transparent');
        }
        activeTool = id;
    }

    // Initialize UI
    document.getElementById('toggle-border').checked = true; // default no border (hidden)

    // Modification to saveProjectData to support silent save (for auto-save)
    const originalSaveProjectData = saveProjectData;
    saveProjectData = function(isDraft, name, desc, silent = false) {
        if(!currentUser) return; // Silent return for auto-save if not logged in
        if(canvasObj.getObjects().length === 0) return;
        
        const center = map.getCenter();
        const isUserAdmin = isAdmin || (currentUser.role === 'admin');
        const status = isDraft ? 'draft' : (isUserAdmin ? 'approved' : 'pending');

        const projData = {
            id: editingProjectId || ('proj_' + Date.now()),
            name: name || '未命名專案',
            desc: desc || '',
            layerId: currentLayerId,
            creatorId: currentUser.id || currentUser.uid,
            creatorName: currentUser.username || currentUser.name || currentUser.displayName,
            creatorAvatar: currentUser.avatar || currentUser.photoURL,
            isAdmin: isUserAdmin,
            status: status,
            lat: center.lat,
            lng: center.lng,
            zoom: map.getZoom(),
            bearing: map.getBearing ? map.getBearing() : 0,
            baseLat: baseTopLeft ? baseTopLeft.lat : center.lat,
            baseLng: baseTopLeft ? baseTopLeft.lng : center.lng,
            baseZoom: baseZoom,
            fabricJSON: canvasObj.toJSON(),
            comments: []
        };

        if(editingProjectId) {
            const idx = appData.projects.findIndex(x => x.id === editingProjectId);
            if(idx !== -1) {
                projData.comments = appData.projects[idx].comments || [];
                appData.projects[idx] = projData;
            } else {
                appData.projects.push(projData);
            }
        } else {
            editingProjectId = projData.id; // Assign ID if it was new
            appData.projects.push(projData);
        }

        socket.emit('saveProject', projData);
        isDirty = false;
        if(!isDraft && !silent) {
            socket.emit('logAppMessage', { appId: 'non-existent-map', message: `發布了地圖專案: ${projData.name}`, type: 'info' });
        }
        
        if (!silent) {
            if (!isDraft) { cancelEdit(); }
            renderProjects();
            if(typeof Swal !== 'undefined') {
                Swal.mixin({toast: true, position: 'top-end', showConfirmButton: false, timer: 3000}).fire({icon: 'success', title: isDraft ? '草稿已儲存' : '專案發布成功'});
            } else {
                alert(isDraft ? '草稿已儲存' : '專案發布成功！');
            }
        }
    };

    // Zoom Modes (Stretch vs Crop)
    let imageScaleMode = 'stretch';
    document.getElementById('btn-scale-stretch').onclick = () => {
        imageScaleMode = 'stretch';
        document.getElementById('btn-scale-stretch').classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
        document.getElementById('btn-scale-stretch').classList.remove('text-gray-500', 'hover:text-gray-700');
        document.getElementById('btn-scale-crop').classList.add('text-gray-500', 'hover:text-gray-700');
        document.getElementById('btn-scale-crop').classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
    };
    document.getElementById('btn-scale-crop').onclick = () => {
        imageScaleMode = 'crop';
        document.getElementById('btn-scale-crop').classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
        document.getElementById('btn-scale-crop').classList.remove('text-gray-500', 'hover:text-gray-700');
        document.getElementById('btn-scale-stretch').classList.add('text-gray-500', 'hover:text-gray-700');
        document.getElementById('btn-scale-stretch').classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
    };

    canvasObj.on('object:scaling', function(e) {
        const obj = e.target;
        if (obj.type === 'image' && imageScaleMode === 'crop') {
            // Implement simple crop by resizing bounding box and using clipPath (Fabric.js 2+)
            // For now, setting width/height and resetting scaleX/Y creates a cropping effect if handled correctly
            const w = obj.width * obj.scaleX;
            const h = obj.height * obj.scaleY;
            obj.set({
                width: w,
                height: h,
                scaleX: 1,
                scaleY: 1
            });
            // Note: true cropping requires clipPath or regenerating the image. 
            // Setting w/h without scale actually stretches the image in basic Fabric.js image unless it's a cropped image class.
            // We'll keep it simple for now, but to really crop we might need clipPath.
        }
    });
</script>
