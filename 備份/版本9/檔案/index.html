<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabboni Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e1b4b;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 2.5rem 0;
            text-align: center;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            margin: 0;
            font-weight: 800;
            font-size: 3rem;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-text 3s linear infinite;
            letter-spacing: -1px;
        }

        @keyframes gradient-text {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .status-badge {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.875rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .status-badge.connected {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.4);
            color: var(--success);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .status-badge.disconnected {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            color: var(--danger);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
        }

        main {
            width: 90%;
            max-width: 1400px;
            margin-top: 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 2.5rem;
            padding-bottom: 4rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.08), transparent);
            transform: skewX(-25deg);
            transition: all 0.8s ease;
            pointer-events: none;
        }

        .card:hover::before {
            left: 150%;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
        }

        .device-name {
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .trigger-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .trigger-indicator {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid rgba(255,255,255,0.05);
        }
        
        .trigger-indicator.active {
            background: var(--success);
            border-color: #047857;
            box-shadow: 0 0 15px var(--success), 0 0 5px white;
            transform: scale(1.1);
        }

        .data-group {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .data-title {
            font-size: 0.85rem;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .data-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-color);
        }

        .data-title.orange::before {
            background: var(--warning);
        }
        
        .data-title.green::before {
            background: var(--success);
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .data-item {
            text-align: center;
            position: relative;
        }

        .data-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: -0.25rem;
            top: 10%;
            height: 80%;
            width: 1px;
            background: var(--glass-border);
        }

        .data-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        .data-value {
            font-size: 1.4rem;
            font-weight: 800;
            font-family: 'Inter', monospace;
            color: #fff;
            transition: color 0.2s;
        }

        .data-value.updated {
            color: var(--accent-color);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
            text-transform: uppercase;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(59, 130, 246, 0.5);
            background: linear-gradient(135deg, #2563eb, #4f46e5);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .battery-info {
            font-size: 0.9rem;
            color: #cbd5e1;
            text-align: center;
            min-height: 1.5rem;
            font-weight: 600;
            padding: 0.75rem;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }
        
        .empty-state {
            text-align: center;
            padding: 6rem 2rem;
            color: var(--text-secondary);
            grid-column: 1 / -1;
            background: rgba(255,255,255,0.02);
            border-radius: 30px;
            border: 2px dashed rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            opacity: 0.5;
            animation: pulse 2s infinite;
        }

        .empty-state p {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.5px;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        .canvas-container {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1rem;
        }

        .canvas-box {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-title {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
            font-weight: 800;
        }

        .three-canvas {
            width: 100%;
            height: 150px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-gradient-end); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <header>
        <h1>Rabboni Monitor</h1>
        <div id="statusBadge" class="status-badge disconnected">連線中斷</div>
    </header>

    <main id="deviceContainer">
        <div class="empty-state" id="emptyState">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path>
            </svg>
            <p>等待裝置傳送資料...</p>
            <span style="font-size: 0.85rem; color: #64748b; font-weight: normal;">請確保您的本地中介軟體已啟動 (ws://localhost:50500)</span>
        </div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
        const WS_URL = 'ws://localhost:50500/rab';
        const BATTERY_API = 'http://localhost:50500/rab/battery?name=';
        
        let socket;
        let devices = {};
        let updateTimeouts = {};
        let scenes = {};
        let angleData = {};

        function init3D(name) {
            scenes[name] = {
                angle: createScene(`canvas-angle-${name}`, 0x3b82f6),
                acc: createScene(`canvas-acc-${name}`, 0x10b981)
            };
        }

        function createScene(containerId, ledColorHex) {
            const container = document.getElementById(containerId);
            if (!container) return null;
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
            
            camera.position.set(0, 3, 3);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const group = new THREE.Group();
            scene.add(group);

            // Shape for Rabboni
            const width = 0.55; 
            const radius = 0.15;
            const shape = new THREE.Shape();
            shape.moveTo(-width + radius, -width);
            shape.lineTo(width - radius, -width);
            shape.quadraticCurveTo(width, -width, width, -width + radius);
            shape.lineTo(width, width - radius);
            shape.quadraticCurveTo(width, width, width - radius, width);
            shape.lineTo(-width + radius, width);
            shape.quadraticCurveTo(-width, width, -width, width - radius);
            shape.lineTo(-width, -width + radius);
            shape.quadraticCurveTo(-width, -width, -width + radius, -width);

            const extrudeSettings = {
                depth: 0.1, 
                bevelEnabled: true,
                bevelSegments: 4,
                steps: 1,
                bevelSize: 0.15,
                bevelThickness: 0.1
            };
            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geometry.center();

            // Vertex Colors for Two-Tone (Champagne Gold top, White bottom)
            const count = geometry.attributes.position.count;
            const colors = new Float32Array(count * 3);
            const pos = geometry.attributes.position.array;
            const colorGold = new THREE.Color(0xc9b095); // Champagne gold
            const colorWhite = new THREE.Color(0xf5f5f5); // White plastic

            for (let i = 0; i < count; i++) {
                const z = pos[i * 3 + 2];
                if (z > 0.0) {
                    colors[i * 3] = colorGold.r;
                    colors[i * 3 + 1] = colorGold.g;
                    colors[i * 3 + 2] = colorGold.b;
                } else {
                    colors[i * 3] = colorWhite.r;
                    colors[i * 3 + 1] = colorWhite.g;
                    colors[i * 3 + 2] = colorWhite.b;
                }
            }
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.MeshStandardMaterial({ 
                vertexColors: true,
                roughness: 0.5,
                metalness: 0.3
            });
            const cube = new THREE.Mesh(geometry, material);
            
            // Features
            
            // USB Port (Bottom-Left edge)
            const usbGeo = new THREE.BoxGeometry(0.2, 0.05, 0.08);
            const usbMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const usb = new THREE.Mesh(usbGeo, usbMat);
            usb.position.set(0, -0.71, -0.05);
            cube.add(usb);

            // ON/OFF Switch (Top-Left edge)
            const switchGeo = new THREE.BoxGeometry(0.05, 0.2, 0.08);
            const switchMesh = new THREE.Mesh(switchGeo, usbMat);
            switchMesh.position.set(-0.71, 0.1, -0.05);
            cube.add(switchMesh);

            // Left Button (Left corner)
            const btnGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const btnMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
            const buttonL = new THREE.Mesh(btnGeo, btnMat);
            buttonL.position.set(-0.73, -0.73, -0.05);
            buttonL.rotation.z = Math.PI / 4;
            cube.add(buttonL);

            // Right Button (Right corner)
            const buttonR = new THREE.Mesh(btnGeo, btnMat);
            buttonR.position.set(0.73, 0.73, -0.05);
            buttonR.rotation.z = Math.PI / 4;
            cube.add(buttonR);
            
            // LED (Top corner)
            const ledGeo = new THREE.SphereGeometry(0.03, 16, 16);
            const ledMat = new THREE.MeshBasicMaterial({ color: ledColorHex });
            const led = new THREE.Mesh(ledGeo, ledMat);
            led.position.set(-0.55, 0.55, 0.15); 
            cube.add(led);

            // Top Logo
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.font = 'italic bold 90px "Arial", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Rabboni', 256, 64);
            const logoTex = new THREE.CanvasTexture(canvas);
            const logoGeo = new THREE.PlaneGeometry(0.8, 0.2);
            const logoMat = new THREE.MeshBasicMaterial({ map: logoTex, transparent: true, depthWrite: false });
            const logoMesh = new THREE.Mesh(logoGeo, logoMat);
            logoMesh.position.set(0, 0, 0.151);
            logoMesh.rotation.z = Math.PI / 4;
            cube.add(logoMesh);

            // Bottom Clip
            const clipGroup = new THREE.Group();
            
            const clipMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.6 });
            const clipBox = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.0, 0.05), clipMat);
            clipGroup.add(clipBox);
            
            const clipTop = new THREE.Mesh(new THREE.CylinderGeometry(0.125, 0.125, 0.05, 16), clipMat);
            clipTop.position.set(0, 0.5, 0);
            clipTop.rotation.x = Math.PI / 2;
            clipGroup.add(clipTop);
            
            const clipBottom = new THREE.Mesh(new THREE.CylinderGeometry(0.125, 0.125, 0.05, 16), clipMat);
            clipBottom.position.set(0, -0.5, 0);
            clipBottom.rotation.x = Math.PI / 2;
            clipGroup.add(clipBottom);

            // Screw on Bottom Clip
            const screwGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.051, 16);
            const screwMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8 });
            const screw = new THREE.Mesh(screwGeo, screwMat);
            screw.position.set(0, -0.45, 0); 
            screw.rotation.x = Math.PI / 2;
            clipGroup.add(screw);

            // Hole on Bottom Clip
            const holeGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.052, 16);
            const holeMat = new THREE.MeshBasicMaterial({ color: 0x333333 }); 
            const hole = new THREE.Mesh(holeGeo, holeMat);
            hole.position.set(0, 0.45, 0);
            hole.rotation.x = Math.PI / 2;
            clipGroup.add(hole);

            clipGroup.position.set(0, 0, -0.175); 
            clipGroup.rotation.z = Math.PI / 4; 
            cube.add(clipGroup);
            
            // Orientation
            cube.rotation.x = -Math.PI / 2; // Lay flat
            cube.rotation.z = -Math.PI / 4; // Rotate to diamond shape
            
            group.add(cube);

            const light = new THREE.DirectionalLight(0xffffff, 0.8);
            light.position.set(2, 5, 5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();

            // Handle resize
            window.addEventListener('resize', () => {
                if(container.clientWidth > 0) {
                    camera.aspect = container.clientWidth / container.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(container.clientWidth, container.clientHeight);
                }
            });

            return group;
        }

        const statusBadge = document.getElementById('statusBadge');
        const deviceContainer = document.getElementById('deviceContainer');
        const emptyState = document.getElementById('emptyState');

        function connectWebSocket() {
            statusBadge.textContent = '連線中...';
            statusBadge.className = 'status-badge';
            
            socket = new WebSocket(WS_URL);

            socket.addEventListener('open', () => {
                statusBadge.textContent = '已連線 (Connected)';
                statusBadge.className = 'status-badge connected';
            });

            socket.addEventListener('close', () => {
                statusBadge.textContent = '連線中斷，嘗試重新連線...';
                statusBadge.className = 'status-badge disconnected';
                setTimeout(connectWebSocket, 3000);
            });

            socket.addEventListener('error', (err) => {
                console.error('WebSocket Error:', err);
            });

            socket.addEventListener('message', (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data && data.name) {
                        updateDevice(data);
                    }
                } catch (e) {
                    // ignore parse error
                }
            });
        }

        function updateValueWithAnimation(id, newValue) {
            const el = document.getElementById(id);
            if (!el) return;
            const current = el.textContent;
            if (current !== newValue) {
                el.textContent = newValue;
                el.classList.add('updated');
                
                clearTimeout(updateTimeouts[id]);
                updateTimeouts[id] = setTimeout(() => {
                    el.classList.remove('updated');
                }, 100);
            }
        }

        function updateDevice(data) {
            if (!devices[data.name]) {
                createDeviceCard(data.name);
                devices[data.name] = true;
                if (emptyState.style.display !== 'none') {
                    emptyState.style.display = 'none';
                }
            }

            const card = document.getElementById(`device-${data.name}`);
            if (!card) return;

            // Update Accelerometer
            if (data.acc) {
                updateValueWithAnimation(`acc-x-${data.name}`, formatNumber(data.acc[0]));
                updateValueWithAnimation(`acc-y-${data.name}`, formatNumber(data.acc[1]));
                updateValueWithAnimation(`acc-z-${data.name}`, formatNumber(data.acc[2]));
            }

            // Update Gyroscope
            if (data.gyr) {
                updateValueWithAnimation(`gyr-x-${data.name}`, formatNumber(data.gyr[0]));
                updateValueWithAnimation(`gyr-y-${data.name}`, formatNumber(data.gyr[1]));
                updateValueWithAnimation(`gyr-z-${data.name}`, formatNumber(data.gyr[2]));
            }

            if (!angleData[data.name]) {
                angleData[data.name] = { filteredPitch: 0, filteredRoll: 0 };
            }

            if (scenes[data.name]) {
                if (data.acc && scenes[data.name].acc) {
                    scenes[data.name].acc.position.set(data.acc[0] * 1.5, data.acc[2] * 1.5, -data.acc[1] * 1.5);
                }
                if (data.acc && scenes[data.name].angle) {
                    const ax = data.acc[0];
                    const ay = data.acc[1];
                    const az = data.acc[2];

                    let p = Math.atan2(ay, Math.sqrt(ax*ax + az*az));
                    let r = Math.atan2(ax, az);

                    const alpha = 0.1;
                    angleData[data.name].filteredPitch = angleData[data.name].filteredPitch * (1 - alpha) + p * alpha;
                    angleData[data.name].filteredRoll = angleData[data.name].filteredRoll * (1 - alpha) + r * alpha;

                    scenes[data.name].angle.rotation.set(angleData[data.name].filteredPitch, 0, angleData[data.name].filteredRoll, 'XYZ');
                }
            }

            // Update Trigger and Counts
            if (data.count && data.count.length >= 2) {
                updateValueWithAnimation(`count-new-${data.name}`, data.count[1]); // 新記錄數
                updateValueWithAnimation(`count-dev-${data.name}`, data.count[0]); // 裝置記錄數
            }
            
            if (data.trigger !== undefined) {
                updateValueWithAnimation(`trigger-val-${data.name}`, data.trigger ? "1" : "0");
                const triggerIndicator = document.getElementById(`trigger-${data.name}`);
                if (data.trigger) {
                    triggerIndicator.classList.add('active');
                } else {
                    triggerIndicator.classList.remove('active');
                }
            }
        }

        function formatNumber(num) {
            let n = Number(num);
            if (isNaN(n)) return "0.000";
            let str = Math.abs(n).toFixed(3);
            return (n < 0 ? '-' : ' ') + str.padStart(5, '0');
        }

        function createDeviceCard(name) {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `device-${name}`;

            card.innerHTML = `
                <div class="device-header">
