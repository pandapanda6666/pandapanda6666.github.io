<!DOCTYPE html>
<html lang='zh-TW'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>3D無人機模擬器</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; }
        #ui-container { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px; color: white; }
        button { padding: 10px 15px; font-size: 16px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 4px; margin-bottom: 10px; width: 100%; display: block; box-sizing: border-box; }
        button:hover { background-color: #45a049; }
        .instructions { font-size: 14px; line-height: 1.5; margin-top: 10px; }
        footer { position: absolute; bottom: 10px; width: 100%; text-align: center; color: white; z-index: 10; font-size: 14px; text-shadow: 1px 1px 2px black; }
        footer a { color: #4CAF50; text-decoration: none; }
        footer a:hover { text-decoration: underline; }
        #model-select-container { position: absolute; top: 20px; right: 20px; z-index: 10; background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px; color: white; display: flex; flex-direction: column; }
        select { padding: 8px; margin-top: 5px; border-radius: 4px; background: #333; color: white; border: 1px solid #555; font-size: 14px; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; display: none; z-index: 5; pointer-events: none; }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: rgba(255,0,0,0.8); transform: translate(-50%, -50%); border-radius: 50%; }
    </style>
    <!-- 引入 Three.js 與 OrbitControls -->
    <script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js'></script>
</head>
<body>
    <div id='crosshair'></div>
    <div id='ui-container'>
        <button id='viewSwitchBtn'>目前視角：第三人稱 (滑鼠可控制)</button>
        <button id='modeSwitchBtn'>目前模式：美國手</button>

            左右鍵：水平轉動 (Yaw)<br>
            W S 鍵：前後傾斜 (Pitch)<br>
            A D 鍵：左右傾斜 (Roll)<br><br>
            [滑鼠操作]<br>
            左鍵拖曳：旋轉視角<br>
            滾輪：放大縮小
        </div>
    </div>

    <footer>版權所有 © 2026 <a href='https://pandapanda6666.github.io' target='_blank'>PandaPanda的AI日常</a> All Rights Reserved.</footer>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 滑鼠控制 (OrbitControls)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // 不允許轉到地底太深

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const gridHelper = new THREE.GridHelper(20, 20, 0x555555, 0x888888);
        gridHelper.position.y = -2;
        scene.add(gridHelper);

        const droneGroup = new THREE.Group();
        scene.add(droneGroup);

        const propellers = []; 
        const fpvCameraPos = new THREE.Vector3(0, 0.1, -0.3);
        let currentCamTilt = 0;

        function buildDrone(seedStr) {
            while(droneGroup.children.length > 0){ droneGroup.remove(droneGroup.children[0]); }
            
            let hash = 0;
            for (let i = 0; i < seedStr.length; i++) { hash = seedStr.charCodeAt(i) + ((hash << 5) - hash); }
            function random() { var x = Math.sin(hash++) * 10000; return x - Math.floor(x); }

            // 超級真實無人機材質
            const carbonMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8, metalness: 0.2 });
            const standoffMat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(random(), 0.8, 0.5), metalness: 0.7, roughness: 0.2 });
            const stackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            const motorStatorMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 });
            const motorBellMat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(random(), 0.7, 0.4), metalness: 0.9, roughness: 0.1 });
            const propMat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(random(), 0.9, 0.3), transparent: true, opacity: 0.6, side: THREE.DoubleSide });
            const camMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.7 });
            const lensMat = new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 1.0, roughness: 0.0 });
            const batteryMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 });
            const strapMat = new THREE.MeshStandardMaterial({ color: 0xaa0000, roughness: 0.9 });

            const isXFrame = random() > 0.5;
            const armAngle = isXFrame ? Math.PI / 4 : (Math.PI / 6 + random() * 0.2);
            const armLength = 0.5 + random() * 0.5;
            const propRadius = 0.3 + random() * 0.25;

            // 1. 底板 (Bottom Plate)
            const bottomPlateGeo = new THREE.BoxGeometry(0.25, 0.04, 0.5);
            const bottomPlate = new THREE.Mesh(bottomPlateGeo, carbonMat);
            bottomPlate.castShadow = true;
            droneGroup.add(bottomPlate);

            // 2. 頂板 (Top Plate)
            const topPlateGeo = new THREE.BoxGeometry(0.2, 0.03, 0.35);
            const topPlate = new THREE.Mesh(topPlateGeo, carbonMat);
            topPlate.position.y = 0.22;
            topPlate.castShadow = true;
            droneGroup.add(topPlate);

            // 3. 鋁柱 (Standoffs)
            for (let i of [-1, 1]) {
                for (let j of [-1, 1]) {
                    const standoffGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.18, 8);
                    const standoff = new THREE.Mesh(standoffGeo, standoffMat);
                    standoff.position.set(i * 0.08, 0.11, j * 0.12);
                    droneGroup.add(standoff);
                }
            }

            // 4. 飛控電變塔 (FC/ESC Stack)
            const escGeo = new THREE.BoxGeometry(0.14, 0.03, 0.14);
            const esc = new THREE.Mesh(escGeo, stackMat);
            esc.position.set(0, 0.05, 0);
            droneGroup.add(esc);
            
            const fcGeo = new THREE.BoxGeometry(0.14, 0.03, 0.14);
            const fc = new THREE.Mesh(fcGeo, stackMat);
            fc.position.set(0, 0.1, 0);
            droneGroup.add(fc);

            // 5. 電池與綁帶 (Battery & Strap)
            const hasBatteryTop = random() > 0.5;
            const batGeo = new THREE.BoxGeometry(0.18, 0.15, 0.35);
            const bat = new THREE.Mesh(batGeo, batteryMat);
            bat.position.y = hasBatteryTop ? 0.31 : -0.11;
            droneGroup.add(bat);

            const strapGeo = new THREE.BoxGeometry(0.19, 0.16, 0.06);
            const strap = new THREE.Mesh(strapGeo, strapMat);
            strap.position.y = hasBatteryTop ? 0.31 : -0.11;
            droneGroup.add(strap);

            // 6. FPV 攝影機 (Camera)
            // ThreeJS預設看向-Z，所以模型頭部為-Z
            currentCamTilt = Math.PI / 12 + random() * (Math.PI / 6); // 仰角 15~45度
            const camGroup = new THREE.Group();
            const camBodyGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const camBody = new THREE.Mesh(camBodyGeo, camMat);
            camGroup.add(camBody);
            
            const lensGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.08, 16);
            const lens = new THREE.Mesh(lensGeo, lensMat);
            lens.rotation.x = Math.PI / 2;
            lens.position.z = -0.05;
            camGroup.add(lens);
            
            camGroup.position.set(0, 0.11, -0.22);
            camGroup.rotation.x = currentCamTilt; // 往上仰
            droneGroup.add(camGroup);

            // 更新 FPV 相機掛載點 (微調位置到鏡頭前方)
            fpvCameraPos.set(0, 0.11 + Math.sin(currentCamTilt)*0.08, -0.22 - Math.cos(currentCamTilt)*0.08);

            // 7. 機臂與馬達 (Arms & Motors)
            const armX = Math.sin(armAngle) * armLength;
            const armZ = Math.cos(armAngle) * armLength;
            propellers.length = 0;

            function createArm(targetX, targetZ) {
                const armGroup = new THREE.Group();
                
                // 獨立碳纖維機臂
                const dist = Math.sqrt(targetX*targetX + targetZ*targetZ);
                const armGeo = new THREE.BoxGeometry(0.06, 0.04, dist);
                armGeo.translate(0, 0, dist / 2);
                const arm = new THREE.Mesh(armGeo, carbonMat);
                arm.rotation.y = Math.atan2(targetX, targetZ);
                armGroup.add(arm);

                // 馬達與螺旋槳掛載點
                const motorPos = new THREE.Vector3(targetX, 0.02, targetZ);
                
                // 定子 (Stator)
                const statorGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.04, 16);
                const stator = new THREE.Mesh(statorGeo, motorStatorMat);
                stator.position.copy(motorPos);
                stator.position.y += 0.02;
                armGroup.add(stator);

                // 轉子 (Bell)
                const bellGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.06, 16);
                const bell = new THREE.Mesh(bellGeo, motorBellMat);
                bell.position.copy(motorPos);
                bell.position.y += 0.07;
                armGroup.add(bell);

                // 螺旋槳 (Propellers)
                const propGroup = new THREE.Group();
                const numBlades = random() > 0.5 ? 3 : 2;
                for (let i = 0; i < numBlades; i++) {
                    const bladeGeo = new THREE.BoxGeometry(propRadius, 0.005, 0.04);
                    const bladeMesh = new THREE.Mesh(bladeGeo, propMat);
                    bladeMesh.position.x = propRadius / 2;
                    bladeMesh.rotation.x = Math.PI / 15; 
                    
                    const pivot = new THREE.Group();
                    pivot.rotation.y = (Math.PI * 2 / numBlades) * i;
                    pivot.add(bladeMesh);
                    propGroup.add(pivot);
                }
                const nutGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.04, 8);
                const nut = new THREE.Mesh(nutGeo, standoffMat);
                nut.position.y = 0.02;
                propGroup.add(nut);

                propGroup.position.copy(motorPos);
                propGroup.position.y += 0.11;
                armGroup.add(propGroup);
                propellers.push(propGroup);

                droneGroup.add(armGroup);
            }

            createArm(-armX, -armZ); // LF
            createArm(armX, -armZ);  // RF
            createArm(-armX, armZ);  // LR
            createArm(armX, armZ);   // RR
        }

        const modelSelect = document.getElementById('droneModelSelect');
        modelSelect.addEventListener('change', (e) => {
            buildDrone(e.target.value);
            if (isFPV) resetFPVCamera();
        });
        buildDrone(modelSelect.value);

        // --- 視角切換邏輯 (FPV / TPV) ---
        let isFPV = false;
        const viewSwitchBtn = document.getElementById('viewSwitchBtn');
        const crosshair = document.getElementById('crosshair');

        function resetFPVCamera() {
            camera.position.copy(fpvCameraPos);
            // 讓相機跟隨鏡頭仰角，由於原本向-Z，X軸仰角為正值
            camera.rotation.set(currentCamTilt, 0, 0, 'YXZ');
        }

        viewSwitchBtn.addEventListener('click', () => {
            isFPV = !isFPV;
            if (isFPV) {
                viewSwitchBtn.textContent = '目前視角：FPV 相機視角 (無滑鼠控制)';
                controls.enabled = false;
                crosshair.style.display = 'block';
                droneGroup.add(camera); // 將相機綁定到無人機群組
                resetFPVCamera();
            } else {
                viewSwitchBtn.textContent = '目前視角：第三人稱 (滑鼠可控制)';
                controls.enabled = true;
                crosshair.style.display = 'none';
                droneGroup.remove(camera);
                scene.add(camera);
                camera.position.set(0, 2, 5);
                camera.lookAt(0, 0, 0);
            }
        });

        // --- 控制邏輯 ---
        let controlMode = 'american';
        const keys = { w: false, a: false, s: false, d: false, up: false, down: false, left: false, right: false };

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = true;
            if (key === 'a') keys.a = true;
            if (key === 's') keys.s = true;
            if (key === 'd') keys.d = true;
            if (e.key === 'ArrowUp') keys.up = true;
            if (e.key === 'ArrowDown') keys.down = true;
            if (e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'ArrowRight') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = false;
            if (key === 'a') keys.a = false;
            if (key === 's') keys.s = false;
            if (key === 'd') keys.d = false;
            if (e.key === 'ArrowUp') keys.up = false;
            if (e.key === 'ArrowDown') keys.down = false;
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
        });

        const modeSwitchBtn = document.getElementById('modeSwitchBtn');
        const instructionsText = document.getElementById('instructionsText');
        modeSwitchBtn.addEventListener('click', () => {
            if (controlMode === 'american') {
                controlMode = 'japanese';
                modeSwitchBtn.textContent = '目前模式：日本手';
                instructionsText.innerHTML = 
                    [日本手 操作說明]<br>
                    W S 鍵：油門 (螺旋槳加速)<br>
                    A D 鍵：水平轉動 (Yaw)<br>
                    上下鍵：前後傾斜 (Pitch)<br>
                    左右鍵：左右傾斜 (Roll)<br><br>
                    [滑鼠操作]<br>
                    左鍵拖曳：旋轉視角<br>
                    滾輪：放大縮小
                ;
            } else {
                controlMode = 'american';
                modeSwitchBtn.textContent = '目前模式：美國手';
                instructionsText.innerHTML = 
                    [美國手 操作說明]<br>
                    上下鍵：油門 (螺旋槳加速)<br>
                    左右鍵：水平轉動 (Yaw)<br>
                    W S 鍵：前後傾斜 (Pitch)<br>
                    A D 鍵：左右傾斜 (Roll)<br><br>
                    [滑鼠操作]<br>
                    左鍵拖曳：旋轉視角<br>
                    滾輪：放大縮小
                ;
            }
        });

        let targetPitch = 0;
        let targetRoll = 0;
        const maxTilt = Math.PI / 5;
        const maxYaw = 8 * (Math.PI / 180);
        const lerpSpeed = 0.1;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            if (!isFPV) {
                controls.update(); // 更新滑鼠控制
            }

            let inputThrottle = 0, inputYaw = 0, inputPitch = 0, inputRoll = 0;
            if (controlMode === 'american') {
                if (keys.up) inputThrottle += 1;
                if (keys.down) inputThrottle -= 1;
                if (keys.left) inputYaw += 1;
                if (keys.right) inputYaw -= 1;
                if (keys.w) inputPitch += 1;
                if (keys.s) inputPitch -= 1;
                if (keys.a) inputRoll += 1;
                if (keys.d) inputRoll -= 1;
            } else {
                if (keys.w) inputThrottle += 1;
                if (keys.s) inputThrottle -= 1;
                if (keys.a) inputYaw += 1;
                if (keys.d) inputYaw -= 1;
                if (keys.up) inputPitch += 1;
                if (keys.down) inputPitch -= 1;
                if (keys.left) inputRoll += 1;
                if (keys.right) inputRoll -= 1;
            }

            targetPitch = -inputPitch * maxTilt;
            targetRoll = inputRoll * maxTilt;
            const targetYaw = inputYaw * maxYaw; 

            const currentPitch = THREE.MathUtils.lerp(droneGroup.rotation.x, targetPitch, lerpSpeed);
            const currentRoll = THREE.MathUtils.lerp(droneGroup.rotation.z, targetRoll, lerpSpeed);
            const currentYaw = THREE.MathUtils.lerp(droneGroup.rotation.y, targetYaw, lerpSpeed);
            
            droneGroup.rotation.set(currentPitch, currentYaw, currentRoll, 'YXZ');

            const baseSpeed = 0.1;
            const extraSpeed = (inputThrottle !== 0 || inputPitch !== 0 || inputRoll !== 0 || inputYaw !== 0) ? 0.8 : 0;
            const totalSpeed = baseSpeed + extraSpeed;

            if (propellers.length === 4) {
                propellers[0].rotation.y += totalSpeed; 
                propellers[1].rotation.y -= totalSpeed; 
                propellers[2].rotation.y -= totalSpeed; 
                propellers[3].rotation.y += totalSpeed; 
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
