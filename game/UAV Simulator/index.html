<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D無人機模擬器</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* 天空藍背景 */
            font-family: sans-serif;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: white;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .instructions {
            font-size: 14px;
            line-height: 1.5;
        }
        footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: white;
            z-index: 10;
            font-size: 14px;
            text-shadow: 1px 1px 2px black;
        }
        footer a {
            color: #4CAF50;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <button id="modeSwitchBtn">目前模式：美國手</button>
        <div class="instructions" id="instructionsText">
            [美國手 操作說明]<br>
            上下鍵：油門 (螺旋槳加速)<br>
            左右鍵：水平轉動 (Yaw)<br>
            W S 鍵：前後傾斜 (Pitch)<br>
            A D 鍵：左右傾斜 (Roll)
        </div>
    </div>

    <!-- 版權宣告 -->
    <footer>版權所有 © 2026 <a href="https://pandapanda6666.github.io" target="_blank">PandaPanda的AI日常</a> All Rights Reserved.</footer>

    <script>
        // 版權所有 © 2026 PandaPanda的AI日常 (https://pandapanda6666.github.io) All Rights Reserved.

        // 基本場景設置
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 6);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 燈光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // 網格地板 (提供視覺參考)
        const gridHelper = new THREE.GridHelper(20, 20, 0x555555, 0x888888);
        gridHelper.position.y = -2;
        scene.add(gridHelper);

        // 建立無人機模型
        const droneGroup = new THREE.Group();
        scene.add(droneGroup);

        const materials = {
            body: new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.7 }),
            armFront: new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.5 }),
            armBack: new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 }),
            motor: new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.2 }),
            propeller: new THREE.MeshStandardMaterial({ color: 0x000000, transparent: true, opacity: 0.7 }),
            camera: new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 0.9 })
        };

        // 1. 中央機身
        const bodyGeo = new THREE.BoxGeometry(0.8, 0.3, 1.2);
        const bodyMesh = new THREE.Mesh(bodyGeo, materials.body);
        bodyMesh.castShadow = true;
        droneGroup.add(bodyMesh);

        // 2. 攝影機 (辨識前方)
        const camGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.2, 16);
        const camMesh = new THREE.Mesh(camGeo, materials.camera);
        camMesh.rotation.z = Math.PI / 2;
        camMesh.position.set(0, 0, -0.65);
        droneGroup.add(camMesh);

        // 機臂與馬達設置函數
        const propellers = []; // 儲存螺旋槳以便動畫旋轉
        function createArm(x, z, isFront) {
            const armGroup = new THREE.Group();
            
            // 機臂
            const armLength = 1.2;
            const armGeo = new THREE.CylinderGeometry(0.05, 0.05, armLength, 8);
            const armMesh = new THREE.Mesh(armGeo, isFront ? materials.armFront : materials.armBack);
            armMesh.rotation.x = Math.PI / 2;
            armMesh.position.set(0, 0, armLength / 2);
            armGroup.add(armMesh);

            // 馬達
            const motorGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.2, 16);
            const motorMesh = new THREE.Mesh(motorGeo, materials.motor);
            motorMesh.position.set(0, 0.1, armLength);
            armGroup.add(motorMesh);

            // 螺旋槳
            const propGroup = new THREE.Group();
            const propGeo = new THREE.BoxGeometry(1.0, 0.02, 0.1);
            const propMesh = new THREE.Mesh(propGeo, materials.propeller);
            propGroup.add(propMesh);
            propGroup.position.set(0, 0.25, armLength);
            armGroup.add(propGroup);
            
            propellers.push(propGroup);

            // 定位整個機臂
            const angle = Math.atan2(x, z);
            armGroup.rotation.y = angle;
            droneGroup.add(armGroup);
        }

        // 建立四個機臂 (X, Z座標) - Z軸負方向為前方
        createArm(-1, -1, true);  // 左前
        createArm(1, -1, true);   // 右前
        createArm(-1, 1, false);  // 左後
        createArm(1, 1, false);   // 右後

        // 控制狀態
        let controlMode = 'american'; // 'american' 或 'japanese'
        
        const keys = {
            w: false, a: false, s: false, d: false,
            up: false, down: false, left: false, right: false
        };

        // 按鍵監聽
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = true;
            if (key === 'a') keys.a = true;
            if (key === 's') keys.s = true;
            if (key === 'd') keys.d = true;
            if (e.key === 'ArrowUp') keys.up = true;
            if (e.key === 'ArrowDown') keys.down = true;
            if (e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'ArrowRight') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = false;
            if (key === 'a') keys.a = false;
            if (key === 's') keys.s = false;
            if (key === 'd') keys.d = false;
            if (e.key === 'ArrowUp') keys.up = false;
            if (e.key === 'ArrowDown') keys.down = false;
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
        });

        // UI 模式切換
        const modeSwitchBtn = document.getElementById('modeSwitchBtn');
        const instructionsText = document.getElementById('instructionsText');

        modeSwitchBtn.addEventListener('click', () => {
            if (controlMode === 'american') {
                controlMode = 'japanese';
                modeSwitchBtn.textContent = '目前模式：日本手';
                instructionsText.innerHTML = `
                    [日本手 操作說明]<br>
                    W S 鍵：油門 (螺旋槳加速)<br>
                    A D 鍵：水平轉動 (Yaw)<br>
                    上下鍵：前後傾斜 (Pitch)<br>
                    左右鍵：左右傾斜 (Roll)
                `;
            } else {
                controlMode = 'american';
                modeSwitchBtn.textContent = '目前模式：美國手';
                instructionsText.innerHTML = `
                    [美國手 操作說明]<br>
                    上下鍵：油門 (螺旋槳加速)<br>
                    左右鍵：水平轉動 (Yaw)<br>
                    W S 鍵：前後傾斜 (Pitch)<br>
                    A D 鍵：左右傾斜 (Roll)
                `;
            }
        });

        // 動畫變數
        let targetPitch = 0;
        let targetRoll = 0;
        const maxTilt = Math.PI / 6; // 最大傾斜角 30度
        const maxYaw = 10 * (Math.PI / 180); // 最大旋轉角 10度 (轉換為弧度)
        const lerpSpeed = 0.1;       // 平滑過渡速度

        // 視窗縮放適應
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 渲染迴圈
        function animate() {
            requestAnimationFrame(animate);

            // 解析控制輸入
            let inputThrottle = 0;
            let inputYaw = 0;
            let inputPitch = 0;
            let inputRoll = 0;

            if (controlMode === 'american') {
                // 美國手邏輯
                if (keys.up) inputThrottle += 1;
                if (keys.down) inputThrottle -= 1;
                if (keys.left) inputYaw += 1;
                if (keys.right) inputYaw -= 1;
                
                if (keys.w) inputPitch += 1;
                if (keys.s) inputPitch -= 1;
                if (keys.a) inputRoll += 1;
                if (keys.d) inputRoll -= 1;
            } else {
                // 日本手邏輯 (WSAD 與 方向鍵反轉)
                if (keys.w) inputThrottle += 1;
                if (keys.s) inputThrottle -= 1;
                if (keys.a) inputYaw += 1;
                if (keys.d) inputYaw -= 1;
                
                if (keys.up) inputPitch += 1;
                if (keys.down) inputPitch -= 1;
                if (keys.left) inputRoll += 1;
                if (keys.right) inputRoll -= 1;
            }

            // 計算姿態目標值
            // Pitch (前後傾斜) - 往前傾(W)代表機頭朝下，即繞X軸旋轉負值
            targetPitch = -inputPitch * maxTilt;
            // Roll (左右傾斜) - 修正反轉問題，往左傾對應Z軸正旋轉
            targetRoll = inputRoll * maxTilt;
            // Yaw (水平轉動) - 限制轉動 10 度，無輸入時為 0 以便回正
            const targetYaw = inputYaw * maxYaw; 

            // 平滑套用旋轉 (使用 YXZ 順序確保萬向節鎖問題減輕，Yaw作為基底)
            const currentPitch = THREE.MathUtils.lerp(droneGroup.rotation.x, targetPitch, lerpSpeed);
            const currentRoll = THREE.MathUtils.lerp(droneGroup.rotation.z, targetRoll, lerpSpeed);
            const currentYaw = THREE.MathUtils.lerp(droneGroup.rotation.y, targetYaw, lerpSpeed);
            
            droneGroup.rotation.set(currentPitch, currentYaw, currentRoll, 'YXZ');

            // 螺旋槳動畫邏輯
            // 基礎轉速 + 油門加速 + 姿態控制造成的差速視覺效果
            const baseSpeed = 0.2;
            const extraSpeed = (inputThrottle !== 0 || inputPitch !== 0 || inputRoll !== 0 || inputYaw !== 0) ? 0.6 : 0;
            const totalSpeed = baseSpeed + extraSpeed;

            // 簡單設定交錯旋轉方向
            propellers[0].rotation.y += totalSpeed; // 左前
            propellers[1].rotation.y -= totalSpeed; // 右前
            propellers[2].rotation.y -= totalSpeed; // 左後
            propellers[3].rotation.y += totalSpeed; // 右後

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
