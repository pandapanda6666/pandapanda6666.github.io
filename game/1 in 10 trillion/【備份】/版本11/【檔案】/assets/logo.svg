<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 典雅底色漸層 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1614" />
      <stop offset="50%" stop-color="#38101C" />
      <stop offset="100%" stop-color="#0F0C0B" />
    </linearGradient>

    <!-- 勃艮第紅環漸層 -->
    <linearGradient id="burgundyRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C23B5A" />
      <stop offset="50%" stop-color="#8C1D3C" />
      <stop offset="100%" stop-color="#540B1F" />
    </linearGradient>

    <!-- 典雅琥珀金光暈 -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="50%" stop-color="#E5B242" />
      <stop offset="100%" stop-color="#9E6D18" />
    </linearGradient>

    <!-- 生態翠綠微光 -->
    <linearGradient id="emeraldAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#15803D" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 外層深邃圓形底座 -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGlow)" stroke-width="6" />

  <!-- 外圍十芒星軌（象徵十兆生靈） -->
  <g stroke="url(#goldGlow)" stroke-width="2" opacity="0.45">
    <line x1="256" y1="20" x2="256" y2="492" />
    <line x1="20" y1="256" x2="492" y2="256" />
    <line x1="89" y1="89" x2="423" y2="423" />
    <line x1="423" y1="89" x2="89" y2="423" />
    <circle cx="256" cy="256" r="216" fill="none" stroke-dasharray="6,8" />
    <circle cx="256" cy="256" r="188" fill="none" stroke-width="1.5" />
  </g>

  <!-- 勃艮第核心徽印圈 -->
  <circle cx="256" cy="256" r="168" fill="url(#burgundyRing)" stroke="url(#goldGlow)" stroke-width="4" filter="url(#glowEffect)" />

  <!-- 羅盤刻度點 (12方位生態節氣) -->
  <g fill="url(#goldGlow)">
    <circle cx="256" cy="100" r="4.5" />
    <circle cx="334" cy="120" r="3" />
    <circle cx="392" cy="178" r="3" />
    <circle cx="412" cy="256" r="4.5" />
    <circle cx="392" cy="334" r="3" />
    <circle cx="334" cy="392" r="3" />
    <circle cx="256" cy="412" r="4.5" />
    <circle cx="178" cy="392" r="3" />
    <circle cx="120" cy="334" r="3" />
    <circle cx="100" cy="256" r="4.5" />
    <circle cx="120" cy="178" r="3" />
    <circle cx="178" cy="120" r="3" />
  </g>

  <!-- 野性圖騰：星宿狼爪印 (中央主體，象徵荒野萬物靈魂) -->
  <g fill="url(#goldGlow)">
    <!-- 四爪瓣 (微傾斜，展現靈動奔跑感) -->
    <!-- 左一爪 -->
    <ellipse cx="178" cy="208" rx="20" ry="32" transform="rotate(-24 178 208)" />
    <!-- 左二中爪 -->
    <ellipse cx="228" cy="170" rx="22" ry="36" transform="rotate(-8 228 170)" />
    <!-- 右二中爪 -->
    <ellipse cx="284" cy="170" rx="22" ry="36" transform="rotate(8 284 170)" />
    <!-- 右一爪 -->
    <ellipse cx="334" cy="208" rx="20" ry="32" transform="rotate(24 334 208)" />

    <!-- 主掌墊 (優美野性心形弧線) -->
    <path d="M 256 244 
             C 214 244, 172 268, 184 316 
             C 194 354, 230 366, 256 352 
             C 282 366, 318 354, 328 316 
             C 340 268, 298 244, 256 244 Z" />
  </g>

  <!-- 掌心中嵌宿命「1」的星之微光 (象徵十兆分之「1」的唯一性) -->
  <g fill="#FFFFFF" opacity="0.95">
    <path d="M 250 286 L 256 280 L 262 286 L 262 322 L 250 322 Z" />
    <circle cx="256" cy="268" r="3" />
  </g>

  <!-- 頂部北極星芒 (象徵荒野先祖之光) -->
  <polygon points="256,48 262,72 286,78 262,84 256,108 250,84 226,78 250,72" fill="url(#goldGlow)" />
</svg>
